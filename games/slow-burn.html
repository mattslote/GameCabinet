html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:8px/1.5 var(--px);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
canvas#c{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
canvas#sk{position:absolute;left:0;top:0;pointer-events:none;display:block}
.px{background:var(--panel);border:2px solid var(--edge);box-shadow:0 0 0 2px #1a0d1c,inset 0 0 0 2px rgba(0,0,0,.35)}
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;
 padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.bars{display:flex;flex-direction:column;gap:5px;flex:1;max-width:230px}
.bar{display:flex;align-items:center;gap:6px;padding:5px 6px;height:24px}
.bl{width:34px;color:var(--mute);font-size:7px}
.bt{flex:1;height:8px;background:#2a1626;border:1px solid #000;position:relative;overflow:hidden}
.bt i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#ffd27a,#ff8a3c)}
.bv{width:36px;text-align:right;font-size:7px}
.hb{display:flex;gap:6px;pointer-events:auto}
.ib{font:7px var(--px);color:var(--text);background:var(--panel);border:2px solid var(--edge);padding:8px 7px;cursor:pointer;box-shadow:0 0 0 2px #1a0d1c}
.ib:active{transform:translateY(2px)}
#hint{position:absolute;left:0;right:0;text-align:center;font-size:8px;line-height:1.7;color:#ffe3a8;text-shadow:1px 1px 0 #000,-1px 1px 0 #000;
 padding:0 18px;pointer-events:none;opacity:0;transition:opacity .6s}
#hint.on{opacity:1}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);max-width:88%;padding:8px 10px;font-size:8px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#tray{position:absolute;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
 background:linear-gradient(rgba(12,7,18,0),rgba(12,7,18,.86) 22%);display:flex;flex-direction:column;gap:6px}
#wood,#tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#tools{grid-template-columns:repeat(4,1fr)}
.cell{position:relative;height:54px;background:var(--panel);border:2px solid var(--edge2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:none;cursor:grab}
.cell canvas{image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
.cell .lb{font-size:6px;color:var(--mute);pointer-events:none;letter-spacing:.5px}
.cell .n{position:absolute;right:4px;top:4px;font-size:7px;color:var(--text);pointer-events:none}
.cell.dim{opacity:.35}
.cell.sel{border-color:var(--edge)}
.cell .gbar{position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:#2a1626}
.cell .gbar i{display:block;height:100%;width:0;background:var(--hot)}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,4,14,.74);padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{width:100%;max-width:380px;padding:18px 16px;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:22px;line-height:1.2;color:#ffd27a;text-shadow:3px 3px 0 #b3401c}
.card h2{margin:0 0 10px;font-size:11px;line-height:1.5;color:#ffd27a}
.card .sub{font-size:7px;color:var(--mute);margin:0 0 14px;line-height:1.8}
.card p{font-size:8px;line-height:1.9;margin:0 0 12px}
.pl{display:flex;gap:10px;align-items:center;width:100%;padding:8px;margin:0 0 8px;text-align:left;font:8px/1.6 var(--px);color:var(--text);background:#241028;border:2px solid var(--edge2);cursor:pointer}
.pl:active{transform:translateY(2px)}
.pl .th{width:46px;height:46px;flex:none;border:2px solid #000;image-rendering:pixelated}
.pl b{display:block;font-weight:400;font-size:9px;color:#ffd27a;margin-bottom:3px}
.pl span{font-size:7px;color:var(--mute);line-height:1.6}
.btn{font:9px var(--px);color:#2a0f06;background:linear-gradient(#ffd27a,#f0963c);border:2px solid #fff0c4;padding:11px 12px;cursor:pointer;box-shadow:0 3px 0 #8a3c18;width:100%;margin:0 0 8px}
.btn.sec{color:var(--text);background:#241028;border-color:var(--edge2);box-shadow:0 3px 0 #0c0510}
.btn:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:7px}
.row label{width:84px;color:var(--mute);flex:none}
.row input[type=range]{flex:1;accent-color:#ff8a3c;height:22px;min-width:0}
.row .v{width:28px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:7px;color:var(--mute)}
.chk input{width:18px;height:18px;accent-color:#ff8a3c}
.stat{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:2px solid #2d1830;font-size:8px}
.stat span:first-child{color:var(--mute)}
@media (orientation:landscape) and (min-aspect-ratio:23/20){
 #tray{flex-direction:row;align-items:flex-end;gap:10px}
 #wood{flex:6;grid-template-columns:repeat(6,1fr)}
 #tools{flex:4}
 .cell{height:48px}
 .card{max-width:420px}
}
@media (prefers-reduced-motion:reduce){#hint,#toast{transition:none}}

  DPR=Math.min(3,window.devicePixelRatio||1);sk.width=Math.round(LW*P*DPR);sk.height=Math.round(LH*P*DPR);sk.style.width=(LW*P)+'px';sk.style.height=(LH*P)+'px';mk.width=LW;mk.height=LH;mkImg=mkx.createImageData(LW,LH);

function ridgeLine(c,base,amp,f1,f2,ph,color,gapX){

function stoneRing(b,f,rng,tone,ashC){
  var cx=pit.cx,cy=pit.fy-1,rx=pit.hw+7,ry=7,i;

  for(i=0;i<34;i++){var a=rng()*6.283,rd=rng();var px=Math.round(cx+Math.cos(a)*rd*(pit.hw+1)),py=Math.round(cy+Math.sin(a)*rd*4);var g=ashC[0]+14+rng()*26;R(b,px,py,1,1,col(g,g-3,g-6));}

    T:0,st:0,fuel:1,soak:0,cold:0,age:0,seed:(Math.random()*1e6)|0,moist:.9+Math.random()*.3,oxy:1,pw:0,ho:0,heat:0};

/* collision box = bounding box of the (possibly leaning) piece */
function fit(p){

  if(p.kind==='tinder'||a<.01){p.w=p.sw;p.h=sh;}
  else{var s=Math.sin(a),c=Math.cos(a);p.w=Math.round(p.sw*c+sh*s);p.h=Math.max(1,Math.round(p.sw*s+sh*c));}

function slideDir(p){

  for(x=0;x<p.w;x++){
    var cov=false,pB=p.rb-p.h+(p.yB?p.yB[x]:p.h);
    for(i=0;i<pieces.length;i++){
      q=pieces[i];if(q===p)continue;prof(q);
      var qi=Math.floor(p.rx+x+.5-q.rx);if(qi<0||qi>=q.w)continue;
      if(Math.abs(q.rb-q.h+(q.yT?q.yT[qi]:0)-pB)<=1.3){cov=true;break;}
    }
    if(cov){if(x<half)cl++;else cr++;}
  }
  var c=cl+cr;
  if(p.yB){if(c>=2)return 0;return p.ang<0?-1:1;}
  if(c>=p.w*.7)return 0;
  if(cl>=3&&cr>=3)return 0;

function curH(p){

  if(p.kind==='tinder'||Math.abs(p.ang||0)<.01){p.yT=null;p.yB=null;return;}
  var c=Math.cos(p.ang),s=Math.sin(p.ang),hw=p.sw/2,hh=p.sh/2,i,y;
  p.yT=new Float32Array(p.w);p.yB=new Float32Array(p.w);

    }
    if(mx<mn){mn=0;mx=p.h;}

  return t;

function absX(p){return pit.cx+p.rx;}
function absY0(p){return pit.fy+p.rb-p.h;}

var audioEv=null; /* set by audio part: function(name,val,x) */
function ev(name,val,x){

}
/* where would this piece land if the finger is at fx (relative to the pit centre)?

function planDrop(p,fx){
  var hw=pit.hw,out={lean:false};
  p.ang=0;fit(p);
  out.rx=clamp(Math.round(fx-p.w/2),-hw,hw-p.w);out.lb=restRb(p,out.rx,false);
  if(p.kind==='tinder'||Math.abs(fx)<4)return out;
  var side=fx<0?-1:1,L=p.w,ax=Math.abs(fx)-2,m,f,fo=Math.abs(fx);
  function at(mm,ff){p.ang=side*mm;fit(p);var r=clamp(side<0?-Math.round(ff):Math.round(ff)-p.w,-hw,hw-p.w);return {rx:r,rb:restRb(p,r,false)};}

  for(f=fo;f<=hw-2;f+=2){
    if(at(1.4,f).rb>-1.2)break;
  }
  if(f<=hw-2&&pieces.length>2){
    var rb0=at(1.4,f).rb,found=0;
    for(m=1.4;m>=.35;m-=.05){if(at(m,f).rb<rb0-.6){found=m;break;}}
    if(found){
      var lo=found,hi=found+.05;
      for(var k=0;k<6;k++){var mid=(lo+hi)/2;if(at(mid,f).rb<rb0-.3)lo=mid;else hi=mid;}
      var a2=at(lo,f);out.rx=a2.rx;out.lb=a2.rb;out.lean=a2.rb>-2;if(!out.lean){p.ang=0;fit(p);out.rx=clamp(Math.round(fx-p.w/2),-hw,hw-p.w);out.lb=restRb(p,out.rx,false);}return out;
    }
  }

  p.ang=side*m;fit(p);
  out.rx=clamp(side<0?Math.round(fx):Math.round(fx)-p.w,-hw,hw-p.w);out.lb=restRb(p,out.rx,false);out.lean=true;
  if(out.lb<-2){p.ang=0;fit(p);out.lean=false;out.rx=clamp(Math.round(fx-p.w/2),-hw,hw-p.w);out.lb=restRb(p,out.rx,false);}

/* embers and ash slump toward the middle of the ring and heap up */
function creep(p,dt){
  var c=p.rx+p.w/2;if(Math.abs(c)<1.5)return;
  var dir=c>0?-1:1,nx=p.rx+dir*(p.st===2?7:4)*dt,pt=p.rb-p.h,i,q,climb=false;
  for(i=0;i<pieces.length;i++){
    q=pieces[i];if(q===p)continue;
    if(nx+p.w<=q.rx||nx>=q.rx+q.w)continue;
    if(q.rb<=pt+.6||q.rb-q.h>=p.rb-.6)continue;
    if(q.st>=2&&pt>-9)climb=true;else return;
  }

  if(climb){var rb=restRb(p,nx,false,pt);if(rb<p.rb-.5){p.rb=rb;p.vy=0;}}
}
function settleOld(dt){
  var i,p,n=pieces.length;
  if(!n)return;
  pieces.sort(function(a,b){return b.rb-a.rb;});
  for(i=0;i<n;i++){
    p=pieces[i];fit(p);
    if(Math.abs(p.ang||0)>.02&&(!p.lean||(p.st>=1&&(p.st>=2||p.fuel<.6)))){
      p.ang*=Math.max(0,1-dt*speedMul*(p.lean?.45:1.1));if(Math.abs(p.ang)<.03)p.ang=0;p.lean=false;
      fit(p);var rbc=restRb(p,p.rx,false,p.rb-p.h);if(rbc<p.rb-.5){p.rb=rbc;p.vy=0;}
    }
    var tgt=supportRb(p);
    if(p.rb<tgt-.01){
      p.vy+=380*dt;p.rb=Math.min(tgt,p.rb+p.vy*dt);
      if(p.rb>=tgt-.001){
        if(p.vy>20){ev('place',Math.sqrt(KINDS[p.kind].mass/14)*clamp(p.vy/140,.3,1),pit.cx+p.rx+p.w/2);if(sim.flame>.1&&p.vy>60)emitSparks(pit.cx+p.rx+p.w/2,pit.fy+p.rb-p.h,Math.min(10,Math.round(p.vy/18)),1);}
        p.vy=0;
      }

function heatKernel(i,j){
  var dx=Math.max(0,Math.max(i.x0,j.x0)-Math.min(i.x1,j.x1)),dy=Math.max(0,Math.max(i.y0,j.y0)-Math.min(i.y1,j.y1));

function removeAsh(){

}
function simStep(dt){
  var n=pieces.length,i,j,p,q,K;
  for(i=0;i<n;i++){p=pieces[i];geom(p);p.heat=0;}
  for(i=0;i<n;i++){
    p=pieces[i];var cover=0;
    for(j=0;j<n;j++){
      if(i===j)continue;q=pieces[j];
      if(q.y1<=p.y0+1&&p.y0-q.y1<=18){var ox=Math.min(p.x1,q.x1)-Math.max(p.x0,q.x0);if(ox>=.5*Math.min(p.w,q.w))cover++;}
    }

    p.oxy=clamp(1.05-.2*cover,.25,1.1)+stk;
  }
  for(i=0;i<n;i++){
    p=pieces[i];K=KINDS[p.kind];
    if(p.st===1){var tf=clamp(p.T,.35,1.35);p.ho=K.hout*tf*Math.min(1.25,p.oxy)*(1+2.2*p.soak)*(1+.5*sim.flare);}
    else if(p.st===2){var cf=clamp(p.fuel/K.coalAt,0,1),ox=.8+.4*Math.min(1.3,p.oxy);var sg=1+.8*(p.stir||0);p.hov=K.hout*.32*(.6+.4*cf)*ox*sg;p.ho=(3.4+.45*K.hout)*(.45+.55*cf)*ox*sg;}
    else p.ho=0;

    p=pieces[i];if(p.ho<=0)continue;
    for(j=0;j<n;j++){if(i===j)continue;q=pieces[j];if(q.st>=2)continue;q.heat+=p.ho*heatKernel(p,q);}
  }
  if(drag&&drag.type==='lighter'&&drag.on){
    var tx=drag.x-pit.cx,ty=drag.y-pit.fy;
    for(i=0;i<n;i++){p=pieces[i];if(p.st>=2)continue;
      if(tx>=p.x0-3&&tx<=p.x1+3&&ty>=p.y0-3&&ty<=p.y1+3)p.heat+=.55*(1+8*p.soak);}
  }

    var massEff=K.mass*p.moist*(1-.85*p.soak),self=0;
    if(p.st===1)self=K.selfT*K.mass*p.moist*COOL*Math.min(1.2,p.oxy);else if(p.st===2)self=(1.25+1.6*(p.stir||0))*K.mass*p.moist*COOL;

    if(p.st===1){
      var rate=(.35+.75*clamp(p.T,0,1.4))*Math.pow(clamp(p.oxy,.3,1.4),.7);
      p.fuel-=dt*rate/K.dur;
      if(p.fuel<=K.coalAt)p.st=2;
      if(p.T<.5){p.cold+=dt;if(p.cold>6){p.st=0;p.cold=0;for(var s=0;s<6;s++)addSmoke(pit.cx+p.cx+(Math.random()-.5)*p.w*.6,pit.fy+p.y0,1.6);}}else p.cold=0;
      p.soak=Math.max(0,p.soak-dt*.3);
      p.pw=clamp(p.ho/3.4,.06,1.5);
      fl+=p.ho/3.4;
    }else if(p.st===2){
      p.fuel-=dt*.1*(1+2*(p.stir||0))/K.dur;p.stir=Math.max(0,(p.stir||0)-dt*.2);
      if(p.fuel<=0){p.fuel=0;p.st=3;p.age=0;sim.burned++;p.T=.2;}
      co+=(p.hov||0)/3.4;p.soak=0;
    }else if(p.st===3){p.age+=dt;p.T=Math.max(0,p.T-dt*.3);}

  sim.flare=Math.max(0,sim.flare-dt*1.1);

}

var PAL=null;
function buildPal(){
  var stops=[[3,0,0,0,0],[5,120,16,8,1],[9,190,36,8,1],[13,228,70,10,1],[17,246,110,14,1],[21,252,150,24,1],[25,255,196,48,1],[29,255,226,100,1],[33,255,244,170,1],[36,255,252,220,1]];
  PAL=[];
  for(var v=0;v<=36;v++){
    var a=0,b=stops[stops.length-1],k;
    if(v<3){PAL.push([0,0,0,0]);continue;}
    for(k=0;k<stops.length-1;k++){if(v<=stops[k+1][0]){a=stops[k];b=stops[k+1];break;}}
    var t=b[0]===a[0]?0:(v-a[0])/(b[0]-a[0]);
    PAL.push([a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t,1]);
  }
}

function resetFireGrid(){fg.fill(0);nf.fill(0);fgx0=pit.cx-(FW>>1);fgy0=pit.fy-FH+4;}
function fireStep(dt){
  var i,x,y,p;fgT+=dt;
  var clipGy=PDEF.indoor?(pit.fy-pit.ceil+2-fgy0):-1;
  var wind=Math.sin(fgT*.7)*.16+Math.sin(fgT*1.9)*.08,ctr=pit.cx-fgx0,lim=pit.hw+10;
  /* pull-based advection: every cell takes its heat from the row below, shifted by a coherent sway field */
  for(y=0;y<FH-1;y++){
    var row=y*FW,src=(y+1)*FW;
    for(x=0;x<FW;x++){
      var dxc=x-ctr,sw=Math.sin(x*.27+y*.26-fgT*5.2)*.6+Math.sin(x*.11-y*.2+fgT*3.3)*.5+(Math.random()-.5)*.3+wind+dxc*.03,xf=x+sw*1.0;
      if(xf<0)xf=0;else if(xf>FW-1.01)xf=FW-1.01;
      var xi=xf|0,tf=xf-xi,v=fg[src+xi]*(1-tf)+fg[src+xi+1]*tf;
      if(v<=0){nf[row+x]=0;continue;}
      var d=.36+.5*(Math.sin(x*.37+fgT*7.1+y*.2)*.5+.5)+Math.random()*.26;
      v-=d;nf[row+x]=v>0?v:0;
    }
  }
  nf[(FH-1)*FW]=0;
  for(x=0;x<FW;x++)nf[(FH-1)*FW+x]=0;
  var t=fg;fg=nf;nf=t;
  for(y=0;y<FH-1;y++)for(x=0;x<FW;x++){var ex=x-ctr;if(ex>lim||ex<-lim)fg[y*FW+x]=0;}
  var boost=Math.floor(4*clamp(sim.flame-.6,0,3))+Math.round(sim.flare*7);
  for(i=0;i<pieces.length;i++){
    p=pieces[i];
    if(p.st===1){
      var base=13+Math.round(18*Math.min(1.2,p.pw))+boost;
      prof(p);
      for(x=p.x0;x<=p.x1;x++){
        var gx=pit.cx+x-fgx0;if(gx<0||gx>=FW)continue;
        var ci=Math.min(p.w-1,Math.max(0,Math.floor(x-p.x0+.5))),gt=Math.round(pit.fy+p.y0+(p.yT?p.yT[ci]:0)-fgy0);
        var cov=1;
        for(var k2=0;k2<pieces.length;k2++){var o=pieces[k2];if(o===p||o.st>2)continue;if(x>=o.x0&&x<=o.x1&&o.y1<=p.y0+1.5&&o.y1>=p.y0-4){cov=.55;break;}}
        var tn=.5+.5*(Math.sin(gx*.58+fgT*4.4)*.5+Math.sin(gx*.23-fgT*2.9+p.seed)*.5),nz=.62+.75*Math.pow(tn,1.2);
        var edge=(x<p.x0+2||x>p.x1-2)?.7:1;
        if(Math.random()<.93){
          var yy=gt+((Math.random()*2)|0);if(yy<0||yy>=FH)continue;
          var vv=clamp((base*nz*edge*cov)+(Math.random()-.5)*3,4,sim.flare>.3?36:31),idx=yy*FW+gx;
          if(vv>fg[idx])fg[idx]=vv;
        }
      }
      /* flames lick up the ends of the piece too */
      var sidev=base*.55;
      if(!p.yT)for(var sy=p.y0;sy<=p.y1;sy++){
        var gyy=pit.fy+sy-fgy0;if(gyy<0||gyy>=FH)continue;
        for(var sd=0;sd<2;sd++){
          var gxx=pit.cx+(sd?p.x1+1:p.x0-1)-fgx0;if(gxx<0||gxx>=FW)continue;
          if(Math.random()<.5){var vs=clamp(sidev*(.6+Math.random()*.5),4,26),is=gyy*FW+gxx;if(vs>fg[is])fg[is]=vs;}
        }
      }
    }else if(p.st===2){
      var gy2=(pit.fy+p.y0-fgy0)-1,ci=clamp(p.fuel/KINDS[p.kind].coalAt,0,1);
      for(x=p.x0;x<=p.x1;x++){
        var gx2=pit.cx+x-fgx0;if(gx2<0||gx2>=FW)continue;
        if(Math.random()<.07+.07*ci){var y2=gy2;if(y2<0||y2>=FH)continue;var v2=4+Math.random()*(4+4*ci),i2=y2*FW+gx2;if(v2>fg[i2])fg[i2]=v2;}
      }
    }
  }
  if(sim.flare>.05){
    var fy=pit.fy-fgy0-3;
    for(x=-pit.hw+4;x<pit.hw-4;x+=2){var g3=pit.cx+x-fgx0;if(g3<0||g3>=FW||fy<0||fy>=FH)continue;if(Math.random()<.6){var iv=fy*FW+g3,vf=clamp(18+sim.flare*12+Math.random()*6,4,36);if(vf>fg[iv])fg[iv]=vf;}}
  }
  if(clipGy>=0)for(y=0;y<Math.min(FH,clipGy);y++)for(x=0;x<FW;x++)fg[y*FW+x]=0;
}

function emitSparks(x,y,n,pw){

  for(var i=0;i<n&&sp.length<220;i++){

    sp.push({x:x+(Math.random()-.5)*4,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:rr(.5,1.5),t:1});
  }
}
function emitEmber(x,y){
  var sp=particles.sparks;if(sp.length>220)return;
  sp.push({x:x,y:y,vx:(Math.random()-.5)*8,vy:-rr(12,30),l:0,m:rr(1.6,3.8),t:0});
}
function addSmoke(x,y,a){
  var s=particles.smoke;if(s.length>90)return;
  s.push({x:x,y:y,vx:(Math.random()-.5)*4,vy:-rr(9,17),l:0,m:rr(2.4,5),a:a||1,ph:Math.random()*6.28});
}
function updateParticles(dt,tNow){
  var i,sp=particles.sparks,sm=particles.smoke,dr=particles.drops;
  var wind=Math.sin(tNow*.5)*5;
  for(i=sp.length-1;i>=0;i--){
    var s=sp[i];s.l+=dt;
    if(s.l>=s.m||s.y<-4){sp.splice(i,1);continue;}
    if(s.t===1){s.vy+=34*dt;s.vx*=.995;}else{s.vy*=.998;s.vx+=(wind*.4+(Math.random()-.5)*14)*dt;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
  }
  var topY=PDEF.indoor?pit.fy-pit.ceil:-10;
  for(i=sm.length-1;i>=0;i--){
    var q=sm[i];q.l+=dt;
    if(q.l>=q.m||q.y<topY){sm.splice(i,1);continue;}
    q.x+=(q.vx+Math.sin(tNow*1.3+q.ph)*4+wind*.3)*dt;q.y+=q.vy*dt;
  }
  for(i=dr.length-1;i>=0;i--){
    var d=dr[i];d.vy+=260*dt;d.y+=d.vy*dt;
    var hit=false,rx=d.x-pit.cx,ry=d.y-pit.fy;
    for(var j=0;j<pieces.length;j++){
      var p=pieces[j];
      if(rx>=p.rx-1&&rx<=p.rx+p.w+1&&ry>=p.rb-p.h&&ry<=p.rb-p.h+4&&p.st<3){
        hit=true;p.soak=Math.min(1,p.soak+.03);
        for(var k=0;k<pieces.length;k++){var o=pieces[k];if(o!==p&&o.st<3&&Math.abs(o.rx+o.w/2-(p.rx+p.w/2))<p.w*.7+o.w*.5&&Math.abs((o.rb-o.h)-(p.rb-p.h))<10)o.soak=Math.min(1,o.soak+.006);}
        break;
      }
    }
    if(!hit&&ry>=0)hit=true;
    if(hit){
      dr.splice(i,1);
      for(var m=0;m<pieces.length;m++)if(pieces[m].st===1&&Math.abs(pieces[m].cx-rx)<20+pieces[m].w/2){
        if(sim.flare<1.3)sim.flare=Math.min(1.4,sim.flare+.035);
        break;
      }
    }
  }
}

function spawnCritter(nf){

  else if(place==='mountain')type=wpick([['goat',.55],['deer',.15],['coyote',.1+.35*nf],['bird',.6*day]]);
  else if(place==='beach')type=wpick([['crab',.5+.3*nf],['coyote',.1+.3*nf],['bird',.9*day]]);
  else type=wpick([['coyote',.15+.4*nf],['snake',.3],['tarantula',.2+.3*nf],['bird',.55*day]]);

  var iv=sim.Iv,nf=nightFactor(),dts=Math.min(speedMul,4),i,c;

  crit.timer-=dt*dts;if(crit.timer<=0){crit.timer=26+Math.random()*50;spawnCritter(nf);}

    var mp=moonPos();
    if(nf>.6&&skyFx.moA>.6&&mp.y<HZ-26){crit.wolfT-=dt*Math.min(speedMul,3);
      if(crit.wolfT<=0){
        var bx=-1,bs=1e9,x;
        for(x=14;x<LW-14;x+=2){if(Math.abs(x-mp.x)<18)continue;var mn=1e9,mx=-1e9,q;for(q=x-8;q<=x+8;q++){var cc=crestAt(q);if(cc<mn)mn=cc;if(cc>mx)mx=cc;}var sc=Math.abs(Math.abs(x-mp.x)-30)+2*(mx-mn)+.5*(crestAt(x)-(HZ-36));if(sc<bs){bs=sc;bx=x;}}
        if(bx>0){crit.wolf=w={x:bx,y:crestAt(bx)+2,dir:mp.x>bx?1:-1,t:0,howled:false};}

    if(out_&&(c.st==='leave'||c.st==='flee'||c.st==='walk')&&(c.tm>1||c.st!=='walk')){critters.splice(i,1);continue;}
    c.tm+=dt;

      c.x+=c.dir*c.sp*dt;
      if(!c.decided&&c.x>LW*.2&&c.x<LW*.8){
        c.decided=true;
        if(iv<.42&&Math.random()<.7){c.st='approach';setTarget(c,c.x<pit.cx?-1:1);}
      }
      if(c.t==='deer'&&c.pause>0){c.pause-=dt;c.x-=c.dir*c.sp*dt;}
      else if(c.t==='deer'&&Math.random()<dt*.05)c.pause=3+Math.random()*3;
    }else if(c.st==='approach'){
      if(scared){c.st='flee';c.dir=c.x<pit.cx?-1:1;}
      else if(uneasy){c.st='leave';c.dir=c.x<pit.cx?-1:1;}
      else{
        var dx=c.tx-c.x,dy=c.ty-c.y,d=Math.sqrt(dx*dx+dy*dy)||1,s=c.sp*(c.t==='deer'||c.t==='coyote'?.75:1)*dt;
        if(d<=s+.5){c.x=c.tx;c.y=c.ty;c.st='linger';c.tm=0;c.linger=7+Math.random()*10;c.dir=c.tx<pit.cx?1:-1;}
        else{c.x+=dx/d*s;c.y+=dy/d*s;c.dir=dx>0?1:-1;if(c.t==='snake'||c.t==='tarantula')c.y=c.y;}
      }
    }else if(c.st==='linger'){
      if(scared){c.st='flee';c.dir=c.x<pit.cx?-1:1;c.tm=0;}
      else if(uneasy||c.tm>c.linger){c.st='leave';c.dir=c.x<pit.cx?-1:1;c.tm=0;}
    }else if(c.st==='leave'){c.x+=c.dir*c.sp*dt;
      if(scared)c.st='flee';
    }else if(c.st==='flee'){c.x+=c.dir*c.sp*3.2*dt;}
  }
}

function expo(mean){return -Math.log(1-Math.random())*mean;}
function noiseBuf(ctx,kind,secs){

    else if(kind==='pink'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;tmp[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}

  for(i=0;i<n2;i++)d[i]=tmp[i+xf];

}
function makeIR(ctx,dur,decay){

function bqCoef(f,q,sr){var w0=2*Math.PI*f/sr,al=Math.sin(w0)/(2*q),cs=Math.cos(w0),a0=1+al;return {b0:al/a0,b2:-al/a0,a1:-2*cs/a0,a2:(1-al)/a0};}

function genTick(ctx){

  var tau=sr*(.0006+Math.random()*.0022),f=2000+Math.random()*4800,q=2+Math.random()*7,c=bqCoef(f,q,sr),x1=0,x2=0,y1=0,y2=0;

function genSnap(ctx){
  var sr=ctx.sampleRate,len=Math.floor(sr*(.045+Math.random()*.05)),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0);

function genPop(ctx){
  var sr=ctx.sampleRate,len=Math.floor(sr*(.14+Math.random()*.08)),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0);
  var f0=105+Math.random()*130,ph=0,tA=sr*(.035+Math.random()*.03),tN=sr*.004;

function genFizz(ctx){
  var sr=ctx.sampleRate,len=Math.floor(sr*(.3+Math.random()*.3)),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),lp=0;
  var tau=sr*(.09+Math.random()*.08);

function genThud(ctx){
  var sr=ctx.sampleRate,len=Math.floor(sr*.26),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),ph=0,f0=62+Math.random()*30,lp=0;
  for(var i=0;i<len;i++){

    var x=(Math.random()*2-1);lp+=(x-lp)*.25;

function genWhoomp(ctx){
  var sr=ctx.sampleRate,len=Math.floor(sr*1.8),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),lp=0,ph=0;
  for(var i=0;i<len;i++){

function genBreath(ctx){
  var sr=ctx.sampleRate,len=Math.floor(sr*.7),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),lp=0,lp2=0;
  for(var i=0;i<len;i++){var t=i/sr,x=Math.random()*2-1;lp+=(x-lp)*.2;lp2+=(lp-lp2)*.3;var env=Math.sin(Math.PI*Math.min(1,t/.7));d[i]=lp2*Math.pow(env,1.6)*3;}

function genRustle(ctx){
  var sr=ctx.sampleRate,len=Math.floor(sr*.9),b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),lp=0;
  for(var i=0;i<len;i++){var t=i/sr,x=(Math.random()*2-1)*(Math.random()<.18?1:.1);lp+=(x-lp)*.35;var env=Math.sin(Math.PI*t/.9)*(.6+.4*Math.sin(t*38));d[i]=(x-lp)*Math.max(0,env);}

function showCard(html){$('card').innerHTML=html;$('ov').hidden=false;}
function hideCard(){$('ov').hidden=true;uiPause=false;}
function thumb(cn,key){
  var c=cn.getContext('2d'),w=cn.width,h=cn.height;
  if(key==='forest'){
    for(var y=0;y<h;y++){var t=y/h;R(c,0,y,w,1,colA(mixc([232,140,90],[70,70,130],t)));}
    R(c,0,13,w,10,'rgb(34,48,46)');R(c,13,5,5,5,'rgb(255,210,120)');
    TRI(c,4,2,12,4,'rgb(18,44,40)');TRI(c,19,6,10,3,'rgb(18,44,40)');R(c,10,19,3,2,'rgb(255,150,40)');
  }else if(key==='desert'){
    for(var y2=0;y2<h;y2++){var t2=y2/h;R(c,0,y2,w,1,colA(mixc([250,170,96],[150,70,110],t2)));}
    R(c,15,6,7,7,'rgb(124,66,76)');R(c,0,13,w,10,'rgb(200,150,100)');R(c,6,4,3,10,'rgb(50,100,70)');R(c,3,7,3,1,'rgb(50,100,70)');R(c,9,8,3,1,'rgb(50,100,70)');
    ELL(c,16,5,3,3,'rgb(255,214,130)');R(c,11,19,3,2,'rgb(255,150,40)');
  }else if(key==='mountain'){
    for(var y3=0;y3<h;y3++){var t3=y3/h;R(c,0,y3,w,1,colA(mixc([250,170,120],[96,86,150],t3)));}
    TRI(c,7,3,11,7,'rgb(96,108,152)');TRI(c,17,6,8,6,'rgb(70,80,120)');TRI(c,7,3,4,2,'rgb(240,246,255)');TRI(c,17,6,3,2,'rgb(224,232,250)');
    R(c,0,14,w,9,'rgb(86,92,84)');R(c,2,16,4,1,'rgb(222,230,246)');R(c,10,19,3,2,'rgb(255,150,40)');
  }else if(key==='beach'){
    for(var y4=0;y4<h;y4++){var t4=y4/h;R(c,0,y4,w,1,colA(mixc([255,176,100],[130,80,130],t4)));}
    R(c,0,10,w,6,'rgb(70,100,140)');ELL(c,14,8,3,3,'rgb(255,222,140)');R(c,12,11,4,1,'rgb(255,214,140)');R(c,13,13,2,1,'rgb(255,214,140)');
    R(c,0,16,w,7,'rgb(206,180,138)');R(c,0,15,w,1,'rgb(255,255,255)');R(c,10,19,3,2,'rgb(255,150,40)');
  }else{
    R(c,0,0,w,h,'rgb(92,62,42)');R(c,3,3,17,9,'rgb(150,86,100)');R(c,4,4,15,7,'rgb(236,150,110)');R(c,11,4,1,7,'rgb(70,44,30)');
    R(c,5,13,13,10,'rgb(122,112,106)');R(c,7,15,9,8,'rgb(26,18,18)');R(c,10,18,3,3,'rgb(255,150,40)');
  }
}
function fmtT(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function showMenu(){
  state='menu';uiPause=false;drag=null;
  var sv=loadSave();
  var h='<h1>SLOW BURN</h1><div class="sub">BUILD A FIRE. KEEP IT GOING.</div><p>Sunset, night, dawn and day, two hours around. Where will you sit?</p>';
  ['hearth','forest','mountain','beach','desert'].forEach(function(k){h+='<button class="pl" data-p="'+k+'" type="button"><canvas class="th" width="23" height="23"></canvas><div><b>'+PLACES[k].name+'</b><span>'+PLACES[k].desc+'</span></div></button>';});
  if(sv)h+='<button class="btn sec" id="mres" type="button">RESUME '+PLACES[sv.place].name+' · '+fmtT(sv.tSun)+'</button>';
  showCard(h);
  var ths=$('card').querySelectorAll('.pl');
  for(var i=0;i<ths.length;i++){(function(b){var cn=b.querySelector('canvas');cn.style.width='46px';cn.style.height='46px';thumb(cn,b.getAttribute('data-p'));b.addEventListener('click',function(){audioStart();startNew(b.getAttribute('data-p'));});})(ths[i]);}
  if(sv)$('mres').addEventListener('click',function(){audioStart();restoreFrom(sv);state='play';hideCard();applyAudioPlace();refreshTray();toast('Welcome back.');});
  var pv=place;if(!pv)pv='forest';
  layout();buildScene();resetFireGrid();
}
function applyAudioPlace(){if(AU.A){AU.A.setPlace(place);AU.A.setLevels(settings.vol,settings.crackle,settings.amb,settings.muted);}}
function startNew(pk){
  place=pk;layout();buildScene();resetRun();state='play';hideCard();applyAudioPlace();refreshTray();persist();
  toast(PLACES[pk].name+'. Drag tinder into the pit.',3600);
}
function showSettings(){
  if(state!=='play')return;
  uiPause=true;
  var h='<h2>PAUSED</h2>'+
   '<div class="row"><label>VOLUME</label><input id="svol" type="range" min="0" max="100" value="'+Math.round(settings.vol*100)+'"><span class="v" id="vvol"></span></div>'+
   '<div class="row"><label>CRACKLE</label><input id="scrk" type="range" min="0" max="150" value="'+Math.round(settings.crackle*100)+'"><span class="v" id="vcrk"></span></div>'+
   '<div class="row"><label>AMBIENCE</label><input id="samb" type="range" min="0" max="100" value="'+Math.round(settings.amb*100)+'"><span class="v" id="vamb"></span></div>'+
   '<div class="row"><label>TIME</label><input id="ssun" type="range" min="0" max="100" value="'+Math.round(cycU()/4*100)+'"><span class="v" id="vsun"></span></div>'+
   '<label class="chk"><input id="shint" type="checkbox"'+(settings.hints?' checked':'')+'> SHOW HINTS</label>'+
   '<button class="btn" id="bres" type="button">BACK TO THE FIRE</button>'+
   '<button class="btn sec" id="bnew" type="button">NEW FIRE</button>'+
   '<button class="btn sec" id="bmenu" type="button">MAIN MENU</button>';
  showCard(h);
  function lab(){$('vvol').textContent=Math.round(settings.vol*100);$('vcrk').textContent=Math.round(settings.crackle*100);$('vamb').textContent=Math.round(settings.amb*100);$('vsun').textContent=['SUNSET','NIGHT','DAWN','DAY'][Math.min(3,Math.floor(cycU()))];}
  lab();
  function snd(){saveSettings();if(AU.A)AU.A.setLevels(settings.vol,settings.crackle,settings.amb,settings.muted);lab();}
  $('svol').addEventListener('input',function(){settings.vol=this.value/100;snd();});
  $('scrk').addEventListener('input',function(){settings.crackle=this.value/100;snd();});
  $('samb').addEventListener('input',function(){settings.amb=this.value/100;snd();});
  $('ssun').addEventListener('input',function(){tSun=this.value/100*CYCLE;lab();});
  $('shint').addEventListener('change',function(){settings.hints=this.checked;saveSettings();});
  $('bres').addEventListener('click',function(){hideCard();persist();});
  $('bnew').addEventListener('click',function(){if(this.dataset.arm==='1'){startNew(place);return;}this.dataset.arm='1';this.textContent='SURE? TAP AGAIN';});
  $('bmenu').addEventListener('click',function(){persist();showMenu();});
}
function showSummary(){
  uiPause=true;
  var burnt=sim.burned;
  showCard('<h2>THE SUN HAS SET</h2><p>Thirty minutes. The stars are out.</p>'+
   '<div class="stat"><span>FIRE KEPT</span><span>'+fmtT(sim.alive)+'</span></div>'+
   '<div class="stat"><span>PIECES BURNED</span><span>'+burnt+'</span></div>'+
   '<div class="stat"><span>FUEL LEFT</span><span>'+Math.round(jug)+'%</span></div><br>'+
   '<button class="btn" id="skeep" type="button">KEEP SITTING</button>'+
   '<button class="btn sec" id="snew" type="button">NEW FIRE</button>');
  $('skeep').addEventListener('click',function(){hideCard();});
  $('snew').addEventListener('click',function(){showMenu();});
}
$('bset').addEventListener('click',function(){audioStart();if(state==='play'&&!uiPause)showSettings();});
$('bspd').addEventListener('click',function(){audioStart();var L=[1,2,5,10];speedMul=L[(L.indexOf(speedMul)+1)%L.length];updateHud(true);});
$('bsnd').addEventListener('click',function(){audioStart();settings.muted=!settings.muted;saveSettings();if(AU.A)AU.A.setLevels(settings.vol,settings.crackle,settings.amb,settings.muted);updateHud(true);});

/* ---- hints + HUD ---- */
function hintText(){
  var any=pieces.length>0,burning=sim.flame>.05||sim.coal>.05,k={},i;
  for(i=0;i<pieces.length;i++)k[pieces[i].kind]=(k[pieces[i].kind]||0)+1;
  if(!any)return 'Drag tinder into the pit. Lean twigs and kindling against it, teepee style.';
  if(!burning&&!sim.ever)return 'Hold the lighter against the tinder until it catches. Tap the pit to blow on it.';
  if(!burning)return 'The fire went out. Start over with fresh tinder and kindling.';
  if(sim.flame<.6&&!k.split&&!k.log&&!k.big)return 'Lean more kindling around it. Tap the pit to give it air.';
  if(sim.flame>=.6&&!k.split&&!k.log&&!k.big)return 'Strong enough. Add splits, then logs.';
  if(sim.flame<.35&&sim.coal>.15)return 'Mostly coals now. Lay kindling on them, then a split. Tap to blow.';
  if(sim.flame<.3&&(k.log||k.big)&&!k.kindling&&!k.twig&&sim.coal<.15)return 'Big pieces need a hot bed. Put kindling underneath.';
  var cu=cycU();if(cu>=1&&cu<2&&sim.flame>.1)return 'Night has fallen. Keep it going as long as you like.';
  return '';
}
function updateHud(force){
  $('bspd').textContent=speedMul+'X';
  $('bsnd').textContent=settings.muted?'MUTE':'SND';
  var hn=$('hint'),tr=$('tray').getBoundingClientRect(),ar=$('app').getBoundingClientRect(),side=tr.width<ar.width*.8;
  hn.style.bottom=(side?16:(ar.bottom-tr.top+6))+'px';hn.style.left='0';hn.style.right=(side?(ar.right-tr.left):0)+'px';
}
function updateHint(now){
  var t=(state==='play'&&!uiPause&&settings.hints)?hintText():'',hn=$('hint');
  if(t!==lastHint){
    if(!t||now-hintShownAt>5000||!lastHint){lastHint=t;hintShownAt=now;hn.textContent=t;hn.className=t?'on':'';}
  }
}

/* ---- per-frame world update ---- */
function pickBurning(){
  var arr=[],i;
  for(i=0;i<pieces.length;i++)if(pieces[i].st===1)arr.push(pieces[i]);
  return arr.length?arr[(Math.random()*arr.length)|0]:null;
}
function worldTick(dt,tNow){
  var n;
  simAcc+=dt*speedMul;n=0;while(simAcc>=.05&&n<14){simStep(.05);simAcc-=.05;n++;}if(n>=14)simAcc=0;
  physStep(dt);critterTick(dt);
  fireAcc+=dt;n=0;while(fireAcc>=1/24&&n<3){fireStep(1/24);fireAcc-=1/24;n++;}if(n>=3)fireAcc=0;
  sim.Iv+=(sim.I-sim.Iv)*(1-Math.exp(-dt*2.2));
  sim.kick=Math.max(0,(sim.kick||0)-dt*1.2);
  if(drag&&drag.type==='jug'&&drag.pouring&&jug>0){
    jug=Math.max(0,jug-dt*16);
    var nd=Math.round(45*dt+Math.random()-.3);
    for(var k=0;k<nd;k++)particles.drops.push({x:drag.x+(Math.random()-.5)*1.4,y:drag.y+1,vy:30+Math.random()*20});
  }
  if(sim.flare>.3&&!sim.fl){sim.fl=true;ev('flare',1,pit.cx);}
  if(sim.flare<.08)sim.fl=false;
  /* embers + smoke */
  var bp=pickBurning();
  if(bp&&Math.random()<dt*3.2*Math.min(1.5,sim.Iv))emitEmber(pit.cx+bp.x0+Math.random()*bp.w,pit.fy+bp.y0-rr(2,8));
  for(var i=0;i<pieces.length;i++){
    var p=pieces[i],K=KINDS[p.kind],pr=0;
    if(p.st===1)pr=.5+p.soak*4+(K.dur<60?2.5:0)+(p.fuel>.92?.5:0);
    else if(p.st===0&&p.T>.35)pr=1.6*p.T;
    else if(p.st===2)pr=.22;
    if(pr>0&&Math.random()<dt*pr)addSmoke(pit.cx+p.x0+Math.random()*p.w,pit.fy+p.y0-1,p.st===2?.5:(p.st===0?1.2:.8));
  }
  updateParticles(dt,tNow);
  /* sparks timed to the audio crackles */
  var ac=AU.ctx;
  while(visQ.length&&(!ac||visQ[0].t<=ac.currentTime)){
    var e=visQ.shift(),b=pickBurning();
    if(!b)continue;
    var cnt=e.ty==='pop'?5:(e.ty==='snap'?3:1);
    emitSparks(pit.cx+b.x0+Math.random()*b.w,pit.fy+b.y0-1,cnt,.5+e.g);
    sim.kick=Math.min(.3,(sim.kick||0)+.12*e.g);
  }
  if(!ac&&sim.I>.05){crackleParams();if(Math.random()<dt*AU.params.lambda*.5){var b2=pickBurning();if(b2)emitSparks(pit.cx+b2.x0+Math.random()*b2.w,pit.fy+b2.y0-1,2,.7);}}
  if(gather.t>0){gather.t-=dt*speedMul;if(gather.t<=0){gather.t=0;finishGather();}}
}
function frame(ts){
  var dt=Math.min(.1,(ts-lastTs)/1000||0);lastTs=ts;tClock+=dt;
  var running=state==='play'&&!uiPause&&!hidden;
  if(running){tSun+=dt*speedMul;worldTick(dt,tClock);}
  renderFrame(tClock);
  hudAcc+=dt;if(hudAcc>.12){hudAcc=0;updateHud();}
  trayAcc+=dt;if(trayAcc>.25){trayAcc=0;refreshTray();}
  hintAcc+=dt;if(hintAcc>1){hintAcc=0;updateHint(performance.now());}
  saveAcc+=dt;if(saveAcc>6){saveAcc=0;persist();}
  requestAnimationFrame(frame);
}

/* ---- boot ---- */

window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){layout();buildScene();},120);});
document.addEventListener('visibilitychange',function(){
  hidden=document.hidden;
  if(hidden){persist();if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();}
  else{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();}
});
window.addEventListener('pagehide',persist);
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
buildTray();
layout();
place='forest';PDEF=PLACES.forest;layout();buildScene();
showMenu();
requestAnimationFrame(function(ts){lastTs=ts;requestAnimationFrame(frame);});
