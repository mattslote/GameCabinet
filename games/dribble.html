<title>Dribble</title>

<style>
/* Layout: HUD plates on top, one portrait court that scales to fit, a slim control bar below.
   Look: painted gym wall, maple floor, jersey numerals. One deliberate world, so single theme. */
:root {
  --bg: #12233b;
  --wall: #1d3a63;
  --wall-2: #234573;
  --seam: #17304f;
  --floor: #c98c4e;
  --floor-seam: #a8703a;
  --paint: #f2eee4;
  --ball: #ee7424;
  --ball-hi: #ffa766;
  --ball-line: #4a2208;
  --rim: #e8452f;
  --pole: #6d86a8;
  --plate: #0c1a2e;
  --amber: #ffc43a;
  --ink: #eaf0f8;
  --ink-dim: #9db0c8;
  --line-dim: #35557f;
  --hole-rgb: 3, 6, 13;
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lab {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.val {
  display: block;
  font-family: var(--display);
  font-weight: 900;
  font-size: 40px;
  line-height: 1;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
}
.val small { font-size: .5em; font-weight: 700; color: var(--ink-dim); margin-left: 2px; }
.hud { display: flex; padding-bottom: 6px; border-bottom: 2px solid var(--paint); }
.stat { flex: 1; min-width: 0; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line-dim); }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.court { position: relative; box-shadow: 0 0 0 2px var(--paint); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; }
.overlay {
  overflow-y: auto;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  box-sizing: border-box;
  background: color-mix(in srgb, var(--plate) 70%, transparent);
}
.card {
  margin: auto;
  box-sizing: border-box;
  width: min(100%, 320px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
  background: var(--plate);
  border: 2px solid var(--paint);
}
.card h1, .card h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 900;
  font-size: 52px;
  line-height: .95;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: var(--paint);
  text-wrap: balance;
}
.card p { margin: 0; line-height: 1.4; color: var(--ink); max-width: 36ch; }
.res { display: flex; gap: 16px; }
.res > div { flex: 1; min-width: 0; }
.res em {
  display: block;
  margin-top: 2px;
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--paint);
}
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.btn {
  min-height: 48px;
  padding: 0 14px;
  font-family: var(--display);
  font-weight: 900;
  font-size: 22px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--paint);
  background: transparent;
  border: 2px solid var(--paint);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { color: var(--plate); background: var(--amber); border-color: var(--amber); }
.btn.sm { font-size: 19px; padding: 0 6px; letter-spacing: .03em; }
.card.wide { width: min(100%, 420px); }
.stagelist { display: flex; flex-direction: column; gap: 6px; }
.stg {
  display: flex; align-items: center; gap: 12px;
  min-height: 56px; padding: 6px 12px;
  text-align: left; font-family: var(--body); color: var(--paint);
  background: transparent; border: 1.5px solid var(--line-dim);
  cursor: pointer; touch-action: manipulation;
}
.stg:hover { border-color: var(--paint); }
.stg:focus-visible { outline: 3px solid var(--paint); outline-offset: 2px; }
.stg .sn { width: 30px; text-align: center; font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; color: var(--amber); }
.stg .si { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.stg .si b { font-weight: 600; font-size: 15px; }
.stg .si em { font-style: normal; font-size: 10px; font-weight: 600; letter-spacing: .06em; white-space: nowrap; text-transform: uppercase; color: var(--ink-dim); }
.stg .sb { text-align: right; display: flex; flex-direction: column; gap: 3px; }
.stg .sb .t { font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
.chip {
  min-height: 44px;
  padding: 0 10px;
  font-family: var(--body);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1.5px solid var(--line-dim);
  cursor: pointer;
  touch-action: manipulation;
}
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--paint); outline-offset: 2px; }
.bar { display: flex; align-items: center; gap: 8px; padding-top: 6px; border-top: 2px solid var(--paint); }
.best { flex: 1; min-width: 0; }
#best { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; padding: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
td { padding: 3px 0; border-top: 1px solid var(--line-dim); }
th:nth-child(n+3), td:nth-child(n+3) { text-align: right; }
td:first-child { color: var(--ink-dim); width: 24px; }
tfoot td { font-weight: 600; color: var(--amber); border-top: 2px solid var(--paint); }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
@media (max-height: 640px) { .val { font-size: 32px; } .card h1, .card h2 { font-size: 42px; } }
</style>

</div>

  if (raw && Array.isArray(raw.t) && Array.isArray(raw.b)) store = { t: raw.t, b: raw.b, st: Array.isArray(raw.st) ? raw.st : [] };
} catch (e) {}
function save() { try { localStorage.setItem('dribble.v2', JSON.stringify(store)); } catch (e) {} }

var li = 0, w = null, st = 'intro', run = [], parts = [], ripples = [], flash = null, scoredTimer = 0, hintOn = true;
var last = 0, acc = 0, shownTime = '', shownBn = -1;

/* ---------- Sound ---------- */
var actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume().catch(function () {});
}
function blip(f0, f1, dur, vol, type, delay) {
  var t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + .02);
}
function sfx(type, v) {
  if (muted || !actx || actx.state !== 'running') return;
  try {
    if (type === 'tap') blip(240, 110, .10, .26, 'sine');
    else if (type === 'floor') blip(130, 60, .13, Math.min(.3, v / 2600), 'sine');
    else if (type === 'wall') blip(300, 200, .05, Math.min(.12, v / 4500), 'triangle');
    else if (type === 'rim') blip(720, 520, .12, .13, 'triangle');
    else if (type === 'board') blip(420, 300, .08, .13, 'triangle');
    else if (type === 'score') { blip(520, 520, .14, .17, 'triangle'); blip(660, 660, .14, .17, 'triangle', .1); blip(880, 880, .24, .19, 'triangle', .2); }
  } catch (e) {}
}

/* ---------- Layout ---------- */
function resize() {
  var r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  var s = Math.min(r.width / W, r.height / H), dpr = Math.min(window.devicePixelRatio || 1, 3);
  court.style.width = Math.floor(W * s) + 'px';
  court.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  S = cv.width / W;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

/* ---------- HUD and overlays ---------- */
function bestText() {
  var t = store.t[li], b = store.b[li];
  return t == null ? 'No best yet' : t.toFixed(1) + 's · ' + b + (b === 1 ? ' tap' : ' taps');
}
function syncHud(force) {
  var t = w.time.toFixed(1);
  if (force || t !== shownTime) { elTime.innerHTML = t + '<small>s</small>'; shownTime = t; }
  if (force || w.bounces !== shownBn) { elBn.textContent = w.bounces; shownBn = w.bounces; }
}
function startLevel(i) {
  li = i; w = createWorld(i); w.sfx = sfx; st = 'ready';
  parts = []; ripples = []; flash = null; scoredTimer = 0;
  ov.hidden = true;
  elLvl.innerHTML = (Math.floor(i / PER) + 1) + '<small> \u00b7 ' + (i % PER + 1) + '/' + PER + '</small>';
  elBest.textContent = bestText();
  syncHud(true);
}
function showCard(html, wide) { card.className = 'card' + (wide ? ' wide' : ''); card.innerHTML = html; ov.hidden = false; var p = card.querySelector('.primary'); if (p) p.focus({ preventScroll: true }); }

function fmtTime(t) {
  if (t < 60) return t.toFixed(1) + 's';
  var m = Math.floor(t / 60), sec = t - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}
function showIntro() {
  st = 'intro';
  var list = '';
  STAGES.forEach(function (S, k) {
    var b = store.st[k], tags = [];
    if (S.move) tags.push('Moving');
    if (S.hole) tags.push('Black hole');
    if (!tags.length) tags.push('Standard');
    list += '<button class="stg" data-st="' + k + '" type="button">' +
      '<span class="sn">' + (k + 1) + '</span>' +
      '<span class="si"><b>' + S.name + '</b><em>' + tags.join(' · ') + '</em></span>' +
      '<span class="sb">' + (b ? '<span class="t">' + fmtTime(b.t) + '</span><span class="lab">' + b.b + ' taps</span>' : '<span class="lab">Not played</span>') + '</span></button>';
  });
  showCard('<h1>Dribble</h1>' +
    '<p>Tap the ball to push it down and it bounces back up. Tap left of center to send it right, right of center to send it left. Tap in rhythm to build momentum. Taps are blocked inside the dashed box around the rim.</p>' +
    '<span class="lab">Pick a stage · 12 challenges each</span><div class="stagelist">' + list + '</div>', true);
  Array.prototype.forEach.call(card.querySelectorAll('[data-st]'), function (el) {
    el.onclick = function () { audio(); run = []; startLevel(+el.getAttribute('data-st') * PER); };
  });
}
function showComplete() {
  var t = w.scoredAt, b = w.bounces, pt = store.t[li], pb = store.b[li];
  var newT = pt != null && t < pt, newB = pb != null && b < pb;
  if (pt == null || t < pt) store.t[li] = t;
  if (pb == null || b < pb) store.b[li] = b;
  save();
  run[li] = { t: t, b: b };
  elBest.textContent = bestText();
  var word = w.rimHits === 0 && w.boardHits === 0 ? 'Swish' : w.rimHits === 0 ? 'Bank shot' : 'Rattled in';
  var isLast = li % PER === PER - 1;
  showCard('<div class="kicker">Stage ' + (Math.floor(li / PER) + 1) + ' · ' + (li % PER + 1) + ' of ' + PER + ' · ' + LEVELS[li].name + '</div>' +
    '<h2>' + word + '</h2>' +
    '<div class="res"><div><span class="lab">Time</span><span class="val">' + t.toFixed(1) + '<small>s</small></span>' + (newT ? '<em>New best</em>' : '') + '</div>' +
    '<div><span class="lab">Taps</span><span class="val">' + b + '</span>' + (newB ? '<em>New best</em>' : '') + '</div></div>' +
    '<div class="row"><button class="btn" id="retry" type="button">Retry</button>' +
    '<button class="btn primary" id="next" type="button">' + (isLast ? 'Results' : 'Next') + '</button></div>');
  $('retry').onclick = function () { startLevel(li); };
  $('next').onclick = function () { if (isLast) showFinal(); else startLevel(li + 1); };
}
function showFinal() {
  var pk = Math.floor(li / PER), tt = 0, tb = 0, rows = '', done = true, i, k;
  for (k = 0; k < PER; k++) {
    i = pk * PER + k;
    var r = run[i];
    if (r) { tt += r.t; tb += r.b; } else done = false;
    rows += '<tr><td>' + (k + 1) + '</td><td>' + LEVELS[i].name + '</td><td>' + (r ? r.t.toFixed(1) + 's' : '–') + '</td><td>' + (r ? r.b : '–') + '</td></tr>';
  }
  var prev = store.st[pk], isBest = done && (!prev || tt < prev.t);
  if (isBest) { store.st[pk] = { t: tt, b: tb }; save(); }
  var last = pk === STAGES.length - 1;
  showCard('<div class="kicker">' + STAGES[pk].name + '</div><h2>Stage ' + (pk + 1) + ' done</h2>' +
    '<table><thead><tr><th></th><th>Challenge</th><th>Time</th><th>Taps</th></tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td></td><td>Total' + (isBest && prev ? ' · new best' : '') + '</td><td>' + fmtTime(tt) + '</td><td>' + tb + '</td></tr></tfoot></table>' +
    '<div class="row"><button class="btn sm" id="again" type="button">Replay</button>' +
    '<button class="btn sm" id="menu" type="button">Stages</button>' +
    (last ? '' : '<button class="btn sm primary" id="nextlv" type="button">Stage ' + (pk + 2) + '</button>') + '</div>', true);
  $('again').onclick = function () { run = []; startLevel(pk * PER); };
  $('menu').onclick = function () { run = []; showIntro(); };
  if (!last) $('nextlv').onclick = function () { run = []; startLevel((pk + 1) * PER); };
}

function onScore() {
  st = 'scored'; scoredTimer = 0;
  var h = w.hoop, cx = (h.frontX + h.backX) / 2;
  flash = { t: 0, x: cx, y: h.y };
  if (!reduce) {
    var cols = [C.amber, C.paint, C.ball, C.rim];
    for (var i = 0; i < 36; i++) parts.push({ x: cx, y: h.y, vx: (Math.random() - .5) * 460, vy: -60 - Math.random() * 420, life: 1, c: cols[i % 4], s: 3 + Math.random() * 3 });
  }
}

/* ---------- Input ---------- */
cv.addEventListener('pointerdown', function (e) {
  if (st !== 'ready' && st !== 'play') return;
  e.preventDefault();
  audio();
  var r = cv.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
  if (tapWorld(w, px, py)) { st = 'play'; hintOn = false; ripples.push({ x: px, y: py, t: 0, hit: true }); sfx('tap'); }
  else ripples.push({ x: px, y: py, t: 0, hit: false });
});
$('reset').onclick = function () { if (st !== 'intro') startLevel(li); };
$('stages').onclick = function () { showIntro(); };
$('snd').onclick = function () {
  muted = !muted; audio();
  this.textContent = muted ? 'Sound off' : 'Sound on';
  this.setAttribute('aria-pressed', muted ? 'true' : 'false');
};

/* ---------- Drawing ---------- */
function drawScene(now) {
  var c = ctx, h = w.hoop, b = w.ball, i;
  c.setTransform(S, 0, 0, S, 0, 0);
  c.fillStyle = C.wall; c.fillRect(0, 0, W, H);
  c.strokeStyle = C.seam; c.lineWidth = 2; c.beginPath();
  for (i = 0; i <= W; i += 80) { c.moveTo(i, 0); c.lineTo(i, FLOOR); }
  c.stroke();
  c.fillStyle = C.wall2; c.fillRect(0, FLOOR - 84, W, 84);
  c.fillStyle = C.seam; c.fillRect(0, FLOOR - 84, W, 2);

  c.save();
  c.globalAlpha = .08; c.fillStyle = C.paint; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '900 300px ' + DISPLAY;
  c.fillText((Math.floor(li / PER) + 1) + '-' + (li % PER + 1), W / 2, H * .43);
  c.restore();

  c.fillStyle = C.floor; c.fillRect(0, FLOOR, W, H - FLOOR);
  c.strokeStyle = C.floorSeam; c.lineWidth = 1.5; c.beginPath();
  c.moveTo(0, FLOOR + 16); c.lineTo(W, FLOOR + 16); c.moveTo(0, FLOOR + 28); c.lineTo(W, FLOOR + 28);
  for (i = 0; i < 11; i++) { var vx = i * 52 + 14; c.moveTo(vx, FLOOR + 3); c.lineTo(vx, FLOOR + 16); }
  for (i = 0; i < 10; i++) { var vx2 = i * 52 + 40; c.moveTo(vx2, FLOOR + 16); c.lineTo(vx2, FLOOR + 28); }
  c.stroke();
  c.fillStyle = C.paint; c.fillRect(0, FLOOR, W, 3);

  c.fillStyle = C.paint; c.globalAlpha = .75; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.font = '600 13px ' + BODY;
  if ('letterSpacing' in c) c.letterSpacing = '3px';
  c.fillText(LEVELS[li].name.toUpperCase(), W / 2, 26);
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  c.globalAlpha = 1;

  /* momentum pips */
  for (i = 0; i < COMBO_MAX; i++) {
    var px0 = W / 2 + (i - (COMBO_MAX - 1) / 2) * 18;
    c.globalAlpha = i < w.combo ? 1 : .22; c.fillStyle = i < w.combo ? C.amber : C.paint;
    c.beginPath(); c.arc(px0, 44, 4.5, 0, TAU); c.fill();
  }
  c.globalAlpha = .55; c.fillStyle = C.paint; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.font = '600 10px ' + BODY;
  if ('letterSpacing' in c) c.letterSpacing = '2px';
  c.fillText('MOMENTUM', W / 2, 64);
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  c.globalAlpha = 1;

  /* black hole */
  if (w.hole) {
    var hx0 = w.hole.x, hy0 = w.hole.y, rot = reduce ? 0 : now / 1000 * 1.2;
    var hg = c.createRadialGradient(hx0, hy0, 0, hx0, hy0, HOLE_R);
    hg.addColorStop(0, 'rgba(' + C.holeRgb + ',.92)');
    hg.addColorStop(.18, 'rgba(' + C.holeRgb + ',.7)');
    hg.addColorStop(.6, 'rgba(' + C.holeRgb + ',.34)');
    hg.addColorStop(1, 'rgba(' + C.holeRgb + ',.12)');
    c.fillStyle = hg; c.beginPath(); c.arc(hx0, hy0, HOLE_R, 0, TAU); c.fill();
    c.save();
    c.strokeStyle = C.amber; c.lineWidth = 1.5; c.globalAlpha = .3; c.setLineDash([4, 10]);
    c.beginPath(); c.arc(hx0, hy0, HOLE_R - 1, 0, TAU); c.stroke();
    c.setLineDash([]); c.globalAlpha = .35; c.lineWidth = 2; c.lineCap = 'round';
    for (i = 0; i < 3; i++) {
      var a0 = rot * (1 - i * .25) + i * 2.1;
      c.beginPath(); c.arc(hx0, hy0, 60 + i * 45, a0, a0 + 1.6); c.stroke();
    }
    c.globalAlpha = 1; c.fillStyle = 'rgb(' + C.holeRgb + ')';
    c.beginPath(); c.arc(hx0, hy0, 20, 0, TAU); c.fill();
    c.strokeStyle = C.amber; c.lineWidth = 2; c.globalAlpha = .9;
    c.beginPath(); c.arc(hx0, hy0, 20, 0, TAU); c.stroke();
    c.restore();
  }

  /* pole and backboard */
  if (h.pole) { c.fillStyle = C.pole; c.fillRect(h.bx - 5, h.bottom, 10, FLOOR - h.bottom); }
  c.fillStyle = C.paint; c.fillRect(h.bx - 4, h.top, 8, h.bottom - h.top);
  c.fillStyle = C.rim; c.fillRect(h.bx - 4, h.y - 20, 8, 20);
  c.strokeStyle = C.rim; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(h.bx, h.y); c.lineTo(h.frontX, h.y); c.stroke();
  c.fillStyle = C.rim; c.beginPath(); c.arc(h.frontX, h.y, 4.5, 0, TAU); c.fill();

  /* no-tap zone around the rim */
  var zx0 = Math.min(h.backX, h.frontX) - NOTAP_PAD, zx1 = Math.max(h.backX, h.frontX) + NOTAP_PAD;
  c.save();
  c.globalAlpha = .28; c.strokeStyle = C.paint; c.lineWidth = 1.5; c.setLineDash([6, 6]);
  c.strokeRect(zx0, h.y - NOTAP_UP, zx1 - zx0, NOTAP_UP + NOTAP_DOWN);
  c.setLineDash([]);
  c.globalAlpha = .5; c.fillStyle = C.paint; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.font = '600 10px ' + BODY;
  if ('letterSpacing' in c) c.letterSpacing = '2px';
  c.fillText('NO TAP', (zx0 + zx1) / 2, h.y - NOTAP_UP + 14);
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  c.restore();

  /* ball shadow */
  var air = Math.max(0, Math.min(1, (FLOOR - R - b.y) / 520));
  c.save();
  c.globalAlpha = .32 * (1 - air * .7); c.fillStyle = C.plate;
  c.beginPath(); c.ellipse(b.x, FLOOR + 5, R * (1.05 - air * .5), 3.4 * (1 - air * .4), 0, 0, TAU); c.fill();
  c.restore();

  /* ball */
  c.save();
  c.translate(b.x, b.y);
  var gr = c.createRadialGradient(-R * .35, -R * .4, R * .15, 0, 0, R);
  gr.addColorStop(0, C.ballHi); gr.addColorStop(1, C.ball);
  c.fillStyle = gr; c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();
  c.rotate(b.a);
  c.save();
  c.beginPath(); c.arc(0, 0, R, 0, TAU); c.clip();
  c.strokeStyle = C.ballLine; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(0, -R); c.lineTo(0, R); c.moveTo(-R, 0); c.lineTo(R, 0); c.stroke();
  c.beginPath(); c.arc(-R * 1.5, 0, R * 1.05, 0, TAU); c.stroke();
  c.beginPath(); c.arc(R * 1.5, 0, R * 1.05, 0, TAU); c.stroke();
  c.restore();
  c.restore();
  c.strokeStyle = C.ballLine; c.lineWidth = 1.5; c.beginPath(); c.arc(b.x, b.y, R, 0, TAU); c.stroke();

  /* net sits in front of the ball so a scored ball drops into it */
  var kick = st === 'scored' ? Math.max(0, 1 - scoredTimer / .9) : 0;
  var tt = now / 1000, inset = 8, depth = 32, sway = Math.sin(tt * 26) * 5 * kick;
  var fx = h.frontX, bx2 = h.backX, d = h.dir === -1 ? 1 : -1;
  var blx = fx + (bx2 > fx ? inset : -inset) + sway, brx = bx2 + (bx2 > fx ? -inset : inset) + sway, by = h.y + depth + 8 * kick;
  c.strokeStyle = C.paint; c.globalAlpha = .8; c.lineWidth = 1.4; c.lineCap = 'butt';
  c.beginPath();
  for (i = 0; i < 4; i++) {
    var ta = fx + (bx2 - fx) * i / 4, tb2 = fx + (bx2 - fx) * (i + 1) / 4;
    var ba = blx + (brx - blx) * i / 4, bb = blx + (brx - blx) * (i + 1) / 4;
    c.moveTo(ta, h.y); c.lineTo(bb, by);
    c.moveTo(tb2, h.y); c.lineTo(ba, by);
  }
  for (i = 1; i <= 2; i++) {
    var f = i / 3;
    c.moveTo(fx + (blx - fx) * f, h.y + depth * f);
    c.lineTo(bx2 + (brx - bx2) * f, h.y + depth * f);
  }
  c.stroke();
  c.globalAlpha = 1;
  void d;

  /* rim front cap over the net */
  c.fillStyle = C.rim; c.beginPath(); c.arc(h.frontX, h.y, 4.5, 0, TAU); c.fill();

  /* effects */
  for (i = 0; i < ripples.length; i++) {
    var rp = ripples[i];
    c.globalAlpha = (1 - rp.t / .35) * (rp.hit ? .9 : .35);
    c.strokeStyle = C.paint; c.lineWidth = 2;
    c.beginPath(); c.arc(rp.x, rp.y, 6 + rp.t * 90, 0, TAU); c.stroke();
  }
  if (flash) {
    c.globalAlpha = Math.max(0, 1 - flash.t / .6); c.strokeStyle = C.amber; c.lineWidth = 3;
    c.beginPath(); c.arc(flash.x, flash.y, 18 + flash.t * 150, 0, TAU); c.stroke();
  }
  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    c.globalAlpha = Math.max(0, p.life); c.fillStyle = p.c;
    c.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  c.globalAlpha = 1;

  if (hintOn && st === 'ready' && li === 0) {
    c.fillStyle = C.paint; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.font = '900 34px ' + DISPLAY; c.fillText('DRIBBLE THE BALL', W / 2, 620);
    c.font = '600 15px ' + BODY; c.fillText('Tap it as it falls to push it down', W / 2, 644);
  }
}

/* ---------- Loop ---------- */
function frame(now) {
  var dt = Math.min(.05, (now - last) / 1000 || 0);
  last = now; acc += dt * TS;
  while (acc >= STEP) {
    stepWorld(w, STEP); acc -= STEP;
    if (w.scored && st === 'play') onScore();
  }
  var i;
  for (i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > .35) ripples.splice(i, 1); }
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.1;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (flash) { flash.t += dt; if (flash.t > .6) flash = null; }
  if (st === 'scored') { scoredTimer += dt; if (scoredTimer > 1.0) { st = 'overlay'; showComplete(); } }
  syncHud(false);
  if (cv.width > 0) drawScene(now);
  requestAnimationFrame(frame);
}

w = createWorld(0); w.sfx = sfx;
resize();
syncHud(true);
showIntro();
requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
</body></html>
