<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Fireside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1430;--panel:#fff6e0;--panel2:#ffe6b0;--line:#7a4a2a;--text:#5a3820;--mute:#a07850;--hot:#ff8a2a;
--px:"Fredoka","Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:600 13px/1.3 var(--px);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
canvas#c{position:absolute;left:0;top:0;touch-action:none;display:block}
.px{background:var(--panel);border:3px solid var(--line);border-radius:16px;box-shadow:0 3px 0 rgba(50,24,8,.5)}
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;
 padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.bars{display:flex;flex-direction:column;gap:6px;flex:1;max-width:230px}
.bar{display:flex;align-items:center;gap:8px;padding:4px 10px;height:28px}
.bl{width:38px;color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.5px}
.bt{flex:1;height:11px;background:#e9d2a2;border-radius:8px;position:relative;overflow:hidden;box-shadow:inset 0 2px 0 rgba(90,50,20,.25)}
.bt i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(#ffd27a,#ff8a3c);transition:width .25s}
#firebar{background:linear-gradient(#ffe27a,#ff6a2a)}
#campbar{background:linear-gradient(#b8f08a,#4cae4c)}
.bv{width:40px;text-align:right;font-size:11px;font-weight:700}
.info{display:flex;justify-content:space-between;gap:6px;padding:5px 12px;font-size:12px;color:var(--text);font-weight:700}
.info span:last-child{color:var(--mute)}
.hb{display:flex;gap:6px;pointer-events:auto}
.ib{font:700 12px var(--px);color:var(--text);background:linear-gradient(#ffe08a,#ffc24a);border:3px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 rgba(50,24,8,.5)}
.ib:active{transform:translateY(3px);box-shadow:none}
#hint{position:absolute;left:0;right:0;text-align:center;font-size:13px;line-height:1.35;color:#fff;font-weight:600;text-shadow:0 2px 0 rgba(40,20,10,.85),0 0 6px rgba(0,0,0,.6);
 padding:0 22px;pointer-events:none;opacity:0;transition:opacity .6s}
#hint.on{opacity:1}
#toast{position:absolute;left:50%;top:116px;transform:translateX(-50%);max-width:88%;padding:9px 14px;font-size:13px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#tray{position:absolute;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
 background:linear-gradient(rgba(20,12,40,0),rgba(20,12,40,.55) 30%);display:flex;flex-direction:column;gap:7px}
#foods{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#tools{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cell{position:relative;height:68px;background:linear-gradient(#fff8e6,#ffe9bc);border:3px solid var(--line);border-radius:16px;box-shadow:0 3px 0 rgba(50,24,8,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:grab}
.cell:active{transform:translateY(2px)}
.cell canvas{pointer-events:none}
.cell .lb{font-size:11px;font-weight:700;color:var(--mute);pointer-events:none;letter-spacing:.3px}
.cell .n{position:absolute;right:8px;top:5px;font-size:12px;font-weight:700;color:var(--text);pointer-events:none}
.cell.dim{opacity:.4}
.cell .gbar{position:absolute;left:12px;right:12px;bottom:4px;height:4px;background:#e9d2a2;border-radius:4px;overflow:hidden}
.cell .gbar i{display:block;height:100%;width:0;background:var(--hot);border-radius:4px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.62);padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{width:100%;max-width:380px;padding:22px 18px;max-height:100%;overflow:auto;border-radius:24px}
.card h1{margin:0 0 2px;font-size:44px;line-height:1.05;color:#ffb21e;font-weight:700;-webkit-text-stroke:2px #7a3a12;paint-order:stroke fill;text-shadow:0 4px 0 #7a3a12}
.card h2{margin:0 0 10px;font-size:26px;line-height:1.15;color:#ff8a1e;font-weight:700;-webkit-text-stroke:1.5px #7a3a12;paint-order:stroke fill;text-shadow:0 3px 0 #7a3a12}
.card .sub{font-size:13px;color:var(--mute);margin:0 0 14px;line-height:1.4;font-weight:700;letter-spacing:.4px}
.card p{font-size:14px;line-height:1.45;margin:0 0 12px;font-weight:500}
.btn{font:700 17px var(--px);color:#5a2a08;background:linear-gradient(#ffd45a,#ff9a2a);border:3px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;box-shadow:0 4px 0 #9a4a14;width:100%;margin:0 0 10px}
.btn.sec{color:var(--text);background:linear-gradient(#fff8e6,#f3dca8);box-shadow:0 4px 0 rgba(50,24,8,.45)}
.btn:active{transform:translateY(4px);box-shadow:none}
.row{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-weight:700}
.row label{width:84px;color:var(--mute);flex:none}
.row input[type=range]{flex:1;accent-color:#ff8a2a;height:24px;min-width:0}
.row .v{width:30px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:12px;color:var(--mute);font-weight:700}
.chk input{width:20px;height:20px;accent-color:#ff8a2a}
.stat{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:2px dashed #e0c48c;font-size:14px;font-weight:600}
.stat span:first-child{color:var(--mute)}
@media (orientation:landscape) and (min-aspect-ratio:23/20){
 #tray{left:auto;top:0;width:300px;justify-content:flex-end;background:linear-gradient(90deg,rgba(20,12,40,0),rgba(20,12,40,.4) 22%);padding-left:26px}
 #hud{right:310px}
 .card{max-width:420px}
}
@media (prefers-reduced-motion:reduce){#hint,#toast{transition:none}}
</style></head>
<body>

 <canvas id="c" aria-label="A campfire seen from above, with campers sitting around it"></canvas>

  <div class="bars">

 </div>

 <div id="tray"><div id="foods"></div><div id="tools"></div></div>
 <div id="ov" class="ov" hidden><div class="card px" id="card"></div></div>
</div>

};

var FCOL={
 mallow:[[0,250,246,238],[.14,252,240,218],[.3,242,216,164],[.45,224,176,100],[.6,192,130,66],[.75,134,82,46],[.9,68,44,32],[1.05,30,22,22],[1.3,18,14,16]],
 dog:   [[0,240,150,140],[.15,238,124,110],[.3,226,98,80],[.5,188,86,54],[.7,140,64,40],[.85,86,46,32],[1.05,36,26,24],[1.3,20,16,16]],
 corn:  [[0,252,222,92],[.2,255,226,70],[.4,252,206,48],[.6,226,166,40],[.8,160,104,38],[1.05,52,36,26],[1.3,24,18,16]],
 bannock:[[0,240,224,186],[.2,234,206,150],[.4,220,172,98],[.6,184,124,66],[.8,116,72,42],[1.05,44,32,26],[1.3,22,18,18]]
};

function ambAt(u){
  u=clamp(u,0,AMBT[AMBT.length-1][0]);
  for(var i=0;i<AMBT.length-1;i++)if(u<=AMBT[i+1][0]){var t=(u-AMBT[i][0])/(AMBT[i+1][0]-AMBT[i][0]);return mixc(AMBT[i][1],AMBT[i+1][1],t);}

function colStops(tab,d){
  if(d<=tab[0][0])return [tab[0][1],tab[0][2],tab[0][3]];
  for(var i=0;i<tab.length-1;i++)if(d<=tab[i+1][0]){var t=(d-tab[i][0])/(tab[i+1][0]-tab[i][0]);return [lerp(tab[i][1],tab[i+1][1],t),lerp(tab[i][2],tab[i+1][2],t),lerp(tab[i][3],tab[i+1][3],t)];}
  var l=tab[tab.length-1];return [l[1],l[2],l[3]];
}
var SKY=[[0,[74,128,204],[224,168,142],[255,206,132]],[.25,[62,98,182],[236,142,112],[255,172,92]],[.5,[50,68,152],[226,106,106],[255,126,72]],[.7,[34,40,104],[152,72,122],[242,96,82]],[.85,[16,20,62],[72,46,102],[172,70,92]],[1,[9,11,38],[26,28,68],[96,52,84]],[1.3,[5,6,24],[14,16,46],[50,36,66]],[1.9,[5,6,24],[14,16,46],[50,36,66]],[2.15,[8,10,34],[26,28,70],[80,52,96]],[2.4,[24,32,92],[96,74,138],[222,128,140]],[2.65,[50,88,164],[200,140,164],[255,176,132]],[2.9,[66,122,198],[196,176,196],[255,208,152]],[3.15,[78,140,214],[170,198,232],[238,226,206]],[3.5,[58,122,224],[134,182,236],[208,226,244]]];
function keyAt(tab,u){

  var l=tab[tab.length-1];return [l[1],l[2],l[3]];
}
var SKIN=[[246,214,180],[232,184,142],[198,142,98],[150,100,66],[110,72,48]];
var HAIR=[[40,28,24],[88,56,34],[150,98,44],[214,176,98],[170,60,40],[200,200,206],[24,22,34]];
var COAT=[[196,66,56],[60,104,176],[76,144,92],[220,170,54],[142,86,168],[220,120,60],[70,76,90],[60,150,160]];
var PANTS=[[56,62,90],[70,60,50],[48,70,64],[88,82,100]];

/* ================= state ================= */
var cv=$('c');
var W=0,H=0,P=3,LW=0,LH=0,availR=0,availB=0,topY=0,HZ=60,stars=[];
var pit={cx:0,cy:0,R:22},geo={rx:44,ry:70},seats=[];
var state='menu',S=null,speedMul=1,uiPause=false,hidden=false,tClock=0;
var settings={vol:.8,crackle:.9,amb:.6,hints:true,muted:false};
var best={t:0,served:0};
try{var sj=JSON.parse(localStorage.getItem('fireside-settings')||'null');if(sj)for(var k in sj)if(k in settings)settings[k]=sj[k];}catch(e){}
try{var bj=JSON.parse(localStorage.getItem('fireside-best')||'null');if(bj){best.t=bj.t||0;best.served=bj.served||0;}}catch(e){}

var F={fuel:0,flame:0,coals:0,flare:0,I:0,Iv:0};
var inv={kindling:8,log:6};
var people=[],sticks=[],parts={sparks:[],smoke:[],puffs:[]};

/* ================= vector art ================= */
function rgbA(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')';}
function lite(c,t){return mixc(c,[255,255,255],t);}
function dark(c,t){return mixc(c,[24,10,36],t);}
function rrect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}

function fillEll(c,x,y,rx,ry,f){c.beginPath();c.ellipse(x,y,rx,ry,0,0,6.2832);c.fillStyle=f;c.fill();}
function fillPoly(c,pts,f){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fillStyle=f;c.fill();}

function drawFood(c,food,d,cx,cy,o){
  o=o||{};
  var s=o.s||1,base=colStops(FCOL[food],d),hi=lite(base,.34),lo=dark(base,.3),sc=clamp((d-.36)*1.25,0,.95),i,j;
  c.save();c.translate(cx,cy);if(o.vert)c.rotate(-Math.PI/2);c.scale(s,s);
  if(o.clip!=null&&o.clip<1){c.beginPath();c.rect(-10,-10,20*Math.max(.02,o.clip),20);c.clip();}
  if(food==='mallow'){
    fillRR(c,-4.6,-3.2,9.2,6.8,2.9,colA(lo));fillRR(c,-4.6,-3.6,9.2,6.4,2.9,colA(base));

  }else if(food==='dog'){
    if(o.bun){fillRR(c,-6.5,-3.3,13,6.9,3.3,'#d49650');fillRR(c,-6.5,-3.7,13,5.9,3.2,'#f2c27c');fillRR(c,-5.2,-3.2,9,1.4,.7,'rgba(255,244,210,.75)');}
    fillRR(c,-7,-1.9,14,4.4,2.2,colA(lo));fillRR(c,-7,-2.3,14,3.8,1.9,colA(base));fillRR(c,-5.6,-1.9,9.4,1.1,.55,rgbA(hi,.7));
    if(d>.38){c.strokeStyle=rgbA(dark(base,.55),clamp((d-.3)*1.4,0,.85));c.lineWidth=.9;c.lineCap='round';for(i=0;i<4;i++){c.beginPath();c.moveTo(-4.6+i*3,-1.7);c.lineTo(-3.6+i*3,1.5);c.stroke();}}
    blotch(c,base,sc*.8,3,12,3,5);
  }else if(food==='corn'){
    fillPoly(c,[[-8.8,.2],[-5.2,-3.1],[-4.6,0],[-5.2,3.1]],'#7cbc52');fillPoly(c,[[-8.8,.2],[-5.4,-1.4],[-5.4,2]],'#c9b36a');
    fillRR(c,-6,-2.7,12.8,5.8,2.9,colA(lo));fillRR(c,-6,-3,12.8,5.2,2.6,colA(base));
    for(j=0;j<3;j++)for(i=0;i<7;i++){
      var kx=-4.7+i*1.7+(j%2)*.8,ky=-1.7+j*1.7,burnt=hash2(i,j,9)<sc*.55;

    fillRR(c,-6,-2,12,4.4,2.2,colA(lo));fillRR(c,-6,-2.4,12,3.9,1.9,colA(base));

    blotch(c,base,sc,4,11,3.4,7);

}
function drawEmote(c,name,cx,cy){
  c.save();c.translate(cx,cy);c.lineCap='round';
  if(name==='heart'){
    c.beginPath();c.moveTo(0,5);c.bezierCurveTo(-8,-.6,-4.8,-6.6,0,-2.8);c.bezierCurveTo(4.8,-6.6,8,-.6,0,5);
    c.fillStyle='#ff4a6a';c.fill();c.lineWidth=1.1;c.strokeStyle='#b81e44';c.stroke();
    fillEll(c,-2.8,-2.6,1.2,.8,'rgba(255,255,255,.8)');

var DPR=1,SC=3,X=cv.getContext('2d'),gnd=document.createElement('canvas'),lay=document.createElement('canvas'),lx=lay.getContext('2d');

function layout(){
  var ar=$('app').getBoundingClientRect(),oldCx=pit.cx,oldCy=pit.cy,i;
  W=ar.width;H=ar.height;
  P=clamp(Math.round(H/280),2,6);P=Math.max(P,Math.ceil(W/330));
  DPR=Math.min(2,window.devicePixelRatio||1);
  LW=Math.ceil(W/P);LH=Math.ceil(H/P);SC=DPR*P;
  cv.width=Math.round(LW*SC);cv.height=Math.round(LH*SC);cv.style.width=(LW*P)+'px';cv.style.height=(LH*P)+'px';
  gnd.width=lay.width=cv.width;gnd.height=lay.height=cv.height;
  var tr=$('tray').getBoundingClientRect(),side=tr.width<W*.8;
  availR=side?(tr.left-ar.left)/P:LW;
  availB=side?LH:(tr.top-ar.top)/P;
  topY=($('hud').getBoundingClientRect().bottom-ar.top)/P+1;
  geo.rx=Math.max(30,Math.min(60,availR/2-26));
  geo.ry=geo.rx*.66;
  pit.cx=Math.round(availR/2);pit.cy=Math.round(topY+(availB-topY)*.58);
  pit.R=clamp(Math.round(geo.rx*.5),15,26);
  HZ=Math.max(Math.round(topY+6),Math.round(pit.cy-72));
  seats=[];
  for(i=0;i<SEATN;i++){
    var a=i*Math.PI*2/SEATN,x=pit.cx+geo.rx*Math.cos(a),y=pit.cy+geo.ry*Math.sin(a);
    var vx=pit.cx-x,vy=pit.cy-y,l=Math.hypot(vx,vy)||1,ol=Math.hypot(vx,vy*.35)||1;
    seats.push({x:x,y:y,dx:vx/l,dy:vy/l,ox:-vx/ol,oy:-vy*.35/ol,bu:(y>pit.cy+2)?1:-1,type:i});
  }
  var sr=mulberry(5),ns=Math.round(LW*HZ/60);stars=[];
  for(i=0;i<ns;i++)stars.push({x:sr()*LW,y:sr()*HZ*.9,thr:.26+.7*Math.pow(sr(),1.25),big:sr()<.12,ph:sr()*6.28});
  clouds=[];for(i=0;i<6;i++)clouds.push({x:sr()*LW,y:topY+10+sr()*Math.max(8,HZ-topY-30),s:.8+sr()*.9,v:.5+sr()*1.2});
  treeXs=[];for(x=0;x<LW+6;x+=4+sr()*3)treeXs.push([x,5+sr()*7]);
  if(oldCx){
    var sx=pit.cx-oldCx,sy=pit.cy-oldCy;

    for(i=0;i<people.length;i++){var p=people[i];if(p.st==='sit'){var s=seats[p.seat];p.x=s.x;p.y=s.y;p.dx=s.dx;p.dy=s.dy;}else{var s2=seats[p.seat];p.tx=p.st==='leave'?p.x+s2.ox*140:s2.x;p.ty=p.st==='leave'?p.y+s2.oy*140:s2.y;}}

function buildScene(){
  var rng=mulberry(31),i,x,y,g=gnd.getContext('2d');
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,gnd.width,gnd.height);g.setTransform(SC,0,0,SC,0,0);
  var gr=g.createLinearGradient(0,HZ,0,LH);gr.addColorStop(0,'#a2d86c');gr.addColorStop(.4,'#7cc050');gr.addColorStop(1,'#5aa63f');
  g.fillStyle=gr;g.fillRect(0,HZ,LW,LH-HZ);
  for(i=0;i<LW*(LH-HZ)/180;i++){

    patchPoly(g,x,y,5+rng()*13+tt*8,rng,rng()<.5?'rgba(255,255,200,.07)':'rgba(10,70,20,.08)');

  for(k=0;k<18;k++){var a=k/18*6.2832;pts.push([pit.cx+Math.cos(a)*cax*(.94+rng()*.1),pit.cy+Math.sin(a)*cay*(.94+rng()*.1)]);}

  fillPoly(g,pts,'#6f6355');

  fillPoly(g,p2,'#7b6e5f');
  for(i=0;i<26;i++){var a2=rng()*6.28,rd=Math.sqrt(rng());patchPoly(g,pit.cx+Math.cos(a2)*cax*.85*rd,pit.cy+Math.sin(a2)*cay*.85*rd,3+rng()*6,rng,rng()<.5?'rgba(255,255,255,.13)':'rgba(50,35,20,.16)');}

  /* grass tufts, flowers, rocks */
  for(i=0;i<LW*(LH-HZ)/230;i++){

/* ================= fire simulation ================= */
function fireTick(dt){
  var burning=F.fuel>0;
  if(burning)F.fuel=Math.max(0,F.fuel-dt*(1+1.3*F.flare));
  var ft=burning?Math.min(1.25,.22+F.fuel/200):0;

  if(F.flame<.004&&!burning)F.flame=0;

  F.I=clamp(Math.max(F.flame*.85,F.coals*.5)+F.flare*.2,0,1.5);
  F.Iv+=(F.I-F.Iv)*(1-Math.exp(-dt*2.2));

  var mr=pit.R+5,dx=x-pit.cx,dz=pdz(y),r=Math.hypot(dx,dz);

    var bad=false;

        bad=true;var ang=Math.atan2(py-s.y,px-s.x);if(!isFinite(ang)||(px===s.x&&py===s.y))ang=Math.random()*6.28;

function renderFrame(tNow){

  X.setTransform(SC,0,0,SC,0,0);

  /* depth-sorted scene objects */
  var items=[];

  for(i=0;i<people.length;i++)items.push({y:people[i].y,p:people[i]});
  items.sort(function(a,b){return a.y-b.y;});
  /* back layer */
  lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,lay.width,lay.height);lx.drawImage(gnd,0,0);lx.setTransform(SC,0,0,SC,0,0);

  tintLayer(u,flick);
  X.save();compose();X.restore();X.setTransform(SC,0,0,SC,0,0);
  var hz=X.createLinearGradient(0,HZ,0,HZ+26),hc=mixc(sk[2],[255,255,255],.2);hz.addColorStop(0,rgbA(hc,.3));hz.addColorStop(1,rgbA(hc,0));X.fillStyle=hz;X.fillRect(0,HZ,LW,26);
  drawFlames(X,tNow);
  for(i=0;i<ringStones.length;i++)if(ringStones[i].y>pit.cy)stoneShape(X,ringStones[i]);
  /* front layer */
  lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,lay.width,lay.height);lx.setTransform(SC,0,0,SC,0,0);
  for(i=0;i<items.length;i++){var it2=items[i];if(it2.y<=pit.cy+3)continue;if(it2.seat)drawSeat(lx,it2.seat);else drawPerson(lx,it2.p,tNow);}

  tintLayer(u,flick);
  X.save();compose();X.restore();X.setTransform(SC,0,0,SC,0,0);
  drawOverlay(X,tNow,u);
}

/* ---- dragging ---- */
function nearestPerson(x,y){
  var best=null,bd=14,i;
  for(i=0;i<people.length;i++){var p=people[i];if(p.st!=='sit')continue;var d=Math.hypot(p.x-x,p.y-14-y);if(d<bd){bd=d;best=p;}}
  return best;
}
function startDrag(e,type,kind){
  if(state!=='play'||uiPause||drag)return;
  audioStart();
  if(type==='wood'){if(!(inv[kind]>0)){toast('Out of '+(kind==='log'?'logs':'kindling')+'. Try gathering.');return;}}
  drag={type:type,kind:kind,food:kind,d:0,id:e.pointerId,sx:e.clientX,sy:e.clientY,t0:performance.now(),moved:0,x:0,y:0,overFire:false,target:null,from:null};
  moveDrag(e);
}
function moveDrag(e){
  if(!drag)return;
  var r=cv.getBoundingClientRect(),off=drag.type==='wood'?40:(drag.type==='stick'?16:46);
  drag.fx=(e.clientX-r.left)/P;drag.fy=(e.clientY-r.top)/P;
  drag.x=drag.fx;drag.y=(e.clientY-r.top-off)/P;
  drag.moved=Math.max(drag.moved,Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy));
  var core=inFire(drag.x,drag.y,0),tg=(drag.type==='stick'||drag.type==='food')?nearestPerson(drag.x,drag.y):null;
  drag.target=(tg&&!core)?tg:null;
  drag.overFire=core||(!drag.target&&inFire(drag.x,drag.y,12));
}
function pickStick(x,y){
  var best=-1,bd=99,i;
  for(i=0;i<sticks.length;i++){
    var st=sticks[i],an=stickAnchor(st.x,st.y),d=Math.hypot(st.x-x,st.y-y),ax=an[0],ay=an[1],bx=st.x,by=st.y-5,vx=bx-ax,vy=by-ay,t=clamp(((x-ax)*vx+(y-ay)*vy)/(vx*vx+vy*vy||1),0,1);
    var ds=Math.hypot(ax+vx*t-x,ay+vy*t-y),sc=d<=12?d:(ds<=6?ds+8:99);
    if(sc<bd){bd=sc;best=i;}
  }
  return bd<99?best:-1;
}
function endDrag(){
  var d=drag;if(!d)return;drag=null;
  var tray=$('tray').getBoundingClientRect(),cvr=cv.getBoundingClientRect();
  var overTray=(d.fy*P+cvr.top)>tray.top-4&&tray.width>=W*.8||(tray.width<W*.8&&(d.fx*P+cvr.left)>tray.left);
  if(d.type==='food'){
    if(d.overFire){if(placeStick(d.food,0,d.x,d.y,false))S.stats.cooked++;}
    else if(d.target)toast('Cook it first.');
  }else if(d.type==='stick'){
    var it=d.item;
    if(d.overFire){if(!placeStick(it.food,it.d,d.x,d.y,false))sticks.push(it);}
    else if(d.target){
      var p=d.target;
      if(p.order&&!p.eat){deliver(p,it);}
      else{toast(p.eat?'They are still eating.':'They have not asked for anything yet.');sticks.push(it);}
    }
    else if(overTray){addPuff(d.x,d.y);sfx('toss');toast('Tossed it.',1200);}
    else{sticks.push(it);}
  }else if(d.type==='wood'){
    var short=(performance.now()-d.t0<350&&d.moved<10);
    if(d.overFire||short)addWood(d.kind);
  }
  refreshTray();persist();
}
window.addEventListener('pointermove',function(e){if(drag&&e.pointerId===drag.id)moveDrag(e);});

  if(state!=='play'||!S)return '';
  if(fireDead())return 'The fire is out. Light it again with kindling.';
  if(S.t<25&&sticks.length===0&&S.stats.served===0)return 'Campers picture what they want in a bubble. Drag a marshmallow or hot dog onto the fire.';
  if(sticks.length>0&&S.stats.served===0)return 'Drag the food to move it: center cooks fast, edge cooks slow. Hand it to a camper when it matches their bubble.';
  if(F.I<.3&&F.fuel<40)return 'The fire is getting low. Add kindling or a log.';
  return '';
}
function updateHud(){
  $('bspd').textContent=speedMul+'X';
  var I=F.Iv;
  $('firebar').style.width=(clamp(I/1.1,0,1)*100).toFixed(0)+'%';
  $('firet').textContent=I<.03?'OUT':(I<.22?'EMBER':(I<.55?'LOW':(I<.95?'GOOD':'ROAR')));
  var am=avgMood(),cb=$('campbar');
  cb.style.width=(am*100).toFixed(0)+'%';
  cb.style.background=am<.3?'linear-gradient(#ff9a8a,#d03a2a)':(am<.6?'linear-gradient(#ffe08a,#e0a020)':'linear-gradient(#b8f08a,#4cae4c)');
  $('campt').textContent=presentCount()+'/'+SEATN;
  $('bsnd').textContent=settings.muted?'MUTE':'SND';
  if(S){$('clk').textContent=clockStr();$('srv').textContent='SERVED '+S.stats.served;}
  var hn=$('hint'),tr=$('tray').getBoundingClientRect(),ar=$('app').getBoundingClientRect(),side=tr.width<ar.width*.8;
  hn.style.bottom=(side?16:(ar.bottom-tr.top+6))+'px';hn.style.left='0';hn.style.right=(side?(ar.right-tr.left):0)+'px';
}
function updateHint(now){
  var t=(state==='play'&&!uiPause&&settings.hints)?hintText():'',hn=$('hint');
  if(t!==lastHint){if(!t||now-hintShownAt>5000||!lastHint){lastHint=t;hintShownAt=now;hn.textContent=t;hn.className=t?'on':'';}}
}

/* ================= main loop ================= */
function worldTick(dt){
  S.t+=dt;
  fireTick(dt);stickTick(dt);peopleTick(dt);
  if(drag&&drag.type==='stick'&&drag.overFire&&drag.item){var hh=heatAt(drag.x,drag.y);drag.d=Math.min(1.3,drag.d+FOODS[drag.food].rate*hh*dt);drag.item.d=drag.d;}
  if(gather.t>0){gather.t-=dt;if(gather.t<=0){gather.t=0;finishGather();}}
  if(F.flame>.1&&Math.random()<dt*F.flame*1.2)emitSparks(pit.cx+(Math.random()-.5)*pit.R*.8,pit.cy-8,1,.5);
  if(F.flame>.05&&Math.random()<dt*2)addSmoke(pit.cx+(Math.random()-.5)*pit.R*.6,pit.cy-14-F.flame*10,.35);
  if(S.over){S.overT-=dt;if(S.overT<=0&&!uiPause)showOver();}
  checkEnd();
}
function frame(ts){
  var dt=Math.min(.1,(ts-lastTs)/1000||0);lastTs=ts;tClock+=dt;
  var running=state==='play'&&!uiPause&&!hidden;
  if(running)worldTick(dt*speedMul);
  else if(state==='menu'){fireTick(dt);}
    if(state!=='play'||running){
    /* people keep their idle animation in the menu */
    if(state==='menu'){for(var i=0;i<people.length;i++)people[i].ph+=dt;}
    updateParticles(dt);
  }
  renderFrame(tClock);
  hudAcc+=dt;if(hudAcc>.12){hudAcc=0;updateHud();}
  trayAcc+=dt;if(trayAcc>.25){trayAcc=0;refreshTray();}
  hintAcc+=dt;if(hintAcc>1){hintAcc=0;updateHint(performance.now());}
  saveAcc+=dt;if(saveAcc>6){saveAcc=0;persist();}
  requestAnimationFrame(frame);
}
var rzT=0;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){layout();},120);});
document.addEventListener('visibilitychange',function(){
  hidden=document.hidden;
  if(hidden){persist();if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();}
  else{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();}
});
window.addEventListener('pagehide',persist);
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
buildTray();
S={t:0,id:1,demo:true,stats:{served:0,perfect:0,good:0,meh:0,bad:0,burnt:0,left:0,cooked:0},nextArr:28,over:false,overT:0,dawnShown:false};
layout();
showMenu();
requestAnimationFrame(function(ts){lastTs=ts;requestAnimationFrame(frame);});
window.__FS={S:function(){return S;},F:F,inv:inv,people:function(){return people;},sticks:function(){return sticks;},seats:function(){return seats;},pit:pit,
  startNew:startNew,mk:function(seat,mode){return mkPerson(seat,mode||'sit');},placeStick:placeStick,deliver:deliver,addWood:addWood,setT:function(t){S.t=t;},state:function(){return state;},heatAt:heatAt,
  qualify:qualify,makeOrder:makeOrder,leavePerson:leavePerson,tick:function(dt){worldTick(dt);},info:function(){return {P:P,LW:LW,LH:LH,availB:availB,topY:topY,geo:geo};}};
})();
</script>
