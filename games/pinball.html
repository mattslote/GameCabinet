<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridiron Pinball</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Big+Shoulders+Display:wght@700;900&display=swap">
<style>
/* Layout: scoreboard plates on top, one portrait table that scales to fit, a slim control bar below.
   Look: Friday-night stadium. Striped turf, chalk lines, red end zone, chrome rails, painted helmets. One world, single theme. */
:root {
  --bg: #0f1410;
  --wood: #14100b;
  --turf: #1f6b3a;
  --turf-2: #1a5e33;
  --endzone: #9c1f2b;
  --chalk: #f4f1e6;
  --gold: #ffcf3a;
  --amber: #ffb627;
  --coral: #ee4b35;
  --navy: #14224a;
  --chrome: #cfd6df;
  --plate: #0a0e0b;
  --ink: #eef1e8;
  --ink-dim: #9aa89c;
  --line-dim: #33453a;
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.lab { display: block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.val { display: block; font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
.val small { font-size: .5em; font-weight: 700; color: var(--ink-dim); margin-left: 2px; }
.hud { display: flex; padding-bottom: 6px; border-bottom: 2px solid var(--chalk); }
.stat { flex: 1; min-width: 0; }
.stat.score { flex: 2.1; }
.stat.field { flex: 1.5; }
.stat.field .val { font-size: 27px; padding-top: 5px; }
.stat + .stat { padding-left: 10px; border-left: 1px solid var(--line-dim); }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.court { position: relative; box-shadow: 0 0 0 2px var(--chalk); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; }
.overlay { overflow-y: auto; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; background: color-mix(in srgb, var(--plate) 74%, transparent); }
.overlay[hidden] { display: none; }
.card { margin: auto; box-sizing: border-box; width: min(100%, 350px); display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--plate); border: 2px solid var(--chalk); }
.card h1, .card h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 56px; line-height: .92; letter-spacing: .01em; text-transform: uppercase; color: var(--chalk); text-wrap: balance; }
.card h1 span { display: block; font-size: 26px; letter-spacing: .24em; color: var(--gold); }
.card p { margin: 0; line-height: 1.4; color: var(--ink); max-width: 38ch; }
.card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.card li { display: flex; gap: 10px; line-height: 1.3; color: var(--ink); font-size: 14px; }
.card li b { flex: none; width: 74px; font-family: var(--display); font-weight: 900; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
.res { display: flex; gap: 16px; }
.res > div { flex: 1; min-width: 0; }
.res em { display: block; margin-top: 2px; font-style: normal; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk); }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.btn { min-height: 48px; padding: 0 14px; font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; color: var(--chalk); background: transparent; border: 2px solid var(--chalk); cursor: pointer; touch-action: manipulation; }
.btn.primary { color: var(--plate); background: var(--amber); border-color: var(--amber); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badges span { font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: .05em; text-transform: uppercase; color: var(--plate); background: var(--amber); padding: 4px 10px; }
.chip { min-height: 44px; padding: 0 10px; font-family: var(--body); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1.5px solid var(--line-dim); cursor: pointer; touch-action: manipulation; }
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.bar { display: flex; align-items: center; gap: 8px; padding-top: 6px; border-top: 2px solid var(--chalk); }
.best { flex: 1; min-width: 0; }
#best { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
@media (max-height: 640px) { .val { font-size: 28px; } .card h1, .card h2 { font-size: 44px; } }
</style>

<div class="app">
  <header class="hud">
    <div class="stat score"><span class="lab">Score</span><span class="val" id="score">0</span></div>
    <div class="stat"><span class="lab">Ball</span><span class="val" id="ball">1<small>/3</small></span></div>
    <div class="stat"><span class="lab">Bonus</span><span class="val" id="mult">&times;1</span></div>
    <div class="stat field"><span class="lab">Field</span><span class="val" id="field">OWN 25</span></div>
  </header>
  <main class="stage" id="stage">
    <div class="court" id="court">
      <canvas id="cv" aria-label="Football pinball table. Hold to pull the plunger and release to launch. Touch the left half of the table for the left flipper and the right half for the right flipper."></canvas>
      <div class="overlay" id="ov" hidden><div class="card" id="card"></div></div>
    </div>
  </main>
  <footer class="bar">
    <div class="best"><span class="lab">Best</span><span id="best">No score yet</span></div>
    <button class="chip" id="snd" type="button" aria-pressed="false">Sound on</button>
    <button class="chip" id="reset" type="button">New game</button>
  </footer>
</div>

<script>
(function () {
'use strict';

/* ---------- Physics (no DOM, so it can be tested headless) ---------- */
var W = 540, H = 864, R = 10, G = 840, STEP = 1 / 300, MAXV = 1750, TAU = Math.PI * 2;
var FLEN = 80, FTHICK = 7, FLIP_W = 17;
var PIV = { L: { x: 158, y: 745 }, R: { x: 346, y: 745 } };
var REST = { L: .55, R: Math.PI - .55 }, ACT = { L: -.5, R: Math.PI + .5 };
var LANE_X0 = 480, LANE_X1 = 516, LANE_FLOOR = 800, START = { x: 498, y: 788 };
var SAVER_TIME = 10, BALLS = 3, LANE_Y = 88, LANE_C = [202, 252, 302];
var RAMP_V = 560, START_YD = 25, FG_RANGE = 50;

var walls = [], posts = [], bumpers = [], slings = [], defenders = [], ramps = [];
function wall(ax, ay, bx, by, e, tag, th) { var s = { ax: ax, ay: ay, bx: bx, by: by, th: th || 0, e: e == null ? .5 : e, tag: tag || 'wall' }; walls.push(s); return s; }

(function () {
  var N = 44, i, a0, a1;
  for (i = 0; i < N; i++) {
    a0 = Math.PI - Math.PI * i / N; a1 = Math.PI - Math.PI * (i + 1) / N;
    wall(270 + 246 * Math.cos(a0), 270 - 246 * Math.sin(a0), 270 + 246 * Math.cos(a1), 270 - 246 * Math.sin(a1), .45, 'arch');
  }
  wall(24, 270, 24, 655, .45);
  wall(24, 655, 150, 742, .4, 'guide');
  wall(516, 270, 516, LANE_FLOOR, .45);
  wall(LANE_X0, LANE_FLOOR, LANE_X1, LANE_FLOOR, .3, 'floor');
  wall(LANE_X0, 300, LANE_X0, LANE_FLOOR, .45);
  wall(LANE_X0, 655, 354, 742, .4, 'guide');
  var g = wall(516, 262, 470, 300, .35, 'gate');
  var dx = g.bx - g.ax, dy = g.by - g.ay, l = Math.sqrt(dx * dx + dy * dy);
  g.oneway = true; g.nx = -dy / l; g.ny = dx / l;
  [177, 227, 277, 327].forEach(function (x) { wall(x, 64, x, 108, .5, 'divider', 3); });
})();
posts.push({ x: 108, y: 330, r: 9, e: .6 }, { x: 396, y: 330, r: 9, e: .6 });
bumpers.push({ x: 178, y: 215, r: 27, flash: 0 }, { x: 326, y: 215, r: 27, flash: 0 }, { x: 252, y: 300, r: 27, flash: 0 });
[{ A: [60, 575], B: [60, 645], C: [116, 675] }, { A: [444, 575], B: [444, 645], C: [388, 675] }].forEach(function (t, k) {
  var face = wall(t.A[0], t.A[1], t.C[0], t.C[1], .55, 'sling', 0);
  face.kick = 340; face.idx = k;
  wall(t.A[0], t.A[1], t.B[0], t.B[1], .4, 'slingback');
  wall(t.B[0], t.B[1], t.C[0], t.C[1], .4, 'slingback');
  slings.push({ A: t.A, B: t.B, C: t.C, flash: 0, face: face });
});
[[160, 22], [206, 54], [252, 99], [298, 34], [344, 81]].forEach(function (d, i) {
  defenders.push({ cx: d[0], y: 468, A: 9 + (i % 2) * 4, per: 4 + i * .45, ph: i * 1.3, x: d[0], r: 12, e: .5, up: true, fall: 0, flash: 0, num: d[1] });
});
var SAUCER = { x: 252, y: 392, r: 17 };

function catmull(pts) {
  var out = [], n = pts.length, i, t, p0, p1, p2, p3, seg = 12, u, u2, u3;
  for (i = 0; i < n - 1; i++) {
    p0 = pts[Math.max(0, i - 1)]; p1 = pts[i]; p2 = pts[i + 1]; p3 = pts[Math.min(n - 1, i + 2)];
    for (t = 0; t < seg; t++) {
      u = t / seg; u2 = u * u; u3 = u2 * u;
      out.push({
        x: .5 * (2 * p1[0] + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
        y: .5 * (2 * p1[1] + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
      });
    }
  }
  out.push({ x: pts[n - 1][0], y: pts[n - 1][1] });
  var len = 0; out[0].d = 0;
  for (i = 1; i < out.length; i++) { len += Math.sqrt(Math.pow(out[i].x - out[i - 1].x, 2) + Math.pow(out[i].y - out[i - 1].y, 2)); out[i].d = len; }
  return { pts: out, len: len };
}
function pointAt(rp, d) {
  var a = rp.pts, lo = 0, hi = a.length - 1, m;
  while (hi - lo > 1) { m = (lo + hi) >> 1; if (a[m].d <= d) lo = m; else hi = m; }
  var s = (a[hi].d - a[lo].d) || 1, u = Math.max(0, Math.min(1, (d - a[lo].d) / s));
  return { x: a[lo].x + (a[hi].x - a[lo].x) * u, y: a[lo].y + (a[hi].y - a[lo].y) * u };
}
(function () {
  var L = [[96, 455], [68, 415], [52, 355], [48, 290], [68, 222], [108, 165], [150, 130]];
  var Rr = L.map(function (p) { return [504 - p[0], p[1]]; });
  ramps.push({ name: 'PASS PLAY', key: 'L', mx: 96, my: 455, mr: 28, ctrl: L, exit: { vx: 210, vy: 70 }, yd: 12, pts: 2000, flash: 0 });
  ramps.push({ name: 'LONG BOMB', key: 'R', mx: 408, my: 455, mr: 28, ctrl: Rr, exit: { vx: -210, vy: 70 }, yd: 18, pts: 3000, flash: 0 });
  ramps.forEach(function (r) { var c = catmull(r.ctrl); r.rp = c; r.len = c.len; });
})();

function createWorld() {
  var w = {
    score: 0, ballNo: 1, mult: 1, lanes: [false, false, false], tdown: 0, tReset: 0,
    state: 'ready', pull: 0, pulling: false, autoPull: false, saver: 0, balls: [], fl: {
      L: { phi: REST.L, w: 0, down: false }, R: { phi: REST.R, w: 0, down: false }
    },
    saucer: { ball: null, t: 0, hits: 0, mb: false }, mb: false, hits: 0, drainT: 0, bonus: 0, over: false,
    sfx: null, pop: null, fx: null, simT: 0, maxMult: 1, mbCount: 0, yd: START_YD, tds: 0, fgs: 0, extras: 0, sacks: 0, ramps: 0, jackpots: 0, lastPts: 0
  };
  bumpers.forEach(function (b) { b.flash = 0; });
  slings.forEach(function (s) { s.flash = 0; });
  ramps.forEach(function (r) { r.flash = 0; });
  newBall(w, false);
  return w;
}
function mkBall(x, y) { return { x: x, y: y, vx: 0, vy: 0, ang: -1.2, held: false, cd: 0, still: 0, trail: [], ramp: null }; }
function newBall(w, keep) {
  w.balls = [mkBall(START.x, START.y)];
  w.state = 'ready'; w.pull = 0; w.pulling = false; w.saver = 0;
  w.mb = false; w.saucer.ball = null; w.saucer.mb = false;
  defenders.forEach(function (d) { d.up = true; d.fall = 0; }); w.tdown = 0; w.tReset = 0;
  if (!keep) { w.mult = 1; w.lanes = [false, false, false]; w.hits = 0; w.yd = START_YD; w.saucer.hits = 0; w.tds = 0; w.bonus = 0; }
}
function award(w, pts, x, y, text) {
  var v = Math.round(pts * w.mult);
  w.score += v;
  if (w.pop) w.pop(text || ('+' + v), x, y);
}
function raiseMult(w, x, y) {
  if (w.mult < 5) { w.mult++; if (w.mult > w.maxMult) w.maxMult = w.mult; if (w.pop) w.pop('BONUS ×' + w.mult, x, y, true); }
  else award(w, 5000, x, y);
  if (w.sfx) w.sfx('mult');
}
function touchdown(w) {
  w.tds++;
  award(w, 7000, 252, 340, 'TOUCHDOWN!');
  if (w.extras < 1) { w.extras++; if (w.pop) w.pop('EXTRA BALL', 252, 395, true); }
  else award(w, 10000, 252, 395, 'TD BONUS');
  raiseMult(w, 252, 430);
  w.yd = START_YD; w.saver = Math.max(w.saver, 8);
  if (w.sfx) w.sfx('td');
  if (w.fx) w.fx('td', 252, 330);
}
function addYards(w, n) {
  var before = w.yd;
  w.yd += n;
  if (w.yd >= 100) { touchdown(w); return; }
  if (Math.floor(w.yd / 10) > Math.floor(before / 10)) {
    w.score += 500 * w.mult;
    if (w.pop) w.pop('FIRST DOWN', 252, 270);
    if (w.sfx) w.sfx('firstdown');
  }
}

function collideSeg(b, s) {
  var abx = s.bx - s.ax, aby = s.by - s.ay, l2 = abx * abx + aby * aby;
  var t = l2 ? ((b.x - s.ax) * abx + (b.y - s.ay) * aby) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  var px = s.ax + abx * t, py = s.ay + aby * t, dx = b.x - px, dy = b.y - py;
  var d = Math.sqrt(dx * dx + dy * dy), m = R + s.th;
  if (d >= m) return 0;
  if (s.oneway && ((b.x - s.ax) * s.nx + (b.y - s.ay) * s.ny) < 0) return 0;
  if (d < 1e-6) { dx = s.nx || 0; dy = s.ny || -1; d = 1; }
  var nx = dx / d, ny = dy / d, svx = 0, svy = 0;
  if (s.fl) { svx = -s.fl.w * (py - s.fl.py); svy = s.fl.w * (px - s.fl.px); }
  var vn = (b.vx - svx) * nx + (b.vy - svy) * ny;
  if (s.oneway && vn >= 0) return 0;
  b.x = px + nx * m; b.y = py + ny * m;
  if (vn < 0) {
    var e = -vn < 90 ? 0 : s.e;
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    if (s.kick && -vn > 50) { b.vx += nx * s.kick; b.vy += ny * s.kick; }
    return -vn;
  }
  return 0;
}
function collideCircle(b, c) {
  var dx = b.x - c.x, dy = b.y - c.y, d = Math.sqrt(dx * dx + dy * dy), m = R + c.r;
  if (d >= m) return 0;
  if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
  var nx = dx / d, ny = dy / d;
  b.x = c.x + nx * m; b.y = c.y + ny * m;
  var vn = b.vx * nx + b.vy * ny;
  if (vn < 0) { b.vx -= (1 + c.e) * vn * nx; b.vy -= (1 + c.e) * vn * ny; return -vn; }
  return .0001;
}
function inLane(b) { return b.x > LANE_X0 + 2 && b.y > 300; }

function moveFlippers(w, dt) {
  ['L', 'R'].forEach(function (k) {
    var f = w.fl[k], tgt = f.down ? ACT[k] : REST[k], diff = tgt - f.phi, mx = FLIP_W * dt;
    if (Math.abs(diff) <= mx) { f.w = diff / dt; f.phi = tgt; }
    else { f.phi += diff > 0 ? mx : -mx; f.w = diff > 0 ? FLIP_W : -FLIP_W; }
  });
}
function flipSegs(w) {
  var out = [];
  ['L', 'R'].forEach(function (k) {
    var f = w.fl[k], p = PIV[k];
    out.push({ ax: p.x, ay: p.y, bx: p.x + FLEN * Math.cos(f.phi), by: p.y + FLEN * Math.sin(f.phi), th: FTHICK, e: .25, tag: 'flipper', fl: { px: p.x, py: p.y, w: f.w } });
  });
  return out;
}
function setFlipper(w, k, down) {
  var f = w.fl[k];
  if (down && !f.down && w.state !== 'over') {
    var l = w.lanes;
    if (k === 'L') w.lanes = [l[1], l[2], l[0]]; else w.lanes = [l[2], l[0], l[1]];
    if (w.sfx) w.sfx('flip');
  } else if (!down && f.down && w.sfx) w.sfx('flipDown');
  f.down = down;
}
function launch(w) {
  if (w.state !== 'ready') return false;
  var b = w.balls[0];
  if (!b) return false;
  var v = 700 + 700 * w.pull;
  b.vy = -v; b.vx = 0;
  w.state = 'play'; w.saver = SAVER_TIME; w.pulling = false;
  if (w.sfx) w.sfx('launch', w.pull);
  w.pull = 0;
  return true;
}

function rampDone(w, r, b) {
  var p = r.rp.pts[r.rp.pts.length - 1];
  b.ramp = null; b.x = p.x; b.y = p.y; b.vx = r.exit.vx; b.vy = r.exit.vy; b.cd = .5;
  r.flash = .9; w.ramps++;
  if (w.mb) {
    w.jackpots++;
    award(w, 10000, p.x, p.y + 50, null);
    if (w.pop) w.pop('JACKPOT!', 252, 250, true);
    if (w.sfx) w.sfx('jackpot');
  } else {
    award(w, r.pts, p.x, p.y + 50, null);
    if (w.pop) w.pop(r.name, 252, 250, true);
    if (w.sfx) w.sfx('rampDone');
  }
  addYards(w, r.yd);
  if (w.fx) w.fx('ramp', p.x, p.y);
}

function stepWorld(w, dt) {
  var i, j, b, k, s, h;
  w.simT += dt;
  if (w.state === 'over' || w.state === 'drain') return;
  moveFlippers(w, dt);
  if (w.pulling && w.autoPull && w.state === 'ready') w.pull = Math.min(1, w.pull + dt / 1.1);
  if (w.state === 'play' && w.saver > 0 && !w.mb) w.saver = Math.max(0, w.saver - dt);
  for (i = 0; i < bumpers.length; i++) if (bumpers[i].flash > 0) bumpers[i].flash = Math.max(0, bumpers[i].flash - dt);
  for (i = 0; i < slings.length; i++) if (slings[i].flash > 0) slings[i].flash = Math.max(0, slings[i].flash - dt);
  for (i = 0; i < ramps.length; i++) if (ramps[i].flash > 0) ramps[i].flash = Math.max(0, ramps[i].flash - dt);
  for (i = 0; i < defenders.length; i++) {
    var d0 = defenders[i];
    d0.x = d0.cx + d0.A * Math.sin(TAU * w.simT / d0.per + d0.ph);
    if (d0.flash > 0) d0.flash = Math.max(0, d0.flash - dt);
    if (!d0.up && d0.fall < 1) d0.fall = Math.min(1, d0.fall + dt * 6);
    if (d0.up && d0.fall > 0) d0.fall = Math.max(0, d0.fall - dt * 3);
  }
  if (w.tReset > 0) {
    w.tReset -= dt;
    if (w.tReset <= 0) { defenders.forEach(function (d) { d.up = true; }); w.tdown = 0; }
  }
  var fsegs = flipSegs(w);

  for (i = 0; i < w.balls.length; i++) {
    b = w.balls[i];
    if (b.held) continue;
    if (b.cd > 0) b.cd -= dt;

    if (lit) { var gl = c.createRadialGradient(lx, ly, 2, lx, ly, 24); gl.addColorStop(0, 'rgba(255,182,39,.55)'); gl.addColorStop(1, 'rgba(255,182,39,0)'); c.fillStyle = gl; c.beginPath(); c.arc(lx, ly, 24, 0, TAU); c.fill(); }
  }
  /* huddle lock lights */
  for (i = 0; i < 3; i++) {
    var lk = (w.saucer.hits % 3) > i || w.saucer.mb;
    c.fillStyle = lk ? C.amber : 'rgba(0,0,0,.45)';
    c.beginPath(); c.arc(SAUCER.x - 18 + i * 18, SAUCER.y + 52, 5, 0, TAU); c.fill();
    c.strokeStyle = C.chalk; c.lineWidth = 1.5; c.beginPath(); c.arc(SAUCER.x - 18 + i * 18, SAUCER.y + 52, 5, 0, TAU); c.stroke();
  }
  /* defenders */
  var allUp = true;
  for (i = 0; i < defenders.length; i++) {
    var d = defenders[i], f = d.fall;
    if (f < .05) {
      c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(d.x + 2, d.y + 5, 17, 11, 0, 0, TAU); c.fill();
      c.fillStyle = d.flash > 0 ? '#fff' : C.navy; c.beginPath(); c.ellipse(d.x, d.y + 3, 17, 10, 0, 0, TAU); c.fill();
      c.strokeStyle = C.chalk; c.lineWidth = 2; c.beginPath(); c.ellipse(d.x, d.y + 3, 17, 10, 0, 0, TAU); c.stroke();
      helmet(c, d.x, d.y - 2, 10.5, C.coral, d.flash > 0, d.num);
    } else {
      c.save(); c.globalAlpha = 1 - f * .55; c.translate(d.x, d.y + 4 * f); c.rotate(f * 1.3); c.scale(1, 1 - f * .25);
      c.fillStyle = C.navy; c.beginPath(); c.ellipse(0, 0, 17, 10, 0, 0, TAU); c.fill();
      c.fillStyle = C.coral; c.beginPath(); c.arc(8, 0, 8, 0, TAU); c.fill();
      c.restore();
    }
    if (!d.up) allUp = false;
  }
  /* slings */
  for (i = 0; i < slings.length; i++) {
    var sl = slings[i];
    c.fillStyle = sl.flash > 0 ? C.chalk : C.navy;
    c.beginPath(); c.moveTo(sl.A[0], sl.A[1]); c.lineTo(sl.B[0], sl.B[1]); c.lineTo(sl.C[0], sl.C[1]); c.closePath(); c.fill();
    c.strokeStyle = C.chalk; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
    c.strokeStyle = sl.flash > 0 ? C.amber : C.coral; c.lineWidth = sl.flash > 0 ? 7 : 4;
    c.beginPath(); c.moveTo(sl.A[0], sl.A[1]); c.lineTo(sl.C[0], sl.C[1]); c.stroke();
  }
  /* bumpers as big helmets */
  for (i = 0; i < bumpers.length; i++) {
    var bm = bumpers[i], k = bm.flash > 0 ? 1 + bm.flash * 1.1 : 1;
    helmet(c, bm.x, bm.y, bm.r * k, C.navy, bm.flash > 0, null);
    c.fillStyle = bm.flash > 0 ? C.coral : C.gold; c.font = '900 20px ' + DISPLAY; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('100', bm.x, bm.y + 8);
    c.strokeStyle = bm.flash > 0 ? C.amber : C.chalk; c.lineWidth = 3; c.beginPath(); c.arc(bm.x + bm.r * .1, bm.y + bm.r * .55, bm.r * .55, .1, 2.2); c.stroke();
  }
  /* plunger: head and knob follow the drag */
  var pull = w.state === 'ready' ? w.pull : 0, hy = LANE_FLOOR + pull * 26, kx = (LANE_X0 + LANE_X1) / 2, ky = hy + 24;
  c.strokeStyle = C.chrome; c.lineWidth = 3; c.beginPath();
  for (i = 0; i < 7; i++) { var yy = hy + 6 + (864 - hy - 6) * i / 6, xx = i % 2 ? LANE_X0 + 6 : LANE_X1 - 6; if (i) c.lineTo(xx, yy); else c.moveTo(kx, yy); }
  c.stroke();
  c.fillStyle = C.chrome; c.fillRect(kx - 3, hy + 6, 6, ky - hy - 6);
  c.fillStyle = C.coral; c.fillRect(LANE_X0 + 3, hy, LANE_X1 - LANE_X0 - 6, 8);
  c.fillStyle = C.chalk; c.fillRect(LANE_X0 + 3, hy, LANE_X1 - LANE_X0 - 6, 2);
  var kg = c.createRadialGradient(kx - 4, ky - 4, 2, kx, ky, 15);
  kg.addColorStop(0, '#ff8a70'); kg.addColorStop(1, C.coral);
  c.fillStyle = kg; c.beginPath(); c.arc(kx, ky, 14, 0, TAU); c.fill();
  c.strokeStyle = C.chalk; c.lineWidth = 2; c.beginPath(); c.arc(kx, ky, 14, 0, TAU); c.stroke();
  if (w.state === 'ready' && st === 'play') {
    /* pull-down arrows and power meter */
    if (pull < .03) {
      var ph = (now / 500) % 1;
      c.fillStyle = C.chalk;
      for (i = 0; i < 3; i++) {
        c.globalAlpha = Math.max(0, Math.sin(Math.PI * Math.min(1, Math.max(0, (ph + i * .25) % 1))) * .8);
        var ay = 690 + ((ph + i * .25) % 1) * 70;
        c.beginPath(); c.moveTo(kx - 9, ay); c.lineTo(kx, ay + 10); c.lineTo(kx + 9, ay); c.lineTo(kx + 9, ay - 4); c.lineTo(kx, ay + 6); c.lineTo(kx - 9, ay - 4); c.closePath(); c.fill();
      }
      c.globalAlpha = 1;
    }
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(522, 560, 12, 240);
    var mh = 240 * pull;
    var mg = c.createLinearGradient(0, 800, 0, 560); mg.addColorStop(0, C.amber); mg.addColorStop(1, C.coral);
    c.fillStyle = mg; c.fillRect(522, 800 - mh, 12, mh);
    c.strokeStyle = C.chalk; c.lineWidth = 1.5; c.strokeRect(522, 560, 12, 240);
  }
  /* flippers */
  ['L', 'R'].forEach(function (key) {
    var f = w.fl[key], p = PIV[key], tx = p.x + FLEN * Math.cos(f.phi), ty = p.y + FLEN * Math.sin(f.phi);
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 20; c.beginPath(); c.moveTo(p.x + 1, p.y + 4); c.lineTo(tx + 1, ty + 4); c.stroke();
    c.strokeStyle = C.coral; c.lineWidth = 19; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(tx, ty); c.stroke();
    c.strokeStyle = C.chalk; c.lineWidth = 12; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(tx, ty); c.stroke();
    c.fillStyle = C.chrome; c.beginPath(); c.arc(p.x, p.y, 5, 0, TAU); c.fill();
  });
  /* flipper buttons in the dark aprons */
  [['L', 87], ['R', 417]].forEach(function (bt) {
    var on = w.fl[bt[0]].down, bx = bt[1], by = 806;
    c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.arc(bx + 2, by + 5, 40, 0, TAU); c.fill();
    c.fillStyle = on ? C.amber : C.navy; c.beginPath(); c.arc(bx, by + (on ? 3 : 0), 38, 0, TAU); c.fill();
    c.strokeStyle = on ? C.chalk : C.chrome; c.lineWidth = 4; c.beginPath(); c.arc(bx, by + (on ? 3 : 0), 38, 0, TAU); c.stroke();
    c.strokeStyle = on ? C.plate : C.chalk; c.lineWidth = 5; c.lineCap = 'round'; c.lineJoin = 'round';
    var dir = bt[0] === 'L' ? 1 : -1, yy2 = by + (on ? 3 : 0);
    c.beginPath(); c.moveTo(bx - 14 * dir, yy2 + 10); c.lineTo(bx + 14 * dir, yy2 - 4); c.stroke();
    c.beginPath(); c.moveTo(bx + 14 * dir, yy2 - 4); c.lineTo(bx + 4 * dir, yy2 - 6); c.moveTo(bx + 14 * dir, yy2 - 4); c.lineTo(bx + 10 * dir, yy2 + 5); c.stroke();
  });
  /* balls on the field */
  for (i = 0; i < w.balls.length; i++) {
    b = w.balls[i];
    if (b.ramp) continue;
    if (!reduce) {
      b.trail.push(b.x, b.y);
      if (b.trail.length > 12) b.trail.splice(0, 2);
      for (var q = 0; q < b.trail.length; q += 2) {
        c.globalAlpha = .05 + .045 * q / 2;
        c.fillStyle = C.chalk; c.beginPath(); c.arc(b.trail[q], b.trail[q + 1], R * .75, 0, TAU); c.fill();
      }
      c.globalAlpha = 1;
    }
    c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(b.x + 3, b.y + 5, R * 1.1, R * .8, 0, 0, TAU); c.fill();
    if (w.state === 'ready' && b.x > LANE_X0) { var ob = b.y; b.y += pull * 26; drawFoot(c, b, 1); b.y = ob; } else drawFoot(c, b, 1);
  }
  /* ramps over the field */
  for (i = 0; i < ramps.length; i++) drawRamp(c, ramps[i], now);
  for (i = 0; i < w.balls.length; i++) {
    b = w.balls[i];
    if (!b.ramp) continue;
    c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(b.x + 6, b.y + 9, R * 1.2, R * .85, 0, 0, TAU); c.fill();
    var pn = pointAt(b.ramp.r.rp, Math.min(b.ramp.d + 12, b.ramp.r.len));
    b.vx = (pn.x - b.x) * 20; b.vy = (pn.y - b.y) * 20;
    drawFoot(c, b, 1.2);
  }
  /* effects */
  for (i = 0; i < sparks.length; i++) {
    var sp = sparks[i];
    c.globalAlpha = Math.max(0, Math.min(1, sp.life)); c.fillStyle = sp.c; c.fillRect(sp.x - sp.s / 2, sp.y - sp.s / 2, sp.s, sp.s * .6);
  }
  c.globalAlpha = 1;
  for (i = 0; i < popups.length; i++) {
    var pp = popups[i], a = Math.min(1, pp.t / .1, (pp.big ? 1.9 : 1.1) - pp.t);
    if (a <= 0) continue;
    c.save();
    c.globalAlpha = Math.min(1, a * 1.3);
    var px = Math.max(90, Math.min(W - 90, pp.x)), py = pp.y - pp.t * (pp.big ? 22 : 40);
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    c.font = '900 ' + (pp.big ? 42 : 22) + 'px ' + DISPLAY;
    c.lineWidth = pp.big ? 8 : 5; c.strokeStyle = C.plate; c.strokeText(pp.text, px, py);
    c.fillStyle = pp.big ? C.gold : C.chalk; c.fillText(pp.text, px, py);

  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  if (w.state === 'ready' && st === 'play') {
    var pulse = .55 + .45 * Math.sin(now / 260);
    c.globalAlpha = hintOn ? pulse : .5; c.fillStyle = C.chalk;
    c.font = '900 22px ' + DISPLAY;
    c.fillText(w.pulling ? 'RELEASE TO LAUNCH' : 'DRAG THE PLUNGER DOWN', 252, 352);
    c.globalAlpha = 1;
  }
  if (w.state === 'drain') {
    c.fillStyle = 'rgba(10,14,11,.85)'; c.fillRect(40, 320, 424, 160);
    c.strokeStyle = C.chalk; c.lineWidth = 2; c.strokeRect(40, 320, 424, 160);
    c.fillStyle = C.chalk; c.font = '900 54px ' + DISPLAY; c.fillText('BALL ' + Math.min(w.ballNo, BALLS) + ' DOWN', 252, 385);
    c.fillStyle = C.amber; c.font = '900 34px ' + DISPLAY; c.fillText('BONUS ' + fmt(w.bonus), 252, 430);
    c.fillStyle = C.chalk; c.globalAlpha = .7; c.font = '600 12px ' + BODY;
    if ('letterSpacing' in c) c.letterSpacing = '2px';
    c.fillText('(' + w.hits + ' HITS × 25 + ' + w.tds + ' TD × 2000) × ' + w.mult, 252, 458);
    if ('letterSpacing' in c) c.letterSpacing = '0px';
    c.globalAlpha = 1;
  }
  if (w.saver > 0 && w.state === 'play' && !w.mb) {
    c.fillStyle = C.amber; c.globalAlpha = .85; c.font = '600 11px ' + BODY;
    if ('letterSpacing' in c) c.letterSpacing = '2px';
    c.fillText('BALL SAVER ' + Math.ceil(w.saver), 252, 840);
    if ('letterSpacing' in c) c.letterSpacing = '0px';
    c.globalAlpha = 1;
  }
  void allUp;
}

/* ---------- Loop ---------- */
function frame(now) {
  var dt = Math.min(.05, (now - last) / 1000 || 0), i;
  last = now;
  if (st === 'play') {
    acc += dt;
    var n = 0;
    while (acc >= STEP && n < 20) { stepWorld(w, STEP); acc -= STEP; n++; }
    if (acc > STEP * 20) acc = 0;
    if (w.state === 'drain') {
      drainTimer += dt;
      if (drainTimer > 2.6) { drainTimer = 0; advance(w); syncHud(true); if (w.over) showOver(); }
    } else drainTimer = 0;
  }
  for (i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > (popups[i].big ? 1.9 : 1.1)) popups.splice(i, 1); }
  for (i = sparks.length - 1; i >= 0; i--) {
    var p = sparks[i]; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.1;
    if (p.life <= 0) sparks.splice(i, 1);
  }
  if (flashT > 0) flashT = Math.max(0, flashT - dt * 1.8);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  syncHud(false);
  if (cv.width > 0) drawScene(now);
  requestAnimationFrame(frame);
}

w = createWorld(); w.sfx = sfx; w.pop = pop; w.fx = fx; w.tdTotal = 0;
resize();
syncHud(true);
elBest.textContent = bestText();
showIntro();
requestAnimationFrame(function (t) { last = t; frame(t); });
})();
