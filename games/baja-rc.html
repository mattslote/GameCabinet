<title>Baja RC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Teko:wght@500;700&display=swap">
<style>
/* Layout: HUD plates on top, one full-bleed canvas stage, two pedal zones over the bottom corners.
   Look: sun-bleached Baja desert that slides from day to dusk as you go. One deliberate world, so single theme. */
:root {
  --bg: #17100b;
  --plate: #0f0a07;
  --ink: #f8eeda;
  --ink-dim: #c7ad87;
  --line: #4d3926;
  --accent: #ff6b1a;
  --amber: #ffc43a;
  --good: #8be26c;
  --warn: #ffb020;
  --bad: #f0452f;
  --display: 'Teko', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: max(6px, env(safe-area-inset-top, 0px));
  padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.app { height: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.lab { display: block; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.val { display: block; font-family: var(--display); font-weight: 700; font-size: 36px; line-height: .95; color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
.val small { font-size: .5em; font-weight: 500; color: var(--ink-dim); margin-left: 3px; letter-spacing: .04em; }
.sub { display: block; margin-top: 1px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud { display: flex; align-items: flex-end; gap: 14px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); }
.stat { min-width: 0; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line); }
.stat.cash .val { color: var(--good); }
.grow { flex: 1; }
.chip {
  min-height: 40px; padding: 0 12px;
  font-family: var(--body); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: transparent; border: 1.5px solid var(--line);
  cursor: pointer; touch-action: manipulation;
}
.chip:focus-visible, .btn:focus-visible, .repair:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.stage { flex: 1; min-height: 0; position: relative; }
.court { position: absolute; inset: 0; overflow: hidden; box-shadow: 0 0 0 2px var(--accent); touch-action: none; background: #5d93bf; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; }
.hp { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(44%, 260px); pointer-events: none; }
.hp .lab { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); display: flex; justify-content: space-between; margin-bottom: 2px; }
.hp .track { height: 12px; background: rgba(15,10,7,.55); border: 2px solid rgba(255,255,255,.75); }
.hp i { display: block; height: 100%; width: 100%; background: var(--good); transition: width .12s, background .2s; }
.hp .track.thin { height: 7px; border-width: 1.5px; }
.hp .parts { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.hp .parts .bad { color: #ffb020; }
.hp .parts .worse { color: #ff7a5c; }
.pedal {
  position: absolute; bottom: 12px;
  width: clamp(96px, 24%, 190px); height: clamp(64px, 24vh, 118px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .06em; text-transform: uppercase;
  color: #fff; background: rgba(15,10,7,.34); border: 3px solid rgba(255,255,255,.7); border-radius: 18px;
  text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
  transition: background .06s, transform .06s;
}
.pedal small { font-family: var(--body); font-weight: 600; font-size: 10px; letter-spacing: .14em; opacity: .85; }
.pedal.l { left: 12px; }
.pedal.r { right: 12px; }
.pedal.on { background: rgba(255,107,26,.75); transform: scale(.96); }
.pedal.l.on { background: rgba(240,69,47,.78); }
.upg { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); width: min(62%, 470px); max-height: 92%; overflow-y: auto; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; background: rgba(21,14,9,.93); border: 2px solid var(--accent, #ff6b1a); border-radius: 12px; padding: 10px 12px; z-index: 6; color: #fff; }
.upg[hidden], .garage[hidden] { display: none; }
.upg h3, .upg .done { grid-column: 1 / -1; }
.upg h3 { margin: 0 0 4px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #ffc43a; }
.upg .u { display: flex; align-items: center; gap: 6px; width: 100%; margin: 3px 0; padding: 6px 8px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; font: inherit; text-align: left; cursor: pointer; }
.upg .u b { flex: 1; font-size: 13px; } .upg .u small { display: block; font-weight: 400; opacity: .7; font-size: 11px; }
.upg .u i { font-style: normal; font-weight: 700; color: #8be26c; white-space: nowrap; }
.upg .u[disabled] { opacity: .45; cursor: default; } .upg .u[disabled] i { color: #bbb; }
.upg .done { width: 100%; margin-top: 4px; padding: 9px; border: 0; border-radius: 9px; background: #ff6b1a; color: #1a0f08; font: 700 14px inherit; cursor: pointer; }
.repair {
  position: absolute; right: 12px; bottom: calc(clamp(64px, 24vh, 118px) + 22px);
  min-height: 46px; padding: 0 16px;
  font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--plate); background: var(--good); border: 0; border-radius: 12px; cursor: pointer; touch-action: manipulation;
}
.repair[disabled] { background: rgba(15,10,7,.5); color: rgba(255,255,255,.45); cursor: default; }
.garage { right: auto; left: 12px; background: #ffc43a; }
.btn.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
.rigname { font: inherit; width: 100%; box-sizing: border-box; padding: 9px 10px; background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; }
.repair.urgent { animation: pulse .7s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.07); } }
.rot { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; display: none; }
@media (orientation: portrait) { .rot { display: block; } }
.overlay[hidden] { display: none; }
.overlay { overflow-y: auto; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box; background: rgba(15,10,7,.66); }
.card { margin: auto; box-sizing: border-box; width: min(100%, 440px); display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; background: var(--plate); border: 2px solid var(--accent); }
.card h1, .card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 60px; line-height: .9; letter-spacing: .01em; text-transform: uppercase; color: var(--ink); text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--accent); }
.card p { margin: 0; line-height: 1.4; color: var(--ink); }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.grid em { display: block; margin-top: 2px; font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--good); }
.grid .val { font-size: 40px; }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.btn {
  min-height: 52px; padding: 0 14px;
  font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink); background: transparent; border: 2px solid var(--ink); cursor: pointer; touch-action: manipulation;
}
.btn.primary { color: var(--plate); background: var(--accent); border-color: var(--accent); }
.btn.good { color: var(--plate); background: var(--good); border-color: var(--good); }
.vlink { align-self: center; font-size: 12px; letter-spacing: .06em; color: var(--ink-dim); text-decoration: underline; padding: 2px 6px; }
.keys { font-size: 12px; letter-spacing: .06em; color: var(--ink-dim); }
@media (max-height: 520px) {
  .val { font-size: 28px; }
  .card h1, .card h2 { font-size: 44px; }
  .grid .val { font-size: 32px; }
  .card { gap: 8px; padding: 14px; }
  .btn { min-height: 44px; font-size: 22px; }
  .hud { gap: 10px; }
  .stat + .stat { padding-left: 10px; }
}
@media (max-width: 640px) { .hud .hide-s { display: none; } }
</style>

<div class="app">
  <header class="hud">
    <div class="stat"><span class="lab">Distance</span><span class="val" id="dist">0<small>m</small></span><span class="sub" id="distSub">Best 0 m</span></div>
    <div class="stat"><span class="lab">Speed</span><span class="val" id="spd">0<small>mph</small></span><span class="sub" id="spdSub">Top 0</span></div>
    <div class="stat"><span class="lab">Time on road</span><span class="val" id="time">0:00</span><span class="sub" id="timeSub">Best 0:00</span></div>
    <div class="stat"><span class="lab">Longest jump</span><span class="val" id="jump">0<small>m</small></span><span class="sub" id="jumpSub">Best 0 m</span></div>
    <div class="stat cash"><span class="lab">Cash</span><span class="val" id="cash">$0</span><span class="sub" id="cashSub">&nbsp;</span></div>
    <div class="grow"></div>
    <button class="chip hide-s" id="snd" type="button" aria-pressed="false">Sound on</button>
    <button class="chip" id="end" type="button">End run</button>
  </header>
  <main class="stage" id="stage">
    <div class="court" id="court">
      <canvas id="cv" aria-label="Side-view Baja RC truck driving over rough desert terrain. Hold gas to accelerate and brake to slow down or reverse."></canvas>
      <div class="hp"><span class="lab"><span id="rigLab">Truck</span><span id="hpTxt">100%</span></span><div class="track"><i id="hpFill"></i></div>
        <span class="lab" style="margin-top:4px"><span>Engine temp</span><span id="tmpTxt">30%</span></span><div class="track thin"><i id="tmpFill"></i></div>
        <div class="parts"><span id="pSusp">Suspension 100%</span><span id="pRad">Radiator 100%</span></div></div>
      <div class="rot">Landscape plays best</div>
      <div class="pedal l" id="pBrake">Brake<small>Hold left</small></div>
      <div class="pedal r" id="pGas">Gas<small>Hold right</small></div>
      <button class="repair" id="repair" type="button" disabled>Repair</button>
      <button class="repair garage" id="garage" type="button" hidden>Upgrade</button>
      <div class="upg" id="upg" hidden></div>
      <div class="overlay" id="ov" hidden><div class="card" id="card"></div></div>
    </div>
  </main>
</div>

<script>
(function () {
'use strict';

/* ---------- Tuning (no DOM below this line until the game shell, so it can be tested headless) ---------- */
var PXM = 32;                       /* 32 px = 1 m. A 130 px truck is a 4 m truck. */
var MPH = 0.0699;                   /* px/s to mph at that scale */
var G = 1000, I_CH = 2600, STEP = 1 / 240, DX = 6, WR = 19, TAU = Math.PI * 2;
var SMAX = 46, SMIN = 5, KS = 40, CSC = 3.0, CSR = 4.2;     /* suspension travel, spring, compression and rebound damping */
var FMAX = 1200, VMAX = 950, FBR = 1300, FREV = 520, VREV = 300, MU = 1.6, DRAG = 0.00007;
var TAIR_G = 9000, TAIR_B = 7500;   /* in the air: gas tips the nose up, brake tips it down */
var PRICE = 2;                      /* dollars per point of repair */
var WH = [{ x: -46, y: -6 }, { x: 46, y: -6 }];             /* suspension attach points: rear, front */
var BODY = [{ x: 72, y: 4 }, { x: -72, y: 4 }, { x: 0, y: 10 }, { x: 34, y: 10 }, { x: -34, y: 10 }, { x: 68, y: -14 },
            { x: 16, y: -48 }, { x: -22, y: -48 }, { x: -2, y: -50 }, { x: -72, y: -20 }];
var NOIN = { gas: 0, brake: 0 };
var UPK = ['susp', 'wb', 'motor', 'rad', 'tire', 'exh'];
var UPMAX = 10, UPB = { susp: 120, wb: 100, motor: 150, rad: 90, tire: 110, exh: 80 }, UPC = {};
UPK.forEach(function (k) { UPC[k] = []; for (var i = 0; i < UPMAX; i++) UPC[k].push(Math.round(UPB[k] * (1 + .9 * i + .1 * i * i) / 5) * 5); });
var UPN = { susp: ['Suspension', 'softer landings, less wear'], wb: ['Wheelbase', 'steadier, tamer wheelies'], motor: ['Motor', 'power and top speed, runs hotter'],
            rad: ['Radiator', 'runs cooler, recovers faster'], tire: ['Tires', 'more grip, climbs better'], exh: ['Exhaust', 'new sound each level, a bit more power'] };
function copyUp(u) { var o = {}; UPK.forEach(function (k) { o[k] = Math.max(0, Math.min(UPMAX, +(u && u[k]) || 0)); }); return o; }
function applyUps(g) { WH[0].x = -46 - 7 * (g.up.wb * .5); WH[1].x = 46 + 7 * (g.up.wb * .5); }
var RIVAL_FIRST = 100;
var X_START = 200;
var BIOMES = [
  { n: 'Main Street', key: 'town', m: 0 }, { n: 'Gravel Flats', key: 'desert', m: 380 }, { n: 'Pine Forest', key: 'forest', m: 900 },
  { n: 'Dune Sea', key: 'dunes', m: 1700 }, { n: 'Mountain Pass', key: 'mount', m: 2500 }, { n: 'Red Canyon', key: 'canyon', m: 3400 }
];
var LOOPSEQ = [5, 2, 3, 4];
function biomeIdx(m) {
  if (m < 3400) { for (var i = BIOMES.length - 2; i >= 0; i--) if (m >= BIOMES[i].m) return i; return 0; }
  return LOOPSEQ[Math.floor((m - 3400) / 900) % 4];
}
var PD = {
  cone:   { h: 34, hw: 14, hard: 300, frag: [{ s: 'blob', r: 10, c: '#ff7a1c' }, { s: 'blob', r: 8, c: '#ffffff' }, { s: 'blob', r: 8, c: '#ff7a1c' }, { s: 'rect', w: 28, h: 6, c: '#1d1814' }] },
  barrier:{ h: 50, hw: 64, hard: 320, frag: [{ s: 'plank', w: 124, h: 18, c: '#f4efe6' }, { s: 'rect', w: 6, h: 32, c: '#6a625a' }, { s: 'rect', w: 6, h: 32, c: '#6a625a' }] },
  trash:  { h: 40, hw: 18, hard: 320, frag: [{ s: 'rect', w: 36, h: 8, c: '#7c8a8d' }, { s: 'rect', w: 14, h: 30, c: '#5d6b6e' }, { s: 'rect', w: 14, h: 30, c: '#5d6b6e' }, { s: 'blob', r: 7, c: '#e9e4d6' }, { s: 'blob', r: 6, c: '#a98c5a' }] },
  fence:  { h: 40, hw: 48, hard: 280, frag: [{ s: 'rect', w: 12, h: 34, c: '#f6f2ea' }, { s: 'rect', w: 12, h: 34, c: '#f6f2ea' }, { s: 'rect', w: 12, h: 34, c: '#f6f2ea' }, { s: 'rect', w: 12, h: 34, c: '#f6f2ea' }, { s: 'rect', w: 90, h: 6, c: '#e3ddd0' }] },
  bush:   { h: 34, hw: 32, hard: 420, frag: [{ s: 'blob', r: 14, c: '#5e8a46' }, { s: 'blob', r: 12, c: '#7fae5c' }, { s: 'blob', r: 12, c: '#4f7a3a' }, { s: 'blob', r: 10, c: '#6a9a4e' }, { s: 'blob', r: 9, c: '#3f6a30' }] },
  sapling:{ h: 92, hw: 24, hard: 360, frag: [{ s: 'rect', w: 12, h: 48, c: '#6b4a2e' }, { s: 'blob', r: 20, c: '#2f6a3c' }, { s: 'blob', r: 16, c: '#3a7a46' }, { s: 'blob', r: 13, c: '#2f6a3c' }] },
  logs:   { h: 42, hw: 48, hard: 340, frag: [{ s: 'rect', w: 70, h: 15, c: '#8a5a34' }, { s: 'rect', w: 64, h: 15, c: '#7a4d2a' }, { s: 'rect', w: 56, h: 14, c: '#94643a' }] },
  cactus: { h: 70, hw: 24, hard: 340, frag: [{ s: 'rect', w: 16, h: 40, c: '#4e8a48' }, { s: 'rect', w: 14, h: 26, c: '#5a9a52' }, { s: 'rect', w: 12, h: 22, c: '#4e8a48' }, { s: 'blob', r: 7, c: '#e8a0b0' }] },

  barrel: { h: 44, hw: 21, hard: 300, frag: [{ s: 'rect', w: 14, h: 40, c: '#c0392b' }, { s: 'rect', w: 14, h: 40, c: '#a93226' }, { s: 'rect', w: 36, h: 7, c: '#2b241e' }, { s: 'blob', r: 8, c: '#2b241e' }] },
  snowman:{ h: 92, hw: 24, hard: 240, frag: [{ s: 'blob', r: 24, c: '#f4f7fb' }, { s: 'blob', r: 18, c: '#eef2f8' }, { s: 'blob', r: 13, c: '#f4f7fb' }, { s: 'rect', w: 18, h: 5, c: '#ff8a2a' }, { s: 'rect', w: 36, h: 4, c: '#6b4a2e' }] },

function rng(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);

  var R = rng(seed), T = { X0: -800, ys: [], rock: [], n: 0, R: R, seq: ['wash0', 'roll0', 'kick0', 'roll0', 'hill0', 'wash0', 'kick0', 'roll0'], calm: false, last: '' };
  function rnd(a, b) { return a + (b - a) * R(); }

    flat: function () { return { len: 1600, f: function () { return 0; } }; },
    bighill: function (d) {
      var amp = rnd(260, 480) + d * 120, len = Math.max(rnd(1400, 2000), amp * 5.4);
      return { len: len, f: function (x) { return -amp * (.5 - .5 * Math.cos(TAU * x / len)); } };

    cliff: function (d) {
      /* a long climb to a lip, then a big drop with a steep landing slope that flattens out: lots of air time to line up the landing */

        c.fillRect(gx + 4 * k2, gy - 20 * k2, 11 * k2, 5 * k2); c.fillRect(gx + 10 * k2, gy - 32 * k2, 5 * k2, 17 * k2);
      } else { c.beginPath(); c.ellipse(gx, gy - 6 * k2, 18 * k2, 9 * k2, 0, Math.PI, TAU); c.fill(); }
    }
  }
  for (i = 0; i < parts.length; i++) {
    var q = parts[i];
    c.fillStyle = q.c + Math.max(0, q.life * .55) + ')';
    c.beginPath(); c.arc(q.x, q.y, q.s * (1.4 - q.life * .5), 0, TAU); c.fill();
  }
  for (i = 0; i < g.props.length; i++) { var pr = g.props[i]; if (pr.x > x0 - 60 && pr.x < x1 + 60) drawProp(c, pr); }
  if (g.rv && !g.rv.gone) { g.rv.hook = 0; g.rv.ph = 3; g.rv.t = 0; drawTow(c, g.rv, V, T); }
  if (g.tow) drawTow(c, g.tow, V, T);
  drawTruck(c, V, now);
  if (g.self) {
    var su = Math.min(1, g.self.t / SELF_T), ext = Math.min(1, su / .2, (1 - su) / .2), fx = V.x - 62, fy = groundAt(T, fx);
    var ex2 = V.x + (fx - V.x) * ext, ey2 = V.y + (fy - V.y) * ext;
    c.lineCap = 'round'; c.strokeStyle = '#14161a'; c.lineWidth = 9; c.beginPath(); c.moveTo(V.x, V.y); c.lineTo(ex2, ey2); c.stroke();
    c.strokeStyle = '#f2a912'; c.lineWidth = 5; c.beginPath(); c.moveTo(V.x, V.y); c.lineTo(ex2, ey2); c.stroke();
    c.fillStyle = '#14161a'; c.beginPath(); c.ellipse(ex2, ey2, 11, 5, 0, 0, TAU); c.fill();
  }
  /* damage popups follow the truck */
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (hurtFlash > 0) { c.fillStyle = 'rgba(240,69,47,' + hurtFlash * .28 + ')'; c.fillRect(0, 0, Wc, Hc); }
  if (p > .6) { c.fillStyle = 'rgba(10,6,30,' + (p - .6) * .35 + ')'; c.fillRect(0, 0, Wc, Hc); }

  /* callouts */
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  var y0 = Hc * .2 + 20 * dpr;
  for (i = 0; i < pops.length; i++) {
    var pp = pops[i]; if (pp.t < 0) continue;
    var a = Math.min(1, pp.t / .12, (2.2 - pp.t) / .6), sz = (pp.big ? 64 : 48) * dpr * (1 + Math.max(0, .2 - pp.t) * 1.5), yy2 = y0 + i * 58 * dpr - pp.t * 14 * dpr;
    c.globalAlpha = Math.max(0, a);
    c.font = '700 ' + sz + 'px ' + DISPLAY; c.lineWidth = 7 * dpr; c.strokeStyle = 'rgba(15,10,7,.9)'; c.strokeText(pp.text, Wc / 2, yy2); c.fillStyle = pp.c; c.fillText(pp.text, Wc / 2, yy2);
    c.font = '600 ' + 13 * dpr + 'px ' + BODYF; c.lineWidth = 4 * dpr; c.strokeText(pp.sub.toUpperCase(), Wc / 2, yy2 + sz * .55); c.fillStyle = '#fff'; c.fillText(pp.sub.toUpperCase(), Wc / 2, yy2 + sz * .55);
  }
  c.globalAlpha = 1;
  if (g.trick && st === 'play') {
    c.font = '700 ' + 34 * dpr + 'px ' + DISPLAY; c.lineWidth = 6 * dpr; c.strokeStyle = 'rgba(15,10,7,.9)';
    c.strokeText(g.trick.toUpperCase(), Wc / 2, Hc * .44); c.fillStyle = '#fff'; c.fillText(g.trick.toUpperCase(), Wc / 2, Hc * .44);
  }
  if (banner) {
    var ba = Math.min(1, banner.t / .3, (3 - banner.t) / .6);
    c.globalAlpha = Math.max(0, ba);
    c.font = '700 ' + 76 * dpr + 'px ' + DISPLAY; c.lineWidth = 9 * dpr; c.strokeStyle = 'rgba(15,10,7,.9)';
    c.strokeText(banner.text.toUpperCase(), Wc / 2, Hc * .34); c.fillStyle = '#fff'; c.fillText(banner.text.toUpperCase(), Wc / 2, Hc * .34);
    c.globalAlpha = 1;
  }
}

/* ---------- Loop ---------- */
function frame(now) {
  var dt = Math.min(.05, (now - last) / 1000 || 0);
  last = now;
  if (paused) dt = 0;
  var V = g.V, i;
  g.locked = st !== 'play';
  var input = st === 'play' ? inp() : NOIN;
  acc += dt;
  while (acc >= STEP) { gameStep(g, input, STEP); acc -= STEP; }
  drain();
  snapT += dt; if (snapT > 2) { snapT = 0; snapRun(); }

  /* wheel spin, antenna, camera */
  for (i = 0; i < 2; i++) wa[i] += V.wsp[i] * dt;
  var axl = dt > 0 ? (V.vx - lastVx) / dt : 0; lastVx = V.vx;
  ant.w += (-90 * ant.a - 7 * ant.w - .0022 * clamp(axl, -2500, 2500) * Math.cos(V.th) + (V.om * -.2)) * dt;
  ant.a = clamp(ant.a + ant.w * dt, -.9, .9);
  var spd = g.speed, h = groundAt(g.T, V.x) - V.y - 43;
  var zt = 1 - clamp((spd - 350) / 1400, 0, .22) - clamp((h - 120) / 700, 0, .2);
  cam.z += (zt - cam.z) * (1 - Math.exp(-2 * dt));
  var tx = V.x + clamp(V.vx * .28, -100, 300);
  cam.x += (tx - cam.x) * (1 - Math.exp(-7 * dt));
  cam.y += (V.y - 20 - cam.y) * (1 - Math.exp(-3.2 * dt));
  var sc = vs * cam.z, minY = V.y - (Hc * .78 - Hc * .58) / sc, maxY = V.y + (Hc * .58 - Hc * .3) / sc;
  cam.y = clamp(cam.y, minY + 20, maxY - 20) ;

  /* particles */
  for (i = 0; i < 2; i++) {
    if (V.c[i] && (Math.abs(V.wsp[i]) * WR > 180 || V.slip[i]) && Math.random() < dt * 60 * .5 && !reduce)
      parts.push({ x: V.cp[i].x, y: V.cp[i].y, vx: -V.vx * .2 + (Math.random() - .5) * 60, vy: -30 - Math.random() * 70, life: 1, d: 1.6, s: 3 + Math.random() * 4, c: 'rgba(226,190,140,' });
  }
  if (g.hp < 40 && st !== 'intro' && Math.random() < dt * (g.hp < 15 ? 50 : 24)) {
    var cs = Math.cos(V.th), sn = Math.sin(V.th);
    parts.push({ x: V.x + 50 * cs + 10 * sn, y: V.y + 50 * sn - 10 * cs, vx: -V.vx * .1 + (Math.random() - .5) * 30, vy: -60 - Math.random() * 50, life: 1, d: .9, s: 5 + Math.random() * 4, c: g.hp < 15 ? 'rgba(255,120,40,' : 'rgba(50,44,40,' });
  }
  if ((g.temp > .85 || g.hot) && st !== 'intro' && Math.random() < dt * 40) {
    var c2 = Math.cos(V.th), s2 = Math.sin(V.th);
    parts.push({ x: V.x + 56 * c2 + 12 * s2, y: V.y + 56 * s2 - 12 * c2, vx: -V.vx * .1 + (Math.random() - .5) * 40, vy: -90 - Math.random() * 60, life: 1, d: 1.1, s: 5 + Math.random() * 5, c: 'rgba(240,240,240,' });
  }
  for (i = parts.length - 1; i >= 0; i--) {
    var q = parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 80 * dt; q.vx *= 1 - 1.5 * dt; q.life -= dt / q.d;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 2.2) pops.splice(i, 1); }
  if (banner) { banner.t += dt; if (banner.t > 3) banner = null; }
  shake *= Math.exp(-6 * dt); hurtFlash = Math.max(0, hurtFlash - dt * 2);

  if (g.tow && g.tow.ph === 0) { var bp = Math.floor(g.tow.t * 3); if (bp !== towBeep) { towBeep = bp; sfx('beep'); } } else towBeep = -1;
  syncHud();
  engineSound();
  if (Wc > 10) drawScene(now);
  requestAnimationFrame(frame);
}

resize();
cam.x = g.V.x; cam.y = g.V.y;
showIntro();
requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
