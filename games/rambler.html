<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rambler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0f0c;--panel:rgba(14,22,18,.84);--edge:#d2b97a;--edge2:#5e6a48;--text:#f4ecd2;--mute:#a9b08c;--hot:#e8903c;--px:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:8px/1.5 var(--px);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#cw{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
canvas#c{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block;will-change:transform}
.px{background:var(--panel);border:2px solid var(--edge);box-shadow:0 0 0 2px #0b130e,inset 0 0 0 2px rgba(0,0,0,.35)}
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.bars{display:flex;flex-direction:column;gap:5px;flex:1;max-width:250px}
.bar{display:flex;align-items:center;gap:6px;padding:5px 6px;height:24px}
.bl{width:50px;color:var(--mute);font-size:7px}
.bt{flex:1;height:8px;background:#1b2a20;border:1px solid #000;position:relative;overflow:hidden}
.bt i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#f2d878,#e8903c)}
.bt i.lo{background:linear-gradient(#f08a6a,#c8402c)}
.bv{width:30px;text-align:right;font-size:7px}
.info{padding:6px 7px;font-size:7px;line-height:1.7;color:var(--text)}
.info b{font-weight:400;color:#f2d878}
.hb{display:flex;gap:6px;pointer-events:auto}
.ib{font:7px var(--px);color:var(--text);background:var(--panel);border:2px solid var(--edge);padding:8px 7px;cursor:pointer;box-shadow:0 0 0 2px #0b130e}
.ib:active{transform:translateY(2px)}
#hint{position:absolute;left:0;right:0;text-align:center;font-size:8px;line-height:1.7;color:#fff2c4;text-shadow:1px 1px 0 #000,-1px 1px 0 #000;padding:0 18px;pointer-events:none;opacity:0;transition:opacity .6s}
#hint.on{opacity:1}
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);max-width:88%;padding:8px 10px;font-size:8px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;line-height:1.7}
#toast.on{opacity:1}
#lm{position:absolute;left:50%;top:calc(140px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(92%,420px);padding:10px 12px;text-align:center;opacity:0;transition:opacity 1s;pointer-events:none}
#lm.on{opacity:1}
#lm h3{margin:0 0 6px;font-size:10px;font-weight:400;color:#f2d878;line-height:1.5}
#lm p{margin:0;font-size:7px;line-height:1.9;color:var(--text)}
#tray{position:absolute;left:0;right:0;bottom:0;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(8,14,10,0),rgba(8,14,10,.88) 22%);display:flex;flex-direction:column;gap:6px}
#pack{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
#pack::-webkit-scrollbar{display:none}
.cell{position:relative;flex:none;width:50px;height:46px;background:var(--panel);border:2px solid var(--edge2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.cell canvas{image-rendering:pixelated;pointer-events:none}
.cell .lb{font-size:5px;color:var(--mute);pointer-events:none;letter-spacing:.3px}
.cell .n{position:absolute;right:3px;top:3px;font-size:7px;color:var(--text);pointer-events:none}
.cell.dim{opacity:.4}
.cell.eat{border-color:var(--edge)}
#ctl{display:flex;gap:6px;align-items:stretch}
#walk,#acts{display:flex;gap:6px}
#mid{flex:1;min-width:0;display:flex}
.ctl{font:8px var(--px);color:var(--text);background:var(--panel);border:2px solid var(--edge2);padding:0 8px;height:46px;cursor:pointer;touch-action:none}
.ctl:active,.ctl.on{transform:translateY(2px);border-color:var(--edge)}
.ctl.big{width:58px;font-size:12px}
.ctl.wide{flex:1;color:#2a1c08;background:linear-gradient(#f2d878,#e0903a);border:2px solid #fff0c4;box-shadow:0 3px 0 #7a4818;font-size:8px;line-height:1.5}
.ctl.wide.off{opacity:.35;filter:grayscale(.6)}
.ctl.on{background:#3a4a2a}
.ctl[disabled]{opacity:.35}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,8,.74);padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{width:100%;max-width:400px;padding:18px 16px;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:22px;line-height:1.2;color:#f2d878;text-shadow:3px 3px 0 #6a4a1c}
.card h2{margin:0 0 10px;font-size:11px;line-height:1.5;color:#f2d878}
.card .sub{font-size:7px;color:var(--mute);margin:0 0 14px;line-height:1.8}
.card p{font-size:8px;line-height:1.9;margin:0 0 12px}
.pl{display:flex;gap:10px;align-items:center;width:100%;padding:8px;margin:0 0 8px;text-align:left;font:8px/1.6 var(--px);color:var(--text);background:#17261c;border:2px solid var(--edge2);cursor:pointer}
.pl:active{transform:translateY(2px)}
.pl canvas{width:46px;height:46px;flex:none;border:2px solid #000;image-rendering:pixelated}
.pl b{display:block;font-weight:400;font-size:9px;color:#f2d878;margin-bottom:3px}
.pl span{font-size:7px;color:var(--mute);line-height:1.6}
.btn{font:9px var(--px);color:#2a1c08;background:linear-gradient(#f2d878,#e0903a);border:2px solid #fff0c4;padding:11px 12px;cursor:pointer;box-shadow:0 3px 0 #7a4818;width:100%;margin:0 0 8px}
.btn.sec{color:var(--text);background:#17261c;border-color:var(--edge2);box-shadow:0 3px 0 #060a07}
.btn:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:7px}
.row label{width:84px;color:var(--mute);flex:none}
.row input[type=range]{flex:1;accent-color:#e8903c;height:22px;min-width:0}
.row .v{width:28px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:7px;color:var(--mute)}
.chk input{width:18px;height:18px;accent-color:#e8903c}
.stat{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:2px solid #1f3024;font-size:8px}
.stat span:first-child{color:var(--mute)}
.lmi{font-size:7px;line-height:1.8;padding:6px 0;border-bottom:2px solid #1f3024}
.lmi b{font-weight:400;color:#f2d878}
@media (orientation:landscape) and (min-aspect-ratio:23/20){
 #tray{flex-direction:row;align-items:flex-end;gap:10px}
 #pack{flex:1;min-width:0}
 #ctl{flex:none;width:58%}
 .cell{height:42px}.ctl{height:42px}
 .card{max-width:440px}
 #toast{top:96px}
}
.jw #hud,.jw #tray,.jw #toast,.jw #hint,.jw #lm{display:none!important}
#jwbar{flex-wrap:wrap;position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92%,380px);padding:10px 12px;display:none;align-items:center;gap:10px;font-size:7px}
#jwbar.on{display:flex}
#jwbar .jr{display:flex;gap:8px;width:100%}
#jwbar .jr .ib{flex:1;min-width:0}
#jwbar select.ib{appearance:none;text-align:center}
#jwbar input{flex:1;accent-color:#e8903c;min-width:0}
#jwbar b{font-weight:400;width:48px;text-align:right;color:#f2d878}
@media (prefers-reduced-motion:reduce){#hint,#toast,#lm{transition:none}}
</style></head>

  var a=h2(ix,iy,s),b=h2(ix+1,iy,s),c=h2(ix,iy+1,s),d=h2(ix+1,iy+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

};
var BKEYS=['h0','amp','rel','cross','crossN','steep','coast','shoreW','heath','gorse','rock','flow','litter','sand','pw','pH','pF'];
BIO.hills.pH=1;BIO.fells.pF=1;

/* ================= trails ================= */
var TRAILS={
 ridgeway:{name:'THE RIDGEWAY',desc:'Ancient chalk road and earthworks. Britain\'s oldest way.',miles:87,seed:11,wt:{hills:4,grass:3,forest:2,scrub:1},start:'Overton Hill',end:'Ivinghoe Beacon',thumb:'downs',st0:'hills',
  lm:[{n:'AVEBURY',t:'stones',b:'grass',tx:'The largest stone circle in Britain.'},

      {n:'IVINGHOE BEACON',t:'beacon',b:'hills',tx:'The end of the Ridgeway, on a high chalk spur.'}]},
 coast:{name:'COAST PATH',desc:'Cornish cliffs, coves and sandy beaches.',miles:70,seed:23,wt:{cliffs:4,beach:3,scrub:2,grass:1},start:'Marazion',end:'Tintagel',thumb:'coast',st0:'cliffs',
  lm:[{n:'ST MICHAEL\'S MOUNT',t:'island',b:'beach',tx:'A tidal island crowned with a castle.'},
      {n:'MINACK THEATRE',t:'theatre',b:'cliffs',tx:'An open-air theatre carved into the cliff.'},

 pilgrims:{name:'PILGRIMS\' WAY',desc:'Old chalk roads and orchards towards Canterbury.',miles:70,seed:53,wt:{grass:4,forest:4,hills:2,scrub:1},start:'Winchester',end:'Canterbury',thumb:'lane',st0:'grass',

};

};

/* ================= trail building ================= */
var T=null,TKEY='',segs=[],waters=[],lms=[],stops=[],TL=0,TSEED=0;
function wpickR(r,wt){var s=0,k;for(k in wt)s+=wt[k];var x=r()*s;for(k in wt){x-=wt[k];if(x<=0)return k;}return Object.keys(wt)[0];}
var RING=['grass','forest','scrub','hills','fells','cliffs','beach'];
var SEGLEN=WALK*900; /* about 15 minutes of walking at 1X */
var FORKUP={grass:['hills','scrub','hills'],forest:['hills','scrub'],scrub:['hills','fells'],hills:['fells','fells','hills'],fells:['fells','cliffs'],cliffs:['hills','fells'],beach:['cliffs','grass']};
var FORKDN={grass:['forest','beach'],forest:['grass','beach'],scrub:['forest','grass'],hills:['grass','scrub','forest'],fells:['hills','scrub'],cliffs:['beach','beach','grass'],beach:['beach','grass']};
/* the upper path always climbs (or stays high); the lower path always drops (or stays low) */
function forkOpts(j){var sg=segs[j],a=FORKUP[sg.b],b=FORKDN[sg.b];return [a[(h2(j*7+TSEED,sg.x0|0,31)*a.length)|0],b[(h2(j*5+TSEED,sg.x0|0,32)*b.length)|0]];}
var FORKD=1500;
function mkSeg(x0,x1,b){return {x0:x0,x1:x1,b:b,fx:x1-FORKD};}
function nextRing(b){return RING[(RING.indexOf(b)+1)%RING.length];}

  while(cur<TL+6000){
    bb=nextRing(bb);
    var len=Math.round(SEGLEN*(.92+r()*.16));

  }

/* landmarks go in a matching terrain, nearest to their place along the trail */
function placeLms(from,r){
  var n=T.lm.length,i,j,keep={},usedSeg={},res=[];
  for(i=0;i<lms.length;i++)if(lms[i].x<from){keep[lms[i].id]=lms[i];usedSeg[segIdx(lms[i].x)]=1;}
  for(i=0;i<n;i++){
    var id='lm'+i;if(keep[id]){res.push(keep[id]);continue;}
    var want=TL*(i+1)/(n+1),lm=T.lm[i],bi=-1,bd=1e12;
    for(j=0;j<segs.length;j++){
      var sg=segs[j],cx=(sg.x0+sg.x1)/2;
      if(sg.b!==lm.b||cx<Math.max(2500,from+300)||cx>TL-2000)continue;
      var dd=Math.abs(cx-want)+(usedSeg[j]?1e6:0);
      if(dd<bd){bd=dd;bi=j;}

  /* camera */

  if(!G.demo&&!G.done){

      }else if(G.x>fs.fx-260){hint('THE PATH SPLITS AHEAD. YOU WILL CHOOSE WHICH WAY TO GO.','forkh',40);}

    }

  /* landmarks */
  for(i=0;i<lms.length;i++){var lm=lms[i];if(!G.disc[lm.id]&&Math.abs(lm.x-G.x)<70){G.disc[lm.id]=Math.floor(G.t);showLandmark(lm);G.energy=Math.min(100,G.energy+6);sfx('chime');}}

  if(G.x>=TL&&!G.done&&!G.demo){if(G.just)jwRestart();else finishTrail();}
  if(G.demo){G.energy=100;G.dir=1;G.state='walk';G.fdir=1;if(G.x>20000)G.x=2500;}

      if(open||bd==='cliffs'){if(!dusk)wl.push(['lark',2.2]);}
      if(bd==='grass'||bd==='forest'||bd==='hills'||bd==='fells')wl.push(['caw',1]);
      if(bd==='fells'||bd==='hills'||bd==='scrub')wl.push(['curlew',bd==='fells'?3:1.2]);
      if(coast)wl.push(['gull',bd==='beach'?4:2.5]);
      if(!wl.length)wl.push(['chirp',1]);
    }else{
      if(bd!=='beach'&&bd!=='cliffs')wl.push(['owl',2.4],['owlk',1]);
      else wl.push(['gull',.4]);
    }
    var sp=pickW(wl);BIRD[sp](.7+Math.random()*.5);
  }
  aniT-=dt;
  if(aniT<=0&&G.just&&JW.hide)aniT=10;
  if(aniT<=0){
    aniT=10+Math.random()*18;
    if(!dry&&Math.random()<.6)return;
    var c0=Math.floor((G.x-170)/CH),c1=Math.floor((G.x+170)/CH),ci,i,cand=[];
    for(ci=c0;ci<=c1;ci++){
      var ch=chunks.get(ci);if(!ch)continue;
      for(i=0;i<ch.ans.length;i++){
        var a=ch.ans[i],dd=Math.abs(a.x-G.x);if(dd>170||a.st==='flee'||!ANV[a.k])continue;
        var w=1-dd/170,k=a.k;
        if(k==='fox'){if(day&&!dawn&&!dusk)continue;w*=2;}
        else if(k==='deer'){if(!(dawn||dusk||!day))continue;w*=.8;}
        else if(k==='sheep'||k==='lamb'||k==='cow'||k==='goat'||k==='pony'||k==='pheasant'||k==='grouse'||k==='duck'){if(!day)w*=.15;}
        if(k==='pony')w*=.4;
        cand.push([a,w*w+.02]);
      }
    }
    if(cand.length){
      var s2=0;for(i=0;i<cand.length;i++)s2+=cand[i][1];var r2=Math.random()*s2,pick=cand[0][0];
      for(i=0;i<cand.length;i++){r2-=cand[i][1];if(r2<=0){pick=cand[i][0];break;}}
      var vol=clamp(1.1-Math.abs(pick.x-G.x)/170,.15,1);
      ANV[pick.k](vol);
      if((pick.k==='sheep'||pick.k==='cow')&&Math.random()<.15)setTimeout(function(){var o=cand[(Math.random()*cand.length)|0][0];if(ANV[o.k]&&(o.k==='sheep'||o.k==='cow'))ANV[o.k](.5);},500+Math.random()*900);
    }
  }
}
var stepLast=0,birdT=0,crkT=0,fireT=0;
function audioTick(dt){
  if(!AC||!G)return;
  var dayv=1-dark,alt=clamp((G.z-30)/110,0,1);
  if((G.state==='walk'||G.state==='goto')&&G.speed<=2){var fs=G.frame;if(fs!==stepLast&&(fs&1)===0){stepLast=fs;burst(.05,G.surf?420:G.wade?600:(G.z>SNOW?1400:900),.05);}else stepLast=fs;}
  wildlife(dt,dayv);
  crkT-=dt;if(crkT<=0){crkT=.18;if(dark>.6&&WX.rain<.3&&G.speed<=2){tone(4200,.05,'sine',.012);}}
  fireT-=dt;if(fireT<=0){fireT=.25+Math.random()*.5;if(nearFire())burst(.04,2800,.12);}
}
/* ---- loop & boot ---- */
var lastT=0,acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=(ts-lastT)/1000;lastT=ts;if(dt>.25)dt=.25;if(dt<=0)return;
  acc+=dt;if(acc<.028)return;var step=acc;acc=0;
  if(!G)return;
  TIMEV+=step;CLX+=step*(.5+WX.wind)*(G.just?clamp(G.speed*2,.1,1):1);wtick=Math.floor(TIMEV*2.4);
  if(!paused||(G.demo&&!ovOpen)||G.demo){update(step);}
  if(G.demo){}
  audioTick(step);
  if(G.just&&JW.cycle&&!ovOpen){
    cycT+=step;
    if(cycT>CYC_SECS&&!cycBusy){
      cycBusy=true;var cw=$('cw');cw.style.transition='opacity .9s';cw.style.opacity=0;
      setTimeout(function(){
        if(G&&G.just&&JW.cycle){var k=G.key,cur=bpAt(Math.floor(G.x)).dom,nx=RING[(RING.indexOf(cur)+1)%RING.length],hh=Math.floor(hourNow()),s0=G.s0,sp=G.speed;newGame(k,null,nx,hh,s0);G.speed=sp;jwPaintBar();}
        cycT=0;cycBusy=false;setTimeout(function(){cw.style.opacity=1;},150);
      },950);
    }
  }else if(!cycBusy)cycT=0;
  if(toastT>0){toastT-=step;if(toastT<=0)$('toast').classList.remove('on');}
  if(jwT>0&&!jwHov){jwT-=step;if(jwT<=0)$('jwbar').classList.remove('on');}
  if(lmT>0){lmT-=step;if(lmT<=0)$('lm').classList.remove('on');}
  uiT-=step;if(uiT<=0){uiT=.3;refreshHUD();refreshCtl();}
  renderFrame();
}

  window.addEventListener('pagehide',snapshot);
}
