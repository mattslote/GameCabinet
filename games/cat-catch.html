  let catImg = null;
  // flatten the photo into a cel-shaded look: small, punchy contrast, 7 tone steps
  function stylize(im) {
    const S = 96, c = document.createElement('canvas'); c.width = c.height = S;

    const zf = clamp01((1.4 - b.sc) / 0.65);
    return 1 + Math.round(5 * (0.35 * hf + 0.35 * sf + 0.3 * zf));
  }
  function finish() {
    state = 'over'; overAt = performance.now(); cat.charging = false;
    newTime = !bestTime || runT < bestTime; if (newTime) bestTime = runT;
    newStreak = maxStreak > bestStreak; if (newStreak) bestStreak = maxStreak;
    try { localStorage.setItem('catCatchBestTime', bestTime); localStorage.setItem('catCatchBestStreak', bestStreak); } catch (e) {}
    beep(523, 0.15, 'square', 0.08); setTimeout(() => beep(784, 0.25, 'square', 0.08), 150);
  }
  const cat = { h: 0, vy: 0, air: false, charging: false, charge: 0 };
  let birds = [], parts = [], pops = [], spawnT = 0, caught = 0;
  const stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * 320, r: Math.random() * 1.4 + .3, p: Math.random() * 6 }));

  function reset() {
    score = 0; runT = 0; runStarted = false; maxStreak = 0; escaped = 0; combo = 0; caught = 0; birds = []; parts = []; pops = []; spawnT = 0.8; t = 0;
    cat.h = 0; cat.vy = 0; cat.air = false; cat.charging = false; cat.charge = 0;
  }
  function peakFor(c) { const v = VMIN + (VMAX - VMIN) * c; return v * v / (2 * G); }

  // bird kinds: size, speed multiplier, flap rate, vertical motion
  const KINDS = {
    sparrow: { sc: 0.75, mult: 1.35, rate: 24, wave: 0,  swoop: 0 },
    finch:   { sc: 0.95, mult: 1.0,  rate: 15, wave: 28, swoop: 0 },
    pigeon:  { sc: 1.4,  mult: 0.72, rate: 9,  wave: 10, swoop: 0 },
    swallow: { sc: 0.85, mult: 1.2,  rate: 19, wave: 0,  swoop: 130 },
    golden:  { sc: 0.85, mult: 1.55, rate: 22, wave: 20, swoop: 60 }
  };
  function spawn(xOff = 0) {
    const d = Math.min(score / GOAL, 1);
    let kind;
    const r = Math.random();
    if (r < 0.07) kind = 'golden';
    else if (r < 0.30) kind = 'sparrow';
    else if (r < 0.52) kind = 'pigeon';
    else if (r < 0.52 + 0.14 + d * 0.14) kind = 'swallow';
    else kind = 'finch';
    const K = KINDS[kind];
    const hue = [20, 200, 340, 50, 280, 160][Math.floor(Math.random() * 6)];
    const y = 70 + Math.random() * (MAXY - 70 - K.wave - K.swoop * 0.5);
    birds.push({
      x: W + 40 + xOff, y0: y, y, hue, kind, sc: K.sc,
      sp: (240 + d * 260 + Math.random() * 90) * K.mult,
      wave: K.wave * (0.6 + Math.random() * 0.8), swoop: K.swoop * (Math.random() < 0.5 ? 1 : -1),
      rate: K.rate * (0.9 + Math.random() * 0.2),
      ph: Math.random() * 6, flap: Math.random() * 6, golden: kind === 'golden'
    });
  }
  function burst(x, y, hue) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * 6.28, s = 80 + Math.random() * 220;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.7 + Math.random() * 0.4, hue, rot: Math.random() * 6 });
    }
  }

  // ---------- input ----------
  function down() {
    beep(1, 0.001, 'sine', 0.001);
    if (state === 'title') { reset(); state = 'play'; return; }
    if (state === 'over') { if (performance.now() - overAt > 600) { reset(); state = 'play'; } return; }
    if (state === 'play' && !cat.air) { cat.charging = true; cat.charge = 0; }
  }
  function up() {
    if (state === 'play' && cat.charging) {
      cat.charging = false;
      cat.vy = VMIN + (VMAX - VMIN) * Math.max(cat.charge, 0.04);
      cat.air = true; cat.charge = 0;
      beep(300, 0.18, 'triangle', 0.1, 260);
    }
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) down(); } });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') up(); });

  // ---------- update ----------
  function update(dt) {
    t += dt;
    photoBtn.classList.toggle('show', state === 'title');
    if (state !== 'play') { if (state === 'title') { for (const b of birds) b.x -= b.sp * dt; } return; }

    if (runStarted) runT += dt;
    if (cat.charging) cat.charge = Math.min(1, cat.charge + dt / CHARGE_T);
    if (cat.air) {
      cat.vy -= G * dt; cat.h += cat.vy * dt;
      if (cat.h <= 0) { cat.h = 0; cat.vy = 0; cat.air = false; }
    }

    spawnT -= dt;
    if (spawnT <= 0) {
      const d = Math.min(score / GOAL, 1);
      runStarted = true;
      spawn();
      if (Math.random() < 0.12 + d * 0.28) spawn(110 + Math.random() * 90);   // flock of two
      if (d > 0.5 && Math.random() < 0.15) spawn(240 + Math.random() * 90);
      spawnT = 1.5 - d * 0.75 + Math.random() * 0.5;
    }

    const cy = GROUND - CAT_R - cat.h - (cat.charging ? 0 : 0);
    for (const b of birds) {
      b.x -= b.sp * dt; b.flap += dt * b.rate;
      let yy = b.y0 + (b.wave ? Math.sin(t * 3 + b.ph) * b.wave : 0);
      if (b.swoop) yy += Math.sin(Math.max(0, W - b.x) / W * Math.PI * 1.4) * b.swoop;
      b.y = Math.max(40, Math.min(MAXY, yy));
      if (!b.dead && Math.hypot(b.x - CAT_X, b.y - cy) < CAT_R + 14 * b.sc + 4) {
        b.dead = true; caught++; combo++; maxStreak = Math.max(maxStreak, combo);
        const pts = pointsFor(b); score += pts;
        pops.push({ x: b.x, y: b.y, txt: '+' + pts + (combo >= 3 ? ' 🔥' : ''), life: 0.9, big: pts >= 5 });
        burst(b.x, b.y, b.golden ? 48 : b.hue);
        beep(660 + Math.min(combo, 8) * 60, 0.14, 'square', 0.08, 200);
      } else if (!b.dead && b.x < -40) {
        b.dead = true; escaped++; combo = 0;
        beep(180, 0.2, 'sawtooth', 0.04, -100);
      }
    }
    birds = birds.filter(b => !b.dead);
    if (score >= GOAL && state === 'play') finish();
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; p.rot += dt * 8; }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops) { p.y -= 40 * dt; p.life -= dt; }
    pops = pops.filter(p => p.life > 0);
  }
  // title: ambient birds
  let titleSpawn = 0;
  function titleBirds(dt) {
    if (state !== 'title') return;
    titleSpawn -= dt;
    if (titleSpawn <= 0) { spawn(); titleSpawn = 1.2; }
    for (const b of birds) { b.x -= b.sp * dt; b.flap += dt * b.rate; b.y = b.y0 + Math.sin(t * 3 + b.ph) * 8; }
    birds = birds.filter(b => b.x > -60);
  }

  // ---------- draw ----------
  function wing(color, a, side) {
    ctx.save(); ctx.translate(3, -4); ctx.rotate(0.75 + a * 1.65 + (side < 0 ? 0.15 : 0));
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.quadraticCurveTo(-16, -26, 4, -40); ctx.quadraticCurveTo(12, -18, 11, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function bird(b) {
    ctx.save(); ctx.translate(b.x, b.y + Math.sin(b.flap) * -2.5); ctx.scale(b.sc, b.sc);
    const a = Math.sin(b.flap);
    const col = b.golden ? '#ffd23f' : `hsl(${b.hue},70%,60%)`;
    const dark = b.golden ? '#d9a300' : `hsl(${b.hue},60%,40%)`;
    if (b.golden) { ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 18; }
    ctx.rotate(-a * 0.05);
    wing(dark, a, -1);                                                              // far wing
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(14, -2); ctx.lineTo(34, -7 + a * 2); ctx.lineTo(34, 7 + a * 2); ctx.lineTo(14, 4); ctx.fill(); // tail
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 11, 0, 0, 6.3); ctx.fill();               // body
    ctx.fillStyle = b.golden ? '#fff1a8' : `hsl(${b.hue},70%,85%)`;
    ctx.beginPath(); ctx.ellipse(-4, 4, 11, 6, 0, 0, 6.3); ctx.fill();               // belly
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(-15, -5, 8.5, 0, 6.3); ctx.fill();                      // head
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.moveTo(-22, -7); ctx.lineTo(-31, -3.5); ctx.lineTo(-22, -2); ctx.fill(); // beak
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-17.5, -7, 3, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-18.3, -7, 1.7, 0, 6.3); ctx.fill();
    wing(col, a, 1);                                                                // near wing
    ctx.restore();
  }

  function drawCat() {
    const cy = GROUND - CAT_R - cat.h;
    const squash = cat.charging ? 1 - cat.charge * 0.28 : (cat.air ? 1 + Math.min(Math.abs(cat.vy) / 3000, .15) : 1);
    ctx.save();
    ctx.translate(CAT_X, GROUND - (cat.h));       // feet anchor
    ctx.scale(1 / squash * (cat.charging ? 1.08 : 1), squash);
    ctx.translate(0, -CAT_R);
    // tail
    ctx.strokeStyle = '#17151c'; ctx.lineWidth = 11; ctx.lineCap = 'round';
    const sw = Math.sin(t * 4) * 8 + (cat.air ? -14 : 0);
    ctx.beginPath(); ctx.moveTo(-26, 16); ctx.quadraticCurveTo(-62, 10 + sw, -58, -30 + sw); ctx.stroke();
    // body
    ctx.fillStyle = '#17151c';
    ctx.beginPath(); ctx.ellipse(0, 18, 30, 24, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#f4f0ea';
    ctx.beginPath(); ctx.ellipse(8, 22, 15, 20, 0, 0, 6.3); ctx.fill(); // white chest
    // paws
    ctx.fillStyle = '#f2ece4';
    const reach = cat.air ? -10 : 0;
    ctx.beginPath(); ctx.ellipse(14, 38 + reach * .2, 10, 6, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-8, 38, 10, 6, 0, 0, 6.3); ctx.fill();
    if (cat.air) { ctx.beginPath(); ctx.ellipse(30, -4, 9, 7, .3, 0, 6.3); ctx.fill(); } // reaching paw
    // head
    if (catImg) {
      // photo face in the same head shape, ears and outline as the drawn cat
      ctx.save(); ctx.translate(10, 0);
      ctx.fillStyle = '#17151c';
      ctx.beginPath(); ctx.moveTo(-26, -12); ctx.lineTo(-23, -48); ctx.lineTo(-3, -28); ctx.fill();
      ctx.beginPath(); ctx.moveTo(26, -12); ctx.lineTo(23, -48); ctx.lineTo(3, -28); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, -8, 30, 26, 0, 0, 6.3); ctx.clip();
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(catImg, -33, -41, 66, 66); ctx.restore();
      ctx.strokeStyle = '#17151c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, -8, 30, 26, 0, 0, 6.3); ctx.stroke();
      ctx.restore();
    } else {
      // tuxedo cat, head turned toward the birds (right)
      ctx.save(); ctx.translate(10, 0);
      ctx.fillStyle = '#17151c';
      ctx.beginPath(); ctx.moveTo(-25, -12); ctx.lineTo(-22, -46); ctx.lineTo(-4, -28); ctx.fill();
      ctx.beginPath(); ctx.moveTo(25, -12); ctx.lineTo(22, -46); ctx.lineTo(4, -28); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -8, 29, 25, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#f4f0ea';
      ctx.beginPath(); ctx.moveTo(0, -32); ctx.quadraticCurveTo(7, -20, 8, -6); ctx.lineTo(-8, -6); ctx.quadraticCurveTo(-7, -20, 0, -32); ctx.fill(); // blaze
      ctx.beginPath(); ctx.ellipse(-8, 4, 11, 10, 0, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, 4, 11, 10, 0, 0, 6.3); ctx.fill();   // muzzle
      ctx.beginPath(); ctx.ellipse(0, 12, 12, 8, 0, 0, 6.3); ctx.fill();   // chin
      ctx.fillStyle = '#17151c'; ctx.beginPath(); ctx.ellipse(-1, 14, 6, 2.2, 0, 0, 6.3); ctx.fill(); // chin mustache
      const bl = (Math.sin(t * 0.9) > .96) ? 0.6 : 7;
      ctx.fillStyle = '#e0b84a';
      ctx.beginPath(); ctx.ellipse(-12, -10, 7, bl, 0, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, -10, 7, bl, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#050505';
      ctx.beginPath(); ctx.ellipse(-9, -10, 4.2, Math.min(bl, 6), 0, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15, -10, 4.2, Math.min(bl, 6), 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#f0a0a8'; ctx.beginPath(); ctx.moveTo(-3.5, 0); ctx.lineTo(3.5, 0); ctx.lineTo(0, 4.5); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
      for (const s of [-1, 1]) for (const k of [-4, 0, 4]) {
        ctx.beginPath(); ctx.moveTo(s * 10, 4 + k * .4); ctx.lineTo(s * (s > 0 ? 40 : 26), 2 + k * 1.6 - (s > 0 ? 3 : 0)); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.setTransform(cv._dpr, 0, 0, cv._dpr, 0, 0);
    ctx.fillStyle = '#120f1f'; ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.translate(offX, offY); ctx.scale(scale, scale);
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    // sky
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#1b1640'); g.addColorStop(.6, '#5a3a78'); g.addColorStop(1, '#e8845f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { ctx.globalAlpha = .4 + .4 * Math.sin(t * 2 + s.p); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.3); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(W * 0.8, 110, 40, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#2a1d45'; ctx.beginPath(); ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 30) ctx.lineTo(x, GROUND - 40 - Math.sin(x * .011) * 26 - Math.sin(x * .031) * 8);
    ctx.lineTo(W, GROUND); ctx.fill();
    // ground + fence post for the cat
    ctx.fillStyle = '#1a1230'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#2d2250'; ctx.fillRect(0, GROUND, W, 4);

    // jump aim line
    if (state === 'play' && cat.charging) {
      const ph = peakFor(Math.max(cat.charge, 0.04));
      const y = GROUND - CAT_R - ph;
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(CAT_X + 40, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
    }

    for (const b of birds) bird(b);
    drawCat();
    for (const p of parts) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = `hsl(${p.hue},75%,65%)`; ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0, 0, 6.3); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.font = 'bold 22px -apple-system,system-ui,sans-serif'; ctx.textAlign = 'center';
    for (const p of pops) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = '#fff'; ctx.fillText(p.txt, p.x, p.y); }
    ctx.globalAlpha = 1;

    // charge meter
    if (state === 'play') {
      const mx = 28, my = GROUND - 150, mh = 140;
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(mx, my, 12, mh);
      const c = cat.charging ? cat.charge : 0;
      ctx.fillStyle = `hsl(${120 - c * 120},80%,55%)`; ctx.fillRect(mx, my + mh * (1 - c), 12, mh * c);
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.strokeRect(mx, my, 12, mh);
    }

    // HUD
    if (state !== 'title') {
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 30px -apple-system,system-ui,sans-serif';
      ctx.fillText(score + ' / ' + GOAL, 22, 44);
      ctx.font = '14px -apple-system,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.fillText('STREAK ' + combo + '  ·  BEST ' + Math.max(bestStreak, maxStreak), 22, 66);
      ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 30px -apple-system,system-ui,sans-serif';
      ctx.fillText(fmt(runT), W - 22, 44);
      if (bestTime) { ctx.font = '14px -apple-system,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText('BEST ' + fmt(bestTime), W - 22, 66); }
    }

    if (state === 'title') {
      ctx.save(); ctx.translate(0, (H - 420) / 2);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.font = 'bold 64px -apple-system,system-ui,sans-serif'; ctx.fillText('Cat Catch', W / 2, 140);
      ctx.font = '20px -apple-system,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.88)';
      ctx.fillText('Hold to charge. Release to jump. Catch the birds.', W / 2, 190);
      ctx.fillText('Score ' + GOAL + ' points as fast as you can. Higher, faster, smaller birds are worth more (up to 6).', W / 2, 220);
      ctx.globalAlpha = .6 + .4 * Math.sin(t * 4); ctx.font = 'bold 24px -apple-system,system-ui,sans-serif';
      ctx.fillText('Tap to start', W / 2, 275); ctx.globalAlpha = 1;
      if (bestTime) { ctx.font = '16px -apple-system,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText('Best time ' + fmt(bestTime) + '  ·  Best streak ' + bestStreak, W / 2, 305); }
      ctx.restore();
    }
    if (state === 'over') {
      ctx.fillStyle = 'rgba(10,6,25,.62)'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(0, (H - 420) / 2);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.font = 'bold 52px -apple-system,system-ui,sans-serif'; ctx.fillText(GOAL + ' points!', W / 2, 130);
      ctx.font = 'bold 40px -apple-system,system-ui,sans-serif'; ctx.fillText(fmt(runT) + (newTime ? '  🏆' : ''), W / 2, 190);
      ctx.font = '20px -apple-system,system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText((newTime ? 'New best time!' : 'Best time ' + fmt(bestTime)) + '   ·   Streak ' + maxStreak + (newStreak ? ' (new best!)' : '  (best ' + bestStreak + ')'), W / 2, 230);
      ctx.fillText(caught + ' birds caught  ·  ' + escaped + ' got away', W / 2, 258);
      if (performance.now() - overAt > 600) { ctx.globalAlpha = .6 + .4 * Math.sin(t * 4); ctx.font = 'bold 22px -apple-system,system-ui,sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('Tap to play again', W / 2, 290); }
      ctx.restore();
    }
    ctx.restore();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.033); last = now;
    if (state === 'title') { t += dt; titleBirds(dt); photoBtn.classList.add('show'); }
    else { update(dt); if (state === 'over') t += dt; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
