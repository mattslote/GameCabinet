<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slow Sail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#06121f;--panel:rgba(8,20,34,.82);--edge:#7fd0e8;--edge2:#2f5f78;--text:#e6f6ff;--mute:#8fb4c6;--hot:#ffd27a;
--px:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:8px/1.5 var(--px);color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
canvas#c{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
.px{background:var(--panel);border:2px solid var(--edge);box-shadow:0 0 0 2px #04101a,inset 0 0 0 2px rgba(0,0,0,.35)}
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:flex-start;justify-content:space-between;
 padding:calc(8px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));pointer-events:none}
.ins{display:flex;gap:5px}
.pn{padding:5px 6px 4px;min-width:50px}
.pn .k{font-size:6px;color:var(--mute);margin-bottom:3px}
.pn .v{font-size:8px;color:var(--text);white-space:nowrap}
.hb{display:flex;gap:5px;pointer-events:auto}
.ib{font:7px var(--px);color:var(--text);background:var(--panel);border:2px solid var(--edge);padding:8px 6px;cursor:pointer;box-shadow:0 0 0 2px #04101a}
.ib:active{transform:translateY(2px)}
.ib.on{background:#ffd27a;color:#22160a;border-color:#fff0c4}
#rose{position:absolute;left:max(6px,env(safe-area-inset-left,0px));top:calc(62px + env(safe-area-inset-top,0px));width:104px;height:124px;pointer-events:none}
#msgs{position:absolute;left:118px;right:8px;top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:flex-end}
#hint{text-align:right;font-size:8px;line-height:1.7;color:#fff2c0;text-shadow:1px 1px 0 #000,-1px 1px 0 #000;pointer-events:none;opacity:0;transition:opacity .6s}
#hint.on{opacity:1}
#toast{max-width:100%;padding:8px 10px;font-size:8px;line-height:1.6;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#tray{position:absolute;left:0;right:0;bottom:0;padding:10px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
 background:linear-gradient(rgba(6,18,31,0),rgba(6,18,31,.9) 24%);display:flex;flex-direction:column;gap:7px}
.ctl{display:flex;align-items:center;gap:8px}
.cl{width:46px;font-size:7px;color:var(--mute);flex:none}
.trk{position:relative;flex:1;height:34px;background:#0a1c2c;border:2px solid var(--edge2);touch-action:none;cursor:pointer}
.trk .mid{position:absolute;left:50%;top:5px;bottom:5px;width:2px;margin-left:-1px;background:#27465a}
.trk .tk{position:absolute;top:8px;bottom:8px;width:2px;background:#1f3a4c}
.knob{position:absolute;top:-2px;width:34px;height:34px;margin-left:-17px;background:linear-gradient(#ffd27a,#f0963c);border:2px solid #fff0c4;box-shadow:0 3px 0 #8a3c18;pointer-events:none}
.trk .end{position:absolute;top:50%;transform:translateY(-50%);font-size:6px;color:#5d8196;pointer-events:none}
.end.l{left:6px}.end.r{right:6px}
.btns{display:flex;gap:6px}
.btns .ib{flex:1;padding:9px 4px;text-align:center}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,10,20,.76);padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{width:100%;max-width:400px;padding:18px 16px;max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:24px;line-height:1.2;color:#ffd27a;text-shadow:3px 3px 0 #b3401c}
.card h2{margin:0 0 10px;font-size:11px;line-height:1.5;color:#ffd27a}
.card .sub{font-size:7px;color:var(--mute);margin:0 0 14px;line-height:1.8}
.card p{font-size:8px;line-height:1.9;margin:0 0 12px}
.btn{font:9px var(--px);color:#22160a;background:linear-gradient(#ffd27a,#f0963c);border:2px solid #fff0c4;padding:11px 12px;cursor:pointer;box-shadow:0 3px 0 #8a3c18;width:100%;margin:0 0 8px}
.btn.sec{color:var(--text);background:#0e2638;border-color:var(--edge2);box-shadow:0 3px 0 #040c14}
.btn:active{transform:translateY(3px);box-shadow:none}
.seg{display:flex;gap:6px;margin:0 0 12px}
.seg button{flex:1;font:7px var(--px);padding:9px 2px;color:var(--text);background:#0e2638;border:2px solid var(--edge2);cursor:pointer}
.seg button.on{background:#ffd27a;color:#22160a;border-color:#fff0c4}
.row{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:7px}
.row label{width:84px;color:var(--mute);flex:none}
.row input[type=range]{flex:1;accent-color:#ffd27a;height:22px;min-width:0}
.row .v{width:28px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:7px;color:var(--mute)}
.chk input{width:18px;height:18px;accent-color:#ffd27a}
.stat{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:2px solid #123044;font-size:7px;line-height:1.6}
.stat span:first-child{color:var(--mute)}
#cmap{display:block;width:100%;height:auto;aspect-ratio:1/1;background:#0b2a44;border:2px solid var(--edge2);margin:0 0 10px;image-rendering:pixelated}
@media (orientation:landscape) and (min-aspect-ratio:23/20){
 #tray{flex-direction:row;align-items:flex-end;gap:12px;padding-top:6px}
 #tray .ctl{flex:1}
 .btns{flex:none;width:30%}
 .card{max-width:440px}
}
@media (prefers-reduced-motion:reduce){#hint,#toast{transition:none}}
</style></head>
<body>
<div id="app">
 <canvas id="c" aria-label="Sailing on the open sea, seen from behind the boat"></canvas>
 <div id="hud">
  <div class="ins">
   <div class="px pn"><div class="k">HEADING</div><div class="v" id="vH">090 E</div></div>
   <div class="px pn"><div class="k">SPEED</div><div class="v" id="vS">0.0KT</div></div>
   <div class="px pn"><div class="k">WIND</div><div class="v" id="vW">10KT</div></div>
  </div>
  <div class="hb"><button class="ib" id="bSpd" type="button">1X</button><button class="ib" id="bSnd" type="button">SND</button><button class="ib" id="bMap" type="button">MAP</button><button class="ib" id="bSet" type="button">MENU</button></div>
 </div>
 <canvas id="rose" width="208" height="248"></canvas>
 <div id="msgs"><div id="toast" class="px"></div><div id="hint"></div></div>
 <div id="tray">
  <div class="ctl"><div class="cl">HELM</div><div class="trk" id="helm"><div class="mid"></div><div class="knob" id="helmK"></div></div></div>
  <div class="ctl"><div class="cl">SHEET</div><div class="trk" id="sheet"><span class="end l">IN</span><span class="end r">OUT</span><div class="knob" id="sheetK"></div></div></div>
  <div class="btns"><button class="ib" id="bAP" type="button">AP OFF</button><button class="ib" id="bReef" type="button">REEF 0</button><button class="ib" id="bTrim" type="button">TRIM OFF</button></div>
 </div>
 <div id="ov" class="ov" hidden><div class="card px" id="card"></div></div>
</div>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
var $=function(id){return document.getElementById(id);};
var DEG=Math.PI/180,TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function sstep(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function wrap(a){a%=TAU;if(a>Math.PI)a-=TAU;else if(a<-Math.PI)a+=TAU;return a;}
function hash(n){n=(n^61)^(n>>>16);n=(n+(n<<3))|0;n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return(n>>>0)/4294967296;}
function h3(a,b,c){return hash(Math.imul(a|0,73856093)^Math.imul(b|0,19349663)^Math.imul(c|0,83492791));}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rr(a,b){return a+Math.random()*(b-a);}
function pickw(o){var s=0,i;for(i=0;i<o.length;i++)s+=o[i][1];var r=Math.random()*s;for(i=0;i<o.length;i++){r-=o[i][1];if(r<=0)return o[i][0];}return o[0][0];}

/* ================= constants ================= */
var CYCLE=7200;          /* real seconds for one full day, as before */
var START_HOUR=7;
var KT=0.514*3;          /* world metres per second per knot (compressed so the sea is crossable) */
var CELL=3200,VIS=8500,VEX=3.2,HC=6;
var REEF_A=[1,.7,.42];
var CARD=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

/* ================= state ================= */
var S={seed:7,tSun:0,x:0,y:0,h:140*DEG,u:3,v:0,r:0,heel:0,th:-0.9,sheet:.62,reef:0,rud:0,camH:140*DEG,
  ap:0,apT:0,assist:false,wscale:1,dist:0,gybes:0,tacks:0,track:[],log:{},disc:{},vis:{}};
var W={dir:270*DEG,spd:10,g:.5,sq:0,Va:8,beta:2,alpha:.2,flog:0,stall:0,lowSpd:false};
var speedMul=1,uiPause=false,hidden=false,state='menu',tReal=0;
var settings={vol:.8,amb:.6,hints:true,muted:false};
try{var sj=JSON.parse(localStorage.getItem('slowsail-settings')||'null');if(sj)for(var k in sj)if(k in settings)settings[k]=sj[k];}catch(e){}
function saveSettings(){try{localStorage.setItem('slowsail-settings',JSON.stringify(settings));}catch(e){}}
var sp=[0,0,0,0,0,0];
function seedPhases(){for(var i=0;i<6;i++)sp[i]=h3(S.seed,i,99)*TAU;}
seedPhases();

/* ================= time, sun, sky ================= */
function hourNow(){return (START_HOUR+S.tSun/CYCLE*24)%24;}
function sunInfo(){
  var hr=hourNow(),a=(hr-6)*15*DEG;
  return {el:65*DEG*Math.sin(a),az:wrap(90*DEG+a)};
}
var SKYK=[ /* sun elevation (deg) : top, mid, horizon */
 [-18,[6,8,28],[12,16,44],[24,30,64]],
 [-8,[14,20,60],[46,44,92],[96,68,112]],
 [-2,[40,56,128],[170,98,128],[244,128,104]],
 [2,[70,110,190],[236,150,120],[255,190,120]],
 [8,[68,122,206],[190,184,196],[252,222,170]],
 [20,[60,124,218],[130,184,234],[204,228,246]],
 [90,[56,118,216],[118,178,236],[190,224,248]]];
var AMBK=[[-18,[.17,.2,.34]],[-6,[.3,.3,.46]],[0,[.78,.52,.5]],[5,[1,.74,.56]],[15,[1.02,.92,.8]],[30,[1.03,1,.94]],[90,[1.03,1.02,.98]]];
function keyed(tab,e,cols){
  e=clamp(e/DEG,tab[0][0],tab[tab.length-1][0]);
  for(var i=0;i<tab.length-1;i++)if(e<=tab[i+1][0]){
    var t=(e-tab[i][0])/(tab[i+1][0]-tab[i][0]),r=[];
    for(var k=1;k<=cols;k++)r.push(mix(tab[i][k],tab[i+1][k],t));
    return r;
  }
  var l=tab[tab.length-1],q=[];for(var j=1;j<=cols;j++)q.push(l[j]);return q;
}
var AM=[1,1,1],SUN={el:0,az:0},SKYC=[[0,0,0],[0,0,0],[0,0,0]],NIGHT=0,MOON={el:0,az:0};
function astro(){
  SUN=sunInfo();
  SKYC=keyed(SKYK,SUN.el,3);
  var a=keyed(AMBK,SUN.el,1)[0];
  MOON={el:-SUN.el,az:wrap(SUN.az+Math.PI)};
  var moonLift=MOON.el>0?sstep(MOON.el/(30*DEG))*.1:0;
  AM=[a[0]+moonLift*.7,a[1]+moonLift*.8,a[2]+moonLift*1.1];
  NIGHT=1-sstep((SUN.el/DEG+9)/12);
  /* squall gloom */
  var g=W.sq*.45;
  for(var i=0;i<3;i++){SKYC[i]=mix(SKYC[i],[96,104,118].map(function(v,j){return v*(AM[j]>.5?1:.4);}),g);}
}

/* ================= wind ================= */
var sqs=[];
function mkSqualls(){sqs=[];var n=2;for(var i=0;i<n;i++)sqs.push({c:11+i*7+h3(S.seed,i,5)*2.5,w:.5+h3(S.seed,i,6)*.3});}
mkSqualls();
function sqEnv(){
  var hr=hourNow(),m=0;
  for(var i=0;i<sqs.length;i++){var d=Math.abs(hr-sqs[i].c);d=Math.min(d,24-d);m=Math.max(m,Math.exp(-(d*d)/(sqs[i].w*sqs[i].w)));}
  return m<.02?0:m;
}
function windDirBase(tt){return 270*DEG+Math.sin(tt/173+sp[0])*7*DEG+Math.sin(tt/410+sp[1])*12*DEG+Math.sin(tt/1130+sp[2])*18*DEG;}
function windSpdBase(tt){
  var hr=hourNow(),di=3.4*Math.sin((hr-10)/24*TAU);
  var s=11+di*.9+2.2*Math.sin(tt/260+sp[3])+1.2*Math.sin(tt/87+sp[4]);
  return Math.max(4.5,s*S.wscale)+W.sq*13;
}
var wfx=1,wfy=0;
function gustAt(px,py,tt){
  var ax=px-wfx*tt*6.5,ay=py-wfy*tt*6.5;
  var a=Math.sin(ax*.0043+ay*.0021+1.7)*Math.sin(ay*.0052-ax*.0013+.4);
  var b=Math.sin(ax*.0112-ay*.0071+2.2)*Math.sin(ax*.0063+ay*.0121+5.1);
  return clamp(.5+.5*a+.28*b,0,1);
}
function updateWind(){
  var tt=S.tSun;W.sq=sqEnv();
  var bd=windDirBase(tt);wfx=-Math.sin(bd);wfy=-Math.cos(bd);
  var g=gustAt(S.x,S.y,tt);
  W.g=g;W.dir=bd+(g-.5)*.18+W.sq*.45;W.spd=Math.min(30,windSpdBase(tt)*(.72+.56*g));
}

/* ================= sail physics ================= */
var AOPT=.22;
function sheetLimit(){return .06+1.44*Math.pow(S.sheet,1.15);}
function sailCN(a){var as=.27;if(a<as)return 5*a;return Math.max(1.35-2*(a-as),1.05*Math.sin(a),0);}
var KH=240,MASS=7,SA=.72;
var evq=[];
function stepBoat(dt){
  var wx=-W.spd*Math.sin(W.dir),wy=-W.spd*Math.cos(W.dir);
  var sh=Math.sin(S.h),ch=Math.cos(S.h),fx=sh,fy=ch,sx=ch,sy=-sh;
  var bvx=S.u*fx+S.v*sx,bvy=S.u*fy+S.v*sy,ax=wx-bvx,ay=wy-bvy,Va=Math.hypot(ax,ay)+1e-6;
  var awx=(ax*fx+ay*fy)/Va,awy=(ax*sx+ay*sy)/Va,beta=Math.atan2(-awy,-awx);
  W.Va=Va;W.beta=beta;
  /* trim assist */
  if(S.assist){
    var want=Math.max(.06,Math.abs(beta)-AOPT)+clamp((Math.abs(S.heel)-.3)*2.2,0,.9),tg=clamp(Math.pow((want-.06)/1.44,1/1.15),0,1);
    S.sheet+=clamp(tg-S.sheet,-.3*dt,.3*dt);
  }
  var lim=sheetLimit(),side=Math.abs(beta)>.03?-Math.sign(beta):(S.th>=0?1:-1);
  var tgt=side*Math.min(Math.abs(beta)*.97,lim),prev=S.th;
  var rate=(.9+Va*.16)*((S.th*tgt<0)?1.8:1);
  S.th+=clamp(tgt-S.th,-rate*dt,rate*dt);
  if(prev*S.th<0&&Math.abs(beta)>2){ /* gybe */
    var sev=Va*Va/100*Math.max(lim,.15)*(S.assist?.3:1);
    S.gybes++;evq.push({t:'gybe',v:sev});
    S.u*=Math.max(.55,1-sev*.08);S.r+=-Math.sign(prev)*Math.min(.5,sev*.07);S.heel+=Math.sign(S.th)*Math.min(.3,sev*.04);
  }
  var cs=Math.cos(S.th),sn=Math.sin(S.th);
  var dn=awx*sn+awy*cs,dc=-awx*cs+awy*sn,alpha=Math.atan2(Math.abs(dn),dc),CN=sailCN(alpha);
  W.alpha=alpha;
  W.flog=clamp((.1-alpha)/.08,0,1)*clamp(Va/6,0,1);
  W.stall=clamp((alpha-.38)/.25,0,1);
  var q=.5*Va*Va*REEF_A[S.reef]*SA,sg=dn>=0?1:-1;
  var hf=Math.pow(Math.cos(Math.min(1.1,Math.abs(S.heel))),1.6);
  var Fx=q*(CN*sg*sn+.06*awx)*hf,Fy=q*(CN*sg*cs+.06*awy)*hf;
  W.Fx=Fx;W.Fy=Fy;
  var heelT=Math.sign(Fy)*.95*Math.tanh(Math.abs(Fy)/KH);
  S.heel+=(heelT-S.heel)*(1-Math.exp(-dt/1.5));
  var au=Math.abs(S.u),Rh=1.25*S.u+1.2*S.u*au+16*Math.pow(Math.max(0,au-6.6),2)*Math.sign(S.u||1);
  S.u+=(Fx-Rh)/MASS*dt;
  S.v+=(Fy-(95+16*au)*S.v-8*S.v*Math.abs(S.v))/MASS*dt;
  var steer=S.rud*.40*(au/(au+1.3))*(S.u>=0?1:-1);
  var ah=Math.abs(S.heel);
  var wh=Math.sign(beta)*(.012*ah+1.4*Math.pow(Math.max(0,ah-.38),1.6))*Math.min(1,au/2+.3)*(S.assist?.35:1);
  var fall=0;if(Math.abs(beta)<.62)fall=-Math.sign(beta||1)*.14*(1-Math.min(1,au/2))*(1-Math.abs(beta)/.62);
  var rT=steer+wh+fall;
  S.r+=(rT-S.r)*(1-Math.exp(-dt/.8));
  S.h=wrap(S.h+S.r*dt);
  S.camH=wrap(S.camH+wrap(S.h-S.camH)*(1-Math.exp(-dt*2.4)));
  S.x+=(S.u*fx+S.v*sx)*KT*dt;S.y+=(S.u*fy+S.v*sy)*KT*dt;
  S.dist+=Math.hypot(S.u,S.v)*dt/3600;
}

/* ================= islands ================= */
var NAMES=['Heron Rock','Kestrel Isle','Long Cay','Mossback','Tern Reef','Saltmarsh','Little Anvil','Cormorant Isle','Windward Head','Driftwood Key','Pelican Rock','Foxglove Isle','Greywater','The Sisters','Halcyon Cay','Brine Point','Osprey Island','Camber Rock','Lantern Isle','Sandglass','Mistral Head','Skerry Bell','Wren Island','Anchor Cay'];
var TYPEC={
 green:{beach:[226,206,150],low:[40,92,54],mid:[62,120,64],top:[110,156,84],dark:[26,66,44]},
 rocky:{beach:[196,186,168],low:[104,104,102],mid:[134,132,126],top:[104,136,80],dark:[74,74,78]},
 cay:{beach:[240,228,186],low:[234,222,178],mid:[226,214,170],top:[216,206,160],dark:[60,120,70]},
 volcano:{beach:[70,64,68],low:[52,88,58],mid:[100,84,72],top:[124,100,86],dark:[40,36,44]},
 stacks:{beach:[170,160,150],low:[96,98,104],mid:[126,126,130],top:[170,170,172],dark:[66,68,74]}
};
var icache={};
function cellIsland(i,j){
  var key=i+','+j;if(key in icache)return icache[key];
  var is=null,forced=(i===0&&j===0)||(i===-1&&j===0);
  if(forced||h3(S.seed,i,j,0)<.56){
    var tr=h3(S.seed,i,j,7),type=tr<.36?'green':(tr<.62?'rocky':(tr<.8?'cay':(tr<.9?'volcano':'stacks')));
    if(forced&&i===0)type='green';
    var rr0=h3(S.seed,i,j,4),r,hg;
    if(type==='green'){r=320+560*rr0;hg=70+110*h3(S.seed,i,j,5);}
    else if(type==='rocky'){r=220+340*rr0;hg=50+80*h3(S.seed,i,j,5);}
    else if(type==='cay'){r=130+230*rr0;hg=7+7*h3(S.seed,i,j,5);}
    else if(type==='volcano'){r=460+420*rr0;hg=230+130*h3(S.seed,i,j,5);}
    else{r=90+110*rr0;hg=55+35*h3(S.seed,i,j,5);}
    is={x:(i+.2+.6*h3(S.seed,i,j,1))*CELL,y:(j+.2+.6*h3(S.seed,i,j,2))*CELL,r:r,hgt:hg,type:type,
      s1:h3(S.seed,i,j,11)*TAU,s2:h3(S.seed,i,j,12)*TAU,s3:h3(S.seed,i,j,13)*TAU,
      name:NAMES[Math.floor(h3(S.seed,i,j,3)*NAMES.length)],lh:type==='rocky'&&h3(S.seed,i,j,8)>.35,id:key};

});

function cycleReef(){S.reef=(S.reef+1)%3;toast(['Full sail','First reef: 30% less sail','Second reef: storm canvas'][S.reef]);sfxEv('click');}
function toggleTrim(){S.assist=!S.assist;toast(S.assist?'Trim assist on: the sheet follows the wind':'Trim assist off');sfxEv('click');}
function cycleAP(){
  S.ap=(S.ap+1)%3;
  if(S.ap===1){S.apT=S.h;toast('Autopilot holding heading '+cardinal(S.h));}
  else if(S.ap===2){S.apT=wrap(windDirBase(S.tSun)-S.h);toast('Autopilot holding this wind angle');}
  else toast('Autopilot off');sfxEv('click');
}
$('bReef').addEventListener('click',function(){audioStart();if(state==='play'&&!uiPause)cycleReef();});
$('bTrim').addEventListener('click',function(){audioStart();if(state==='play'&&!uiPause)toggleTrim();});
$('bAP').addEventListener('click',function(){audioStart();if(state==='play'&&!uiPause)cycleAP();});
$('bSpd').addEventListener('click',function(){audioStart();var L=[1,2,5,10];speedMul=L[(L.indexOf(speedMul)+1)%L.length];updateHud();});
$('bSnd').addEventListener('click',function(){audioStart();settings.muted=!settings.muted;saveSettings();audioLevels();updateHud();});
$('bSet').addEventListener('click',function(){audioStart();if(state==='play'&&!uiPause)showSettings();});
$('bMap').addEventListener('click',function(){audioStart();if(state==='play'&&!uiPause)showChart();});

/* ================= save / load ================= */
function persist(){
  if(state!=='play')return;
  try{localStorage.setItem('slowsail-save',JSON.stringify({v:1,seed:S.seed,tSun:S.tSun,x:S.x,y:S.y,h:S.h,u:S.u,th:S.th,sheet:S.sheet,reef:S.reef,wscale:S.wscale,dist:S.dist,gybes:S.gybes,tacks:S.tacks,log:S.log,disc:S.disc,vis:S.vis,track:S.track.slice(-400),sum:S.sumShown?1:0}));}catch(e){}
}
function loadSave(){try{var o=JSON.parse(localStorage.getItem('slowsail-save')||'null');if(o&&o.v===1)return o;}catch(e){}return null;}
function resetWorld(seed){
  S.seed=seed;seedPhases();mkSqualls();icache={};crit=[];birds=[];fx=[];buildSky();
}
function newVoyage(wscale){
  resetWorld((Math.random()*1e6)|0);
  S.tSun=0;S.x=300;S.y=420;S.h=140*DEG;S.camH=S.h;S.u=3;S.v=0;S.r=0;S.heel=0;S.th=-1;S.sheet=.62;S.reef=0;S.rud=0;S.ap=0;S.assist=true;S.wscale=wscale||1;
  S.dist=0;S.gybes=0;S.tacks=0;S.track=[];S.log={};S.disc={};S.vis={};S.sumShown=false;helm=0;
  speedMul=1;critT=6;birdT=4;
}
function restoreFrom(o){
  resetWorld(o.seed);S.tSun=o.tSun;S.x=o.x;S.y=o.y;S.h=o.h;S.camH=o.h;S.u=o.u;S.v=0;S.r=0;S.heel=0;S.th=o.th;S.sheet=o.sheet;S.reef=o.reef||0;S.wscale=o.wscale||1;S.dist=o.dist||0;S.gybes=o.gybes||0;S.tacks=o.tacks||0;S.log=o.log||{};S.disc=o.disc||{};S.vis=o.vis||{};S.track=o.track||[];S.sumShown=!!o.sum;S.rud=0;S.ap=0;S.assist=true;helm=0;speedMul=1;
}

/* ================= overlays ================= */
function showCard(html){$('card').innerHTML=html;$('ov').hidden=false;}
function hideCard(){$('ov').hidden=true;uiPause=false;}
function fmtClock(){var hr=hourNow(),h=Math.floor(hr),m=Math.floor((hr-h)*60);return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function showMenu(){
  state='menu';uiPause=false;helmActive=false;
  var sv=loadSave(),ws=1;
  var h='<h1>SLOW SAIL</h1><div class="sub">A QUIET DAY ON THE OPEN SEA</div>'+
   '<p>One boat, one sail, two hours around the clock. The wind blows from the west, as it does out here, so heading east is easy and going west means working for it. Easy mode is on: the sail trims itself and the boat holds course when you let go of the helm. Turn TRIM OFF to take the sheet yourself. Dark patches on the water are gusts. Keep an eye on the horizon for islands, and for whatever lives in the sea.</p>'+
   '<div class="sub">WIND</div><div class="seg" id="wseg"><button data-w=".8" type="button">LIGHT</button><button data-w="1" class="on" type="button">STEADY</button><button data-w="1.2" type="button">BRISK</button></div>'+
   '<button class="btn" id="go" type="button">SET SAIL</button>'+(sv?'<button class="btn sec" id="res" type="button">RESUME · '+fmtClockAt(sv.tSun)+' · '+(sv.dist||0).toFixed(1)+' NM</button>':'');
  showCard(h);
  var bs=$('wseg').querySelectorAll('button');
  for(var i=0;i<bs.length;i++)bs[i].addEventListener('click',function(){for(var j=0;j<bs.length;j++)bs[j].className='';this.className='on';ws=+this.getAttribute('data-w');});
  $('go').addEventListener('click',function(){audioStart();newVoyage(ws);state='play';hideCard();astro();ISL=islandsNear(S.x,S.y,VIS);toast('Fair wind. Steer with the helm, the boat does the rest.',3400);persist();});
  if(sv)$('res').addEventListener('click',function(){audioStart();restoreFrom(sv);state='play';hideCard();astro();ISL=islandsNear(S.x,S.y,VIS);toast('Welcome back aboard.');});
}
function fmtClockAt(ts){var hr=(START_HOUR+ts/CYCLE*24)%24,h=Math.floor(hr),m=Math.floor((hr-h)*60);return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function showSettings(){
  uiPause=true;
  var h='<h2>PAUSED · '+fmtClock()+'</h2>'+
   '<div class="row"><label>VOLUME</label><input id="svol" type="range" min="0" max="100" value="'+Math.round(settings.vol*100)+'"></div>'+
   '<div class="row"><label>AMBIENCE</label><input id="samb" type="range" min="0" max="100" value="'+Math.round(settings.amb*100)+'"></div>'+
   '<div class="row"><label>TIME OF DAY</label><input id="stod" type="range" min="0" max="239" value="'+Math.round(((START_HOUR+S.tSun/CYCLE*24)%24)*10)+'"><span class="v" id="vtod"></span></div>'+
   '<label class="chk"><input id="shint" type="checkbox"'+(settings.hints?' checked':'')+'> SHOW HINTS</label>'+
   '<button class="btn" id="bres" type="button">BACK TO THE HELM</button>'+
   '<button class="btn sec" id="bnew" type="button">NEW VOYAGE</button>'+
   '<button class="btn sec" id="bmenu" type="button">MAIN MENU</button>';
  showCard(h);
  function lab(){$('vtod').textContent=fmtClock();}lab();
  $('svol').addEventListener('input',function(){settings.vol=this.value/100;saveSettings();audioLevels();});
  $('samb').addEventListener('input',function(){settings.amb=this.value/100;saveSettings();audioLevels();});
  $('stod').addEventListener('input',function(){var hr=this.value/10;var cur=hourNow();var dh=hr-cur;if(dh<0)dh+=24;S.tSun+=dh/24*CYCLE;astro();lab();});
  $('shint').addEventListener('change',function(){settings.hints=this.checked;saveSettings();});
  $('bres').addEventListener('click',function(){hideCard();persist();});
  $('bnew').addEventListener('click',function(){if(this.dataset.arm==='1'){newVoyage(S.wscale);hideCard();astro();ISL=islandsNear(S.x,S.y,VIS);return;}this.dataset.arm='1';this.textContent='SURE? TAP AGAIN';});
  $('bmenu').addEventListener('click',function(){persist();showMenu();});
}
function showSummary(){
  uiPause=true;var n=0;LOGORDER.forEach(function(k){if(S.log[k])n++;});
  showCard('<h2>A FULL DAY AT SEA</h2><p>Two hours, dawn to dawn. The sea does not mind either way.</p>'+
   '<div class="stat"><span>DISTANCE SAILED</span><span>'+S.dist.toFixed(1)+' NM</span></div>'+
   '<div class="stat"><span>ISLANDS SIGHTED</span><span>'+Object.keys(S.disc).length+'</span></div>'+
   '<div class="stat"><span>KINDS OF WILDLIFE</span><span>'+n+' OF '+LOGORDER.length+'</span></div>'+
   '<div class="stat"><span>TACKS · GYBES</span><span>'+S.tacks+' · '+S.gybes+'</span></div><br>'+
   '<button class="btn" id="skeep" type="button">KEEP SAILING</button><button class="btn sec" id="smap" type="button">OPEN THE LOG</button><button class="btn sec" id="snew" type="button">NEW VOYAGE</button>');
  $('skeep').addEventListener('click',hideCard);$('smap').addEventListener('click',showChart);$('snew').addEventListener('click',function(){showMenu();});
}
var chartZoom=1;
function showChart(){
  uiPause=true;
  var h='<h2>CHART · '+fmtClock()+'</h2><canvas id="cmap" width="300" height="300"></canvas>'+
   '<div class="stat"><span>DISTANCE SAILED</span><span>'+S.dist.toFixed(1)+' NM</span></div>'+
   '<div class="stat"><span>ISLANDS SIGHTED</span><span>'+Object.keys(S.disc).length+'</span></div>'+
   '<div class="stat"><span>TACKS · GYBES</span><span>'+S.tacks+' · '+S.gybes+'</span></div><div class="sub" style="margin-top:12px">LOG BOOK</div>';
  LOGORDER.forEach(function(k){h+='<div class="stat"><span>'+LABEL[k].toUpperCase()+'</span><span>'+(S.log[k]?'x'+S.log[k]:'-')+'</span></div>';});
  h+='<br><button class="btn" id="cclose" type="button">BACK TO THE HELM</button>';
  showCard(h);
  var cm=$('cmap');drawChart(cm);cm.addEventListener('click',function(){chartZoom=chartZoom===1?2:(chartZoom===2?.5:1);drawChart(cm);});
  $('cclose').addEventListener('click',hideCard);
}
function drawChart(cm){
  var g=cm.getContext('2d'),Wd=300,Hd=300,sc=Wd/(9000/chartZoom);
  g.fillStyle='#0b2a44';g.fillRect(0,0,Wd,Hd);
  function tx(x){return Wd/2+(x-S.x)*sc;} function ty(y){return Hd/2-(y-S.y)*sc;}
  g.strokeStyle='#14405f';g.lineWidth=1;var gs=1000;
  for(var gx=Math.floor((S.x-5000)/gs)*gs;gx<S.x+5000;gx+=gs){g.beginPath();g.moveTo(tx(gx),0);g.lineTo(tx(gx),Hd);g.stroke();}
  for(var gy=Math.floor((S.y-5000)/gs)*gs;gy<S.y+5000;gy+=gs){g.beginPath();g.moveTo(0,ty(gy));g.lineTo(Wd,ty(gy));g.stroke();}
  var l=islandsNear(S.x,S.y,6500);
  l.forEach(function(is){
    var known=S.disc[is.id];if(!known)return;
    g.fillStyle=is.type==='cay'?'#e6d9a8':(is.type==='rocky'||is.type==='stacks'?'#8a8c90':'#4f9a58');
    g.beginPath();g.arc(tx(is.x),ty(is.y),Math.max(3,is.r*sc),0,TAU);g.fill();
    g.strokeStyle='rgba(120,230,220,.5)';g.beginPath();g.arc(tx(is.x),ty(is.y),Math.max(5,is.r*sc*1.6),0,TAU);g.stroke();
    g.fillStyle='#e6f6ff';g.font='7px "Press Start 2P",monospace';g.textAlign='center';g.fillText(is.name,tx(is.x),ty(is.y)-Math.max(6,is.r*sc)-4);
  });
  g.strokeStyle='#ffd27a';g.lineWidth=1.5;g.beginPath();
  S.track.forEach(function(p,i){var x=tx(p[0]),y=ty(p[1]);if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});g.lineTo(tx(S.x),ty(S.y));g.stroke();
  g.save();g.translate(tx(S.x),ty(S.y));g.rotate(S.h);g.fillStyle='#fff';g.beginPath();g.moveTo(0,-7);g.lineTo(4,5);g.lineTo(-4,5);g.closePath();g.fill();g.restore();
  /* wind arrow */
  g.save();g.translate(28,28);g.rotate(W.dir+Math.PI);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(0,-14);g.lineTo(0,14);g.stroke();g.beginPath();g.moveTo(0,14);g.lineTo(-5,7);g.lineTo(5,7);g.closePath();g.fillStyle='#fff';g.fill();g.restore();
  g.fillStyle='#8fb4c6';g.font='7px "Press Start 2P",monospace';g.textAlign='left';g.fillText('WIND '+Math.round(W.spd)+'KT',8,52);g.fillText('N',Wd-14,14);g.fillText('TAP TO ZOOM',8,Hd-8);
}

/* ================= main update ================= */
var lastTs=0,trackT=0,hudAcc=0,saveAcc=0,islAcc=0,roseAcc=0,lastSq=0,lastHr=-1;
function inputs(dt){
  var kx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
  if(kx){helm=clamp(helm+kx*dt*3,-1,1);if(S.ap)S.ap=0;S.kbd=1;}else if(S.kbd){S.kbd=0;if(S.assist){S.ap=1;S.apT=S.h;}}
  if(kx){}else if(!helmActive)helm*=Math.exp(-dt*4);
  var ky=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  if(ky){S.sheet=clamp(S.sheet+ky*dt*.5,0,1);if(S.assist)S.assist=false;}
  if(Math.abs(helm)<.01&&!helmActive)helm=0;
  placeKnob($('helmK'),(helm+1)/2);placeKnob($('sheetK'),S.sheet);
}
function autopilot(){
  if(!S.ap||helmActive||Math.abs(helm)>.02)return;
  var tgt=S.ap===1?S.apT:wrap(windDirBase(S.tSun)-S.apT);
  S.rud=clamp(wrap(tgt-S.h)*2.2-S.r*1.4,-1,1);
}
var lastBeta=0;
function collide(){
  for(var i=0;i<ISL.length;i++){
    var is=ISL[i],dx=S.x-is.x,dy=S.y-is.y,d=Math.hypot(dx,dy),lim=is.r*.96+30;
    if(d<lim){var nx=dx/d,ny=dy/d;S.x=is.x+nx*lim;S.y=is.y+ny*lim;
      if(S.u>1.2){toast('Aground on the shoals of '+is.name+'. Ease off and back away.',3200,'ground');}
      S.u*=.25;S.v*=.2;
      /* turn the bow seaward */
      var out_=Math.atan2(nx,ny);S.h=wrap(S.h+wrap(out_-S.h)*.02);}
  }
}
function simulate(dt){
  inputs(dt);
  var sdt=dt*speedMul,n=Math.max(1,Math.ceil(sdt/.05)),h=sdt/n,i,tw0=wrap(W.dir-S.h);
  for(i=0;i<n;i++){
    S.tSun+=h;updateWind();
    if(!helmActive&&Math.abs(helm)<.02&&!S.ap)S.rud=0;else if(!S.ap||helmActive||Math.abs(helm)>.02)S.rud=helm;
    autopilot();
    var prevSide=Math.sign(wrap(W.dir-S.h));
    stepBoat(h);
    if(Math.sign(wrap(W.dir-S.h))!==prevSide&&Math.abs(wrap(W.dir-S.h))<1.2)S.tacks++;
    collide();
  }
  astro();driftClouds(sdt);
  updateWild(sdt);
  while(evq.length){var e=evq.shift();if(e.t==='gybe'){sfxEv('bang');if(e.v>2.2)toast('CRASH GYBE! Haul the sheet in before you gybe.',2800);else toast('Gybe',1200);}}
  /* island discovery and visits */
  for(i=0;i<ISL.length;i++){
    var is=ISL[i],d=Math.hypot(is.x-S.x,is.y-S.y),rel=Math.abs(wrap(Math.atan2(is.x-S.x,is.y-S.y)-S.camH));
    if(!S.disc[is.id]&&d<6200&&rel<1.1){S.disc[is.id]=is.name;toast('Land ho! '+is.name+'.',3200,'found');}
    if(!S.vis['i'+is.id]&&d<is.r+420){S.vis['i'+is.id]=1;toast('You are off '+is.name+'.',2600);}
  }
  trackT+=sdt;if(trackT>14){trackT=0;S.track.push([Math.round(S.x),Math.round(S.y)]);if(S.track.length>500)S.track.shift();}
  /* weather and time of day notes */
  if(W.sq>.15&&lastSq<=.15)toast('A squall is coming. Watch the water and be ready to reef.',3600);
  if(W.sq>.65&&lastSq<=.65)toast('Squall! Ease the sheet and bear away.',3000);
  lastSq=W.sq;
  if(!S.sumShown&&S.tSun>=CYCLE){S.sumShown=true;persist();showSummary();}
  var hr=hourNow();if(lastHr>=0){if(lastHr<6.2&&hr>=6.2)toast('Sunrise.',2000);if(lastHr<18&&hr>=18)toast('Sunset.',2000);}lastHr=hr;
}
function frame(ts){
  var dt=Math.min(.1,(ts-lastTs)/1000||0);lastTs=ts;tReal+=dt;
  var running=state==='play'&&!uiPause&&!hidden;
  if(running)simulate(dt);
  else if(state==='menu'){S.tSun+=dt*30;astro();driftClouds(dt*30);updateWind();S.x+=0;}
  islAcc+=dt;if(islAcc>.4){islAcc=0;ISL=islandsNear(S.x,S.y,VIS);}
  renderFrame(tReal);
  if(running)audioTick(dt);
  hudAcc+=dt;if(hudAcc>.12){hudAcc=0;updateHud();}
  roseAcc+=dt;if(roseAcc>.07){roseAcc=0;if(state==='play')drawRose();}
  saveAcc+=dt;if(saveAcc>6){saveAcc=0;persist();}
  requestAnimationFrame(frame);
}
var rzT=0;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(layout,120);});
document.addEventListener('visibilitychange',function(){hidden=document.hidden;if(hidden){persist();if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();}else if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();});
window.addEventListener('pagehide',persist);
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ================= boot ================= */
S.x=300;S.y=420;astro();layout();updateWind();ISL=islandsNear(S.x,S.y,VIS);
showMenu();
requestAnimationFrame(function(ts){lastTs=ts;requestAnimationFrame(frame);});
window.__SS={islandsNear:islandsNear,S:S,W:W,sheetLimit:sheetLimit,stepBoat:stepBoat,updateWind:updateWind,astro:astro,setHour:function(hr){var cur=hourNow(),dh=hr-cur;if(dh<0)dh+=24;S.tSun+=dh/24*CYCLE;astro();},
  sfx:function(k){sfxEv(k,{x:S.x+50,y:S.y+80});},save:persist,load:loadSave,start:function(w){newVoyage(w||1);state='play';hideCard();astro();ISL=islandsNear(S.x,S.y,VIS);},ISL:function(){return ISL;},crit:function(){return crit;},birds:function(){return birds;},spawnCrit:spawnCrit,spawnFlock:spawnFlock,
  state:function(){return state;},LAY:LAY,setSpeed:function(m){speedMul=m;},AU:AU,cardinal:cardinal,helm:function(v){helm=v;},mkCrit:function(c){crit.push(c);}};
})();
</script>
