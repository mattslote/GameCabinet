<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tap-In</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Big+Shoulders+Display:wght@700;900&display=swap">
<style>
/* Layout: HUD plates on top, one portrait court that scales to fit, a slim control bar below.
   Look: painted gym wall, maple floor, jersey numerals. One deliberate world, so single theme. */
:root {
  --bg: #12233b;
  --wall: #1d3a63;
  --wall-2: #234573;
  --seam: #17304f;
  --floor: #c98c4e;
  --floor-seam: #a8703a;
  --paint: #f2eee4;
  --ball: #ee7424;
  --ball-hi: #ffa766;
  --ball-line: #4a2208;
  --rim: #e8452f;
  --pole: #6d86a8;
  --plate: #0c1a2e;
  --amber: #ffc43a;
  --ink: #eaf0f8;
  --ink-dim: #9db0c8;
  --line-dim: #35557f;
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lab {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.val {
  display: block;
  font-family: var(--display);
  font-weight: 900;
  font-size: 40px;
  line-height: 1;
  color: var(--amber);
  font-variant-numeric: tabular-nums;
}
.val small { font-size: .5em; font-weight: 700; color: var(--ink-dim); margin-left: 2px; }
.hud { display: flex; padding-bottom: 6px; border-bottom: 2px solid var(--paint); }
.stat { flex: 1; min-width: 0; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line-dim); }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.court { position: relative; box-shadow: 0 0 0 2px var(--paint); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; }
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  box-sizing: border-box;
  background: color-mix(in srgb, var(--plate) 70%, transparent);
}
.card {
  box-sizing: border-box;
  width: min(100%, 320px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
  background: var(--plate);
  border: 2px solid var(--paint);
}
.card h1, .card h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 900;
  font-size: 52px;
  line-height: .95;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: var(--paint);
  text-wrap: balance;
}
.card p { margin: 0; line-height: 1.4; color: var(--ink); max-width: 36ch; }
.res { display: flex; gap: 16px; }
.res > div { flex: 1; min-width: 0; }
.res em {
  display: block;
  margin-top: 2px;
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--paint);
}
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }
.btn {
  min-height: 48px;
  padding: 0 14px;
  font-family: var(--display);
  font-weight: 900;
  font-size: 22px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--paint);
  background: transparent;
  border: 2px solid var(--paint);
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary { color: var(--plate); background: var(--amber); border-color: var(--amber); }
.chip {
  min-height: 44px;
  padding: 0 14px;
  font-family: var(--body);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1.5px solid var(--line-dim);
  cursor: pointer;
  touch-action: manipulation;
}
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--paint); outline-offset: 2px; }
.bar { display: flex; align-items: center; gap: 8px; padding-top: 6px; border-top: 2px solid var(--paint); }
.best { flex: 1; min-width: 0; }
#best { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; padding: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
td { padding: 3px 0; border-top: 1px solid var(--line-dim); }
th:nth-child(n+3), td:nth-child(n+3) { text-align: right; }
td:first-child { color: var(--ink-dim); width: 24px; }
tfoot td { font-weight: 600; color: var(--amber); border-top: 2px solid var(--paint); }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
@media (max-height: 640px) { .val { font-size: 32px; } .card h1, .card h2 { font-size: 42px; } }
</style>

<div class="app">
  <header class="hud">
    <div class="stat"><span class="lab">Level</span><span class="val" id="lvl">1<small>/8</small></span></div>
    <div class="stat"><span class="lab">Time</span><span class="val" id="time">0.0</span></div>
    <div class="stat"><span class="lab">Bounces</span><span class="val" id="bn">0</span></div>
  </header>
  <main class="stage" id="stage">
    <div class="court" id="court">
      <canvas id="cv" aria-label="Basketball court. Tap the ball to bounce it into the hoop."></canvas>
      <div class="overlay" id="ov" hidden><div class="card" id="card"></div></div>
    </div>
  </main>
  <footer class="bar">
    <div class="best"><span class="lab">Best</span><span id="best">No best yet</span></div>
    <button class="chip" id="snd" type="button" aria-pressed="false">Sound on</button>
    <button class="chip" id="reset" type="button">Reset</button>
  </footer>
</div>

<script>
(function () {
'use strict';

/* ---------- Physics (no DOM, so it can be tested headless) ---------- */
var W = 540, H = 864, FLOOR = 815, R = 16, G = 575, TAU = Math.PI * 2;
var E_FLOOR = .76, E_WALL = .70, E_BOARD = .60, E_RIM = .55;
var TAP_POWER = 480, TAP_REACH = R * 3.6, MAXV = 1100, RIM_R = 3, STEP = 1 / 120;

/* ball: which side the ball starts on. face: which way the rim reaches from its backboard. */
var LEVELS = [
  { name: 'Warm-Up',       ball: 'L', bx: 534, face: 'L', hy: 459, len: 58, pole: false },
  { name: 'Low Post',      ball: 'L', bx: 534, face: 'L', hy: 675, len: 58, pole: false },
  { name: 'Pole Position', ball: 'L', bx: 454, face: 'L', hy: 527, len: 58, pole: true  },
  { name: 'Other Side',    ball: 'R', bx: 6,   face: 'R', hy: 351, len: 58, pole: false },
  { name: 'Rafters',       ball: 'L', bx: 534, face: 'L', hy: 257, len: 58, pole: false },
  { name: 'Over the Top',  ball: 'L', bx: 264, face: 'R', hy: 500, len: 58, pole: true  },
  { name: 'Nosebleeds',    ball: 'R', bx: 6,   face: 'R', hy: 189, len: 58, pole: false },
  { name: 'Tight Squeeze', ball: 'L', bx: 464, face: 'L', hy: 311, len: 50, pole: true  }
];

function hoopOf(L) {
  var dir = L.face === 'L' ? -1 : 1;
  return { y: L.hy, dir: dir, backX: L.bx + dir * 5, frontX: L.bx + dir * L.len, bx: L.bx, top: L.hy - 60, bottom: L.hy + 12, pole: L.pole };
}
function buildSegs(L) {
  var h = hoopOf(L), s = [];
  s.push({ ax: L.bx, ay: h.top, bx: L.bx, by: h.bottom, th: 3, e: E_BOARD, tag: 'board' });
  if (L.pole) s.push({ ax: L.bx, ay: h.bottom, bx: L.bx, by: FLOOR, th: 4, e: E_BOARD, tag: 'pole' });
  s.push({ ax: h.frontX, ay: L.hy, bx: h.frontX, by: L.hy, th: RIM_R, e: E_RIM, tag: 'rim' });
  s.push({ ax: h.backX, ay: L.hy, bx: h.backX, by: L.hy, th: RIM_R, e: E_RIM, tag: 'rim' });
  return s;
}
function createWorld(i) {
  var L = LEVELS[i];
  return {
    li: i, ball: { x: L.ball === 'L' ? 60 : 480, y: 400, vx: 0, vy: 0, a: 0 },
    segs: buildSegs(L), hoop: hoopOf(L), time: 0, bounces: 0, started: false,
    scored: false, scoredAt: 0, rimHits: 0, boardHits: 0, sfx: null
  };
}
function collideSeg(w, s) {
  var b = w.ball, abx = s.bx - s.ax, aby = s.by - s.ay, l2 = abx * abx + aby * aby;
  var t = l2 ? ((b.x - s.ax) * abx + (b.y - s.ay) * aby) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  var px = s.ax + abx * t, py = s.ay + aby * t, dx = b.x - px, dy = b.y - py;
  var d = Math.sqrt(dx * dx + dy * dy), m = R + s.th;
  if (d >= m) return;
  if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
  var nx = dx / d, ny = dy / d;
  b.x = px + nx * m; b.y = py + ny * m;
  var vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    b.vx -= (1 + s.e) * vn * nx; b.vy -= (1 + s.e) * vn * ny;
    if (-vn > 70) {
      if (!w.scored) { if (s.tag === 'rim') w.rimHits++; else w.boardHits++; }
      if (w.sfx) w.sfx(s.tag === 'rim' ? 'rim' : 'board', -vn);
    }
  }
}
function stepWorld(w, dt) {
  var b = w.ball, prevY = b.y, i;
  if (w.started && !w.scored) w.time += dt;
  b.vy += G * dt;
  b.vx *= 1 - .10 * dt; b.vy *= 1 - .04 * dt;
  if (w.scored) { b.vx *= 1 - 4 * dt; if (b.vy > 360) b.vy = 360; }
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.a += (b.vx / R) * dt * .8;
  if (b.x < R) { b.x = R; if (b.vx < 0) { if (w.sfx && -b.vx > 120) w.sfx('wall', -b.vx); b.vx = -b.vx * E_WALL; } }
  if (b.x > W - R) { b.x = W - R; if (b.vx > 0) { if (w.sfx && b.vx > 120) w.sfx('wall', b.vx); b.vx = -b.vx * E_WALL; } }
  if (b.y < R) { b.y = R; if (b.vy < 0) b.vy = -b.vy * E_WALL; }
  if (b.y > FLOOR - R) {
    b.y = FLOOR - R;
    if (b.vy > 0) {
      if (w.sfx && b.vy > 160) w.sfx('floor', b.vy);
      b.vy = b.vy > 90 ? -b.vy * E_FLOOR : 0;
    }
    b.vx *= 1 - 1.6 * dt;
  }
  for (i = 0; i < w.segs.length; i++) collideSeg(w, w.segs[i]);
  var h = w.hoop;
  if (!w.scored && prevY < h.y && b.y >= h.y && b.vy > 0) {
    var x0 = Math.min(h.frontX, h.backX), x1 = Math.max(h.frontX, h.backX);
    if (b.x > x0 && b.x < x1) { w.scored = true; w.scoredAt = w.time; if (w.sfx) w.sfx('score', 0); }
  }
}
function tapWorld(w, px, py) {
  if (w.scored) return false;
  var b = w.ball, dx = b.x - px, dy = b.y - py, d = Math.sqrt(dx * dx + dy * dy);
  if (d > TAP_REACH) return false;
  var nx, ny;
  if (d < 4) { nx = 0; ny = -1; } else { nx = dx / d; ny = dy / d; }
  b.vx = b.vx * .2 + nx * TAP_POWER; b.vy = b.vy * .2 + ny * TAP_POWER;
  var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
  if (sp > MAXV) { b.vx *= MAXV / sp; b.vy *= MAXV / sp; }
  w.started = true; w.bounces++;
  return true;
}

if (typeof document === 'undefined') {
  globalThis.__tapin = { LEVELS: LEVELS, createWorld: createWorld, stepWorld: stepWorld, tapWorld: tapWorld, W: W, H: H, R: R, FLOOR: FLOOR, STEP: STEP };
  return;
}

/* ---------- Game shell ---------- */
var $ = function (id) { return document.getElementById(id); };
var cs = getComputedStyle(document.documentElement);
var tok = function (n) { return cs.getPropertyValue(n).trim(); };
var C = {
  wall: tok('--wall'), wall2: tok('--wall-2'), seam: tok('--seam'), floor: tok('--floor'), floorSeam: tok('--floor-seam'),
  paint: tok('--paint'), ball: tok('--ball'), ballHi: tok('--ball-hi'), ballLine: tok('--ball-line'), rim: tok('--rim'),
  pole: tok('--pole'), plate: tok('--plate'), amber: tok('--amber')
};
var DISPLAY = tok('--display'), BODY = tok('--body');
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

var cv = $('cv'), ctx = cv.getContext('2d'), court = $('court'), stage = $('stage');
var ov = $('ov'), card = $('card'), elLvl = $('lvl'), elTime = $('time'), elBn = $('bn'), elBest = $('best');
var S = 1;

var store = { t: [], b: [] };
try {
  var raw = JSON.parse(localStorage.getItem('tapin.v1'));
  if (raw && Array.isArray(raw.t) && Array.isArray(raw.b)) store = raw;
} catch (e) {}
function save() { try { localStorage.setItem('tapin.v1', JSON.stringify(store)); } catch (e) {} }

var li = 0, w = null, st = 'intro', run = [], parts = [], ripples = [], flash = null, scoredTimer = 0, hintOn = true;
var last = 0, acc = 0, shownTime = '', shownBn = -1;

/* ---------- Sound ---------- */
var actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume().catch(function () {});
}
function blip(f0, f1, dur, vol, type, delay) {
  var t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + .02);
}
function sfx(type, v) {
  if (muted || !actx || actx.state !== 'running') return;
  try {
    if (type === 'tap') blip(240, 110, .10, .26, 'sine');
    else if (type === 'floor') blip(130, 60, .13, Math.min(.3, v / 2600), 'sine');
    else if (type === 'wall') blip(300, 200, .05, Math.min(.12, v / 4500), 'triangle');
    else if (type === 'rim') blip(720, 520, .12, .13, 'triangle');
    else if (type === 'board') blip(420, 300, .08, .13, 'triangle');
    else if (type === 'score') { blip(520, 520, .14, .17, 'triangle'); blip(660, 660, .14, .17, 'triangle', .1); blip(880, 880, .24, .19, 'triangle', .2); }
  } catch (e) {}
}

/* ---------- Layout ---------- */
function resize() {
  var r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  var s = Math.min(r.width / W, r.height / H), dpr = Math.min(window.devicePixelRatio || 1, 3);
  court.style.width = Math.floor(W * s) + 'px';
  court.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  S = cv.width / W;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
window.addEventListener('resize', resize);

/* ---------- HUD and overlays ---------- */
function bestText() {
  var t = store.t[li], b = store.b[li];
  return t == null ? 'No best yet' : t.toFixed(1) + 's · ' + b + (b === 1 ? ' bounce' : ' bounces');
}
function syncHud(force) {
  var t = w.time.toFixed(1);
  if (force || t !== shownTime) { elTime.innerHTML = t + '<small>s</small>'; shownTime = t; }
  if (force || w.bounces !== shownBn) { elBn.textContent = w.bounces; shownBn = w.bounces; }
}
function startLevel(i) {
  li = i; w = createWorld(i); w.sfx = sfx; st = 'ready';
  parts = []; ripples = []; flash = null; scoredTimer = 0;
  ov.hidden = true;
  elLvl.innerHTML = (i + 1) + '<small>/' + LEVELS.length + '</small>';
  elBest.textContent = bestText();
  syncHud(true);
}
function showCard(html) { card.innerHTML = html; ov.hidden = false; var p = card.querySelector('.primary'); if (p) p.focus({ preventScroll: true }); }

function showIntro() {
  st = 'intro';
  showCard('<h1>Tap-In</h1>' +
    '<p>Tap near the ball and it flies away from your finger. Get it through the hoop from above.</p>' +
    '<p>Your score is how long it takes and how many bounces you use. Lower is better.</p>' +
    '<button class="btn primary" id="go" type="button">Play</button>');
  $('go').onclick = function () { audio(); startLevel(0); };
}
function showComplete() {
  var t = w.scoredAt, b = w.bounces, pt = store.t[li], pb = store.b[li];
  var newT = pt != null && t < pt, newB = pb != null && b < pb;
  if (pt == null || t < pt) store.t[li] = t;
  if (pb == null || b < pb) store.b[li] = b;
  save();
  run[li] = { t: t, b: b };
  elBest.textContent = bestText();
  var word = w.rimHits === 0 && w.boardHits === 0 ? 'Swish' : w.rimHits === 0 ? 'Bank shot' : 'Rattled in';
  var isLast = li === LEVELS.length - 1;
  showCard('<div class="kicker">Level ' + (li + 1) + ' · ' + LEVELS[li].name + '</div>' +
    '<h2>' + word + '</h2>' +
    '<div class="res"><div><span class="lab">Time</span><span class="val">' + t.toFixed(1) + '<small>s</small></span>' + (newT ? '<em>New best</em>' : '') + '</div>' +
    '<div><span class="lab">Bounces</span><span class="val">' + b + '</span>' + (newB ? '<em>New best</em>' : '') + '</div></div>' +
    '<div class="row"><button class="btn" id="retry" type="button">Retry</button>' +
    '<button class="btn primary" id="next" type="button">' + (isLast ? 'Results' : 'Next level') + '</button></div>');
  $('retry').onclick = function () { startLevel(li); };
  $('next').onclick = function () { if (isLast) showFinal(); else startLevel(li + 1); };
}
function showFinal() {
  var tt = 0, tb = 0, rows = '';
  LEVELS.forEach(function (L, i) {
    var r = run[i];
    if (r) { tt += r.t; tb += r.b; }
    rows += '<tr><td>' + (i + 1) + '</td><td>' + L.name + '</td><td>' + (r ? r.t.toFixed(1) + 's' : '–') + '</td><td>' + (r ? r.b : '–') + '</td></tr>';
  });
  showCard('<h2>All ' + LEVELS.length + ' down</h2>' +
    '<table><thead><tr><th></th><th>Level</th><th>Time</th><th>Bounces</th></tr></thead><tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td></td><td>Total</td><td>' + tt.toFixed(1) + 's</td><td>' + tb + '</td></tr></tfoot></table>' +
    '<button class="btn primary" id="again" type="button">Play again</button>');
  $('again').onclick = function () { run = []; startLevel(0); };
}

function onScore() {
  st = 'scored'; scoredTimer = 0;
  var h = w.hoop, cx = (h.frontX + h.backX) / 2;
  flash = { t: 0, x: cx, y: h.y };
  if (!reduce) {
    var cols = [C.amber, C.paint, C.ball, C.rim];
    for (var i = 0; i < 36; i++) parts.push({ x: cx, y: h.y, vx: (Math.random() - .5) * 460, vy: -60 - Math.random() * 420, life: 1, c: cols[i % 4], s: 3 + Math.random() * 3 });
  }
}

/* ---------- Input ---------- */
cv.addEventListener('pointerdown', function (e) {
  if (st !== 'ready' && st !== 'play') return;
  e.preventDefault();
  audio();
  var r = cv.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
  if (tapWorld(w, px, py)) { st = 'play'; hintOn = false; ripples.push({ x: px, y: py, t: 0, hit: true }); sfx('tap'); }
  else ripples.push({ x: px, y: py, t: 0, hit: false });
});
$('reset').onclick = function () { if (st !== 'intro') startLevel(li); };
$('snd').onclick = function () {
  muted = !muted; audio();
  this.textContent = muted ? 'Sound off' : 'Sound on';
  this.setAttribute('aria-pressed', muted ? 'true' : 'false');
};

/* ---------- Drawing ---------- */
function drawScene(now) {
  var c = ctx, h = w.hoop, b = w.ball, i;
  c.setTransform(S, 0, 0, S, 0, 0);
  c.fillStyle = C.wall; c.fillRect(0, 0, W, H);
  c.strokeStyle = C.seam; c.lineWidth = 2; c.beginPath();
  for (i = 0; i <= W; i += 80) { c.moveTo(i, 0); c.lineTo(i, FLOOR); }
  c.stroke();
  c.fillStyle = C.wall2; c.fillRect(0, FLOOR - 84, W, 84);
  c.fillStyle = C.seam; c.fillRect(0, FLOOR - 84, W, 2);

  c.save();
  c.globalAlpha = .08; c.fillStyle = C.paint; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '900 400px ' + DISPLAY;
  c.fillText(String(li + 1).padStart(2, '0'), W / 2, H * .43);
  c.restore();

  c.fillStyle = C.floor; c.fillRect(0, FLOOR, W, H - FLOOR);
  c.strokeStyle = C.floorSeam; c.lineWidth = 1.5; c.beginPath();
  c.moveTo(0, FLOOR + 16); c.lineTo(W, FLOOR + 16); c.moveTo(0, FLOOR + 28); c.lineTo(W, FLOOR + 28);
  for (i = 0; i < 11; i++) { var vx = i * 52 + 14; c.moveTo(vx, FLOOR + 3); c.lineTo(vx, FLOOR + 16); }
  for (i = 0; i < 10; i++) { var vx2 = i * 52 + 40; c.moveTo(vx2, FLOOR + 16); c.lineTo(vx2, FLOOR + 28); }
  c.stroke();
  c.fillStyle = C.paint; c.fillRect(0, FLOOR, W, 3);

  c.fillStyle = C.paint; c.globalAlpha = .75; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.font = '600 13px ' + BODY;
  if ('letterSpacing' in c) c.letterSpacing = '3px';
  c.fillText(LEVELS[li].name.toUpperCase(), W / 2, 26);
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  c.globalAlpha = 1;

  /* pole and backboard */
  if (h.pole) { c.fillStyle = C.pole; c.fillRect(h.bx - 5, h.bottom, 10, FLOOR - h.bottom); }
  c.fillStyle = C.paint; c.fillRect(h.bx - 4, h.top, 8, h.bottom - h.top);
  c.fillStyle = C.rim; c.fillRect(h.bx - 4, h.y - 20, 8, 20);
  c.strokeStyle = C.rim; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(h.bx, h.y); c.lineTo(h.frontX, h.y); c.stroke();
  c.fillStyle = C.rim; c.beginPath(); c.arc(h.frontX, h.y, 4.5, 0, TAU); c.fill();

  /* ball shadow */
  var air = Math.max(0, Math.min(1, (FLOOR - R - b.y) / 520));
  c.save();
  c.globalAlpha = .32 * (1 - air * .7); c.fillStyle = C.plate;
  c.beginPath(); c.ellipse(b.x, FLOOR + 5, R * (1.05 - air * .5), 3.4 * (1 - air * .4), 0, 0, TAU); c.fill();
  c.restore();

  /* ball */
  c.save();
  c.translate(b.x, b.y);
  var gr = c.createRadialGradient(-R * .35, -R * .4, R * .15, 0, 0, R);
  gr.addColorStop(0, C.ballHi); gr.addColorStop(1, C.ball);
  c.fillStyle = gr; c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();
  c.rotate(b.a);
  c.save();
  c.beginPath(); c.arc(0, 0, R, 0, TAU); c.clip();
  c.strokeStyle = C.ballLine; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(0, -R); c.lineTo(0, R); c.moveTo(-R, 0); c.lineTo(R, 0); c.stroke();
  c.beginPath(); c.arc(-R * 1.5, 0, R * 1.05, 0, TAU); c.stroke();
  c.beginPath(); c.arc(R * 1.5, 0, R * 1.05, 0, TAU); c.stroke();
  c.restore();
  c.restore();
  c.strokeStyle = C.ballLine; c.lineWidth = 1.5; c.beginPath(); c.arc(b.x, b.y, R, 0, TAU); c.stroke();

  /* net sits in front of the ball so a scored ball drops into it */
  var kick = st === 'scored' ? Math.max(0, 1 - scoredTimer / .9) : 0;
  var tt = now / 1000, inset = 8, depth = 32, sway = Math.sin(tt * 26) * 5 * kick;
  var fx = h.frontX, bx2 = h.backX, d = h.dir === -1 ? 1 : -1;
  var blx = fx + (bx2 > fx ? inset : -inset) + sway, brx = bx2 + (bx2 > fx ? -inset : inset) + sway, by = h.y + depth + 8 * kick;
  c.strokeStyle = C.paint; c.globalAlpha = .8; c.lineWidth = 1.4; c.lineCap = 'butt';
  c.beginPath();
  for (i = 0; i < 4; i++) {
    var ta = fx + (bx2 - fx) * i / 4, tb2 = fx + (bx2 - fx) * (i + 1) / 4;
    var ba = blx + (brx - blx) * i / 4, bb = blx + (brx - blx) * (i + 1) / 4;
    c.moveTo(ta, h.y); c.lineTo(bb, by);
    c.moveTo(tb2, h.y); c.lineTo(ba, by);
  }
  for (i = 1; i <= 2; i++) {
    var f = i / 3;
    c.moveTo(fx + (blx - fx) * f, h.y + depth * f);
    c.lineTo(bx2 + (brx - bx2) * f, h.y + depth * f);
  }
  c.stroke();
  c.globalAlpha = 1;
  void d;

  /* rim front cap over the net */
  c.fillStyle = C.rim; c.beginPath(); c.arc(h.frontX, h.y, 4.5, 0, TAU); c.fill();

  /* effects */
  for (i = 0; i < ripples.length; i++) {
    var rp = ripples[i];
    c.globalAlpha = (1 - rp.t / .35) * (rp.hit ? .9 : .35);
    c.strokeStyle = C.paint; c.lineWidth = 2;
    c.beginPath(); c.arc(rp.x, rp.y, 6 + rp.t * 90, 0, TAU); c.stroke();
  }
  if (flash) {
    c.globalAlpha = Math.max(0, 1 - flash.t / .6); c.strokeStyle = C.amber; c.lineWidth = 3;
    c.beginPath(); c.arc(flash.x, flash.y, 18 + flash.t * 150, 0, TAU); c.stroke();
  }
  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    c.globalAlpha = Math.max(0, p.life); c.fillStyle = p.c;
    c.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  c.globalAlpha = 1;

  if (hintOn && st === 'ready' && li === 0) {
    c.fillStyle = C.paint; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.font = '900 34px ' + DISPLAY; c.fillText('TAP THE BALL', W / 2, 620);
    c.font = '600 15px ' + BODY; c.fillText('It flies away from your finger', W / 2, 644);
  }
}

/* ---------- Loop ---------- */
function frame(now) {
  var dt = Math.min(.05, (now - last) / 1000 || 0);
  last = now; acc += dt;
  while (acc >= STEP) {
    stepWorld(w, STEP); acc -= STEP;
    if (w.scored && st === 'play') onScore();
  }
  var i;
  for (i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt; if (ripples[i].t > .35) ripples.splice(i, 1); }
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.1;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (flash) { flash.t += dt; if (flash.t > .6) flash = null; }
  if (st === 'scored') { scoredTimer += dt; if (scoredTimer > 1.0) { st = 'overlay'; showComplete(); } }
  syncHud(false);
  if (cv.width > 0) drawScene(now);
  requestAnimationFrame(frame);
}

w = createWorld(0); w.sfx = sfx;
resize();
syncHud(true);
showIntro();
requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
